<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Fort Builder Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Patrick+Hand&display=swap" rel="stylesheet">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<style>
/* VOICE: playful, inky, toy-box. IDEA: a printer-paper castle kit, the pieces riding a conveyor belt.
   PICTURE: the 3D castle itself fills the screen. COLOUR and TYPE: black, red, blue, yellow from the swatches,
   on paper; Bangers for labels, Patrick Hand for words. LAYOUT: top bar, world, belt dock at the bottom. */
:root{--ink:#161216;--paper:#F4EFE1;--red:#E2231A;--blue:#2A6BF2;--yel:#FFB400;--card:#FFFDF6}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  font:17px/1.3 'Patrick Hand','Comic Sans MS',cursive;color:var(--ink)}
canvas{display:block}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;cursor:pointer}
.b{border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:2px 3px 0 var(--ink);padding:6px 12px;min-height:44px}
.b:active{transform:translate(1px,2px);box-shadow:1px 1px 0 var(--ink)}
.bang{font-family:Bangers,cursive;letter-spacing:1px;font-weight:normal}
#top{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left));
  display:flex;gap:8px;align-items:flex-start;justify-content:space-between;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:2px 3px 0 var(--ink);background:var(--card)}
.seg button{border:0;background:none;padding:6px 14px;min-height:44px;font-family:Bangers,cursive;font-size:21px;letter-spacing:1px}
.seg button.on{background:var(--ink);color:#fff}
#topR{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
#badge{font-family:Bangers,cursive;font-size:16px;letter-spacing:1px;padding:4px 10px;border-radius:10px;border:3px solid var(--ink);background:#fff}
#badge.ok{background:var(--yel)}
#pubB.lock{opacity:.55}
#camB{position:fixed;right:max(10px,env(safe-area-inset-right));top:calc(70px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;z-index:4}
#camB .b{width:46px;padding:0;font-size:22px}
/* dock */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 0 env(safe-area-inset-bottom);background:var(--ink)}
#cat{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--yel);border-top:3px solid var(--ink)}
#cat .b{width:46px;padding:0;font-size:24px;line-height:1}
#catT{flex:1;text-align:center;touch-action:none;cursor:grab}
#catName{display:block;font-family:Bangers,cursive;font-size:28px;letter-spacing:2px;line-height:1}
#catDots{display:flex;justify-content:center;gap:6px;margin-top:3px}
#catDots i{width:9px;height:9px;border-radius:50%;border:2px solid var(--ink)}
#catDots i.on{background:var(--ink)}
#tip{font-size:14px;color:#fff;opacity:.8;text-align:center;padding:4px 10px 0}
#belt{display:flex;gap:10px;overflow-x:auto;overflow-y:hidden;padding:12px 12px 14px;touch-action:pan-x;scroll-snap-type:x proximity;
  background:repeating-linear-gradient(90deg,#2b262c 0 22px,#3a343b 22px 44px);border-top:4px solid #5a5260;border-bottom:4px solid #5a5260;scrollbar-width:none}
#belt::-webkit-scrollbar{display:none}
#belt.slide{animation:slide .28s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.3}}
.card{flex:none;width:92px;border:3px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:0 4px 0 #000;padding:4px 4px 6px;scroll-snap-align:start;touch-action:pan-x}
.card img{width:80px;height:80px;display:block;margin:auto;pointer-events:none}
.card span{display:block;font-size:14px;line-height:1.1;text-align:center;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.on{background:var(--yel);transform:translateY(-6px)}
/* selection panel */
#sel{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 20px));z-index:6;bottom:calc(220px + env(safe-area-inset-bottom));
  background:var(--card);border:3px solid var(--ink);border-radius:18px;box-shadow:3px 4px 0 var(--ink);padding:10px 12px}
#sel h3{margin:0;font-family:Bangers,cursive;font-weight:normal;font-size:24px;letter-spacing:1px;padding-right:44px}
#sel p{margin:2px 0 8px;font-size:15px;opacity:.85}
#sel .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
#sel .row b{font-family:Bangers,cursive;font-weight:normal;letter-spacing:1px;font-size:17px;min-width:62px}
.chip{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:4px 10px;min-height:40px;font-size:16px}
.chip.on{background:var(--ink);color:#fff}
.chip i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid var(--ink);margin-right:5px;vertical-align:-1px}
#selX{position:absolute;right:8px;top:8px;width:40px;height:40px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:18px;padding:0}
/* play hud */
body:not(.play) .play-only,body.play .build-only{display:none!important}
#stat{position:fixed;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));z-index:4;background:var(--card);border:3px solid var(--ink);border-radius:12px;
  padding:3px 12px;font-size:16px;white-space:nowrap;box-shadow:2px 3px 0 var(--ink)}
#joyZone{position:fixed;left:0;bottom:0;width:55%;height:50%;z-index:3;touch-action:none}
#joy{position:fixed;left:calc(24px + env(safe-area-inset-left));bottom:calc(30px + env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;
  border:4px solid var(--ink);background:rgba(255,253,246,.55);z-index:3;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:var(--ink)}
#pbtns{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(24px + env(safe-area-inset-bottom));z-index:4;display:grid;grid-template-columns:auto auto;gap:10px;align-items:end}
#pbtns button{border:4px solid var(--ink);border-radius:50%;box-shadow:2px 4px 0 var(--ink);font-family:Bangers,cursive;letter-spacing:1px;padding:0}
#huffB{width:100px;height:100px;font-size:26px;background:var(--yel);grid-row:span 2}
#eatB{width:74px;height:74px;font-size:21px;background:var(--red);color:#fff;opacity:.35}
#eatB.ready{opacity:1;animation:pulse .7s infinite alternate}
#sneakB{width:74px;height:74px;font-size:17px;background:#fff}
#sneakB.on{background:var(--blue);color:#fff}
@keyframes pulse{to{transform:scale(1.08)}}
#toast{position:fixed;left:50%;top:calc(104px + env(safe-area-inset-top));transform:translateX(-50%);z-index:7;background:var(--ink);color:#fff;border-radius:12px;
  padding:6px 14px;font-size:17px;max-width:calc(100% - 24px);text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:1}
#ov{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(22,18,22,.35);padding:20px}
#ov[hidden]{display:none}
#ov .box{background:var(--card);border:4px solid var(--ink);border-radius:22px;box-shadow:4px 6px 0 var(--ink);padding:18px 20px;max-width:380px;text-align:center}
#ov h2{margin:0 0 4px;font-family:Bangers,cursive;font-weight:normal;font-size:38px;letter-spacing:2px;line-height:1}
#ov p{margin:6px 0 14px}
#ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#ov .b{font-family:Bangers,cursive;font-size:22px;letter-spacing:1px}
#ovA{background:var(--yel)}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;font-size:22px;padding:30px;text-align:center}
@media (max-width:420px){.seg button{padding:6px 10px;font-size:19px}#badge{font-size:14px}}
</style>
</head>
<body>
<div id="top">
  <div class="seg"><button id="mBuild" class="on">BUILD</button><button id="mPlay">INVADE</button></div>
  <div id="topR">
    <span id="badge" class="build-only">Not cleared</span>
    <button id="pubB" class="b bang build-only">Publish</button>
    <button id="resetB" class="b build-only">Reset</button>
    <button id="restartB" class="b play-only">Restart</button>
    <button id="soundB" class="b">Sound on</button>
  </div>
</div>
<div id="camB"><button class="b" id="rotL" aria-label="Turn view left">⟲</button><button class="b" id="rotR" aria-label="Turn view right">⟳</button></div>
<div id="stat" class="play-only"></div>
<div id="sel" class="build-only" hidden><button id="selX" aria-label="Close">✕</button><h3 id="selN"></h3><p id="selI"></p><div id="selC"></div></div>
<div id="dock" class="build-only">
  <div id="cat"><button class="b" id="catL" aria-label="Previous category">‹</button>
    <div id="catT"><b id="catName">Structures</b><span id="catDots"></span></div>
    <button class="b" id="catR" aria-label="Next category">›</button></div>
  <div id="tip">Drag a part up from the belt, or tap it and then tap a tile.</div>
  <div id="belt"></div>
</div>
<div id="joyZone" class="play-only"></div>
<div id="joy" class="play-only"><i></i></div>
<div id="pbtns" class="play-only"><button id="huffB">HUFF</button><button id="eatB">EAT</button><button id="sneakB">SNEAK</button></div>
<div id="toast"></div>
<div id="ov" hidden><div class="box"><h2 id="ovT"></h2><p id="ovP"></p><div class="row"><button class="b" id="ovA"></button><button class="b" id="ovB"></button></div></div></div>
<div id="err">This needs WebGL to run.</div>

<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const $ = id => document.getElementById(id);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
const turnTo = (f, t, m) => f + clamp(wrap(t - f), -m, m);
const CALM = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ======================= grid =======================
const T = 2, N = 14, HALF = N * T / 2;
const key = (x, z) => x + ',' + z;
const inGrid = (x, z) => x >= 0 && z >= 0 && x < N && z < N;
const cx2w = x => (x + 0.5) * T - HALF;
const toCell = (px, pz) => [Math.floor((px + HALF) / T), Math.floor((pz + HALF) / T)];

// ======================= colours =======================
const INK = 0x161216, RED = 0xE2231A, BLUE = 0x2A6BF2, YEL = 0xFFB400, BLK = 0x1C1A20, PIG = 0xFFD6CC, PIG2 = 0xF2A497,
  WHITE = 0xFFFDF6, GREEN = 0x34B24A, IRON = 0x34313C, WOOD = 0x6B4528;
const MAT = { straw: { name: 'Straw', hp: 1, col: 0xF7D046, line: 0xC99A1C }, sticks: { name: 'Sticks', hp: 2, col: 0xC98A4E, line: 0x7A4A22 },
  brick: { name: 'Brick', hp: Infinity, col: 0xD9412E, line: 0xF4E6D0 } };

// ======================= parts =======================
const CATS = [
  { name: 'Structures', parts: ['wall', 'pillar', 'door', 'crate', 'start', 'house'] },
  { name: 'Traps', parts: ['trapdoor', 'cage', 'marbles', 'bell'] },
  { name: 'Guards', parts: ['grunt', 'boxer', 'captain'] },
  { name: 'Decor', parts: ['painting', 'mirror', 'rug', 'plant'] },
];
const P = {
  wall: { name: 'Wall', info: 'Blocks the way and blocks sight. The material decides how many huffs it takes.', mat: true, solid: 1, sight: 1 },
  pillar: { name: 'Pillar', info: 'Brick pillar. Blocks the way and sight. Good cover.', solid: 1, sight: 1 },
  door: { name: 'Door', info: 'Anyone can walk through. Blocks sight while shut.', mat: true, rot: true, sight: 1 },
  crate: { name: 'Crate', info: 'Low cover. A sneaking wolf behind it can\'t be seen.', solid: 1 },
  start: { name: 'Wolf start', info: 'Where the invader comes in. One per castle.', unique: 1, rot: true },
  house: { name: 'THE HOUSE', info: 'The goal. Reach it to clear the castle. One per castle.', unique: 1, solid: 1, sight: 1 },
  trapdoor: { name: 'Trapdoor', info: 'Opens under the wolf. He drops out of the castle.', trap: 1 },
  cage: { name: 'Drop cage', info: 'Drops when the wolf comes within range. Traps him and calls every guard nearby.', trap: 1, range: [0, 2, 1] },
  marbles: { name: 'Marbles', info: 'The wolf slips across them and makes a racket.', trap: 1, range: [0, 1, 0] },
  bell: { name: 'Tripwire bell', info: 'Rings when the wolf comes within range. Guards in earshot come running.', trap: 1, range: [0, 2, 1] },
  grunt: { name: 'Grunt pig', info: 'Average speed and sight. Can be eaten.', guard: 1, rot: true, speed: 2.4, see: 7.5, fov: 1.1, eat: 1 },
  boxer: { name: 'Boxer pig', info: 'Slow and short-sighted, but too big to eat and too heavy to huff over.', guard: 1, rot: true, speed: 1.8, see: 5.5, fov: 1.3, heavy: 1 },
  captain: { name: 'Captain pig', info: 'Sees far and always calls for help. Other pigs can follow him.', guard: 1, rot: true, speed: 2.2, see: 9.5, fov: 0.95, eat: 1, leader: 1 },
  painting: { name: 'Painting', info: 'Something nice to look at. Blocks the tile and sight.', rot: true, solid: 1, sight: 1 },
  mirror: { name: 'Mirror', info: 'A guard who can see the mirror also sees a wolf standing near it.', rot: true, solid: 1 },
  rug: { name: 'Rug', info: 'Muffles footsteps. The wolf can run across it quietly.' },
  plant: { name: 'Bush', info: 'A sneaking wolf inside it is hidden. Guards walk around it.' },
};
const ORDERS = { watch: 'Watch', patrol: 'Patrol', follow: 'Follow' };

// ======================= renderer =======================
let renderer;
try { renderer = new THREE.WebGLRenderer({ antialias: true }); }
catch (e) { $('err').style.display = 'flex'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.prepend(renderer.domElement);
const cvs = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xF4EFE1);
const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 300);
const effect = new OutlineEffect(renderer, { defaultThickness: 0.006, defaultColor: [0.086, 0.07, 0.086] });
scene.add(new THREE.AmbientLight(0xffffff, 1.05));
const sun = new THREE.DirectionalLight(0xffffff, 2.1); sun.position.set(9, 22, 12); scene.add(sun);

const ramp = new THREE.DataTexture(new Uint8Array([135, 205, 255]), 3, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const mc = {};
function toon(c, line = true) {
  const k = c + (line ? 'o' : 'n');
  if (!mc[k]) { mc[k] = new THREE.MeshToonMaterial({ color: c, gradientMap: ramp }); mc[k].flatShading = true; if (!line) mc[k].userData.outlineParameters = { visible: false }; }
  return mc[k];
}
function flat(c, op = 1, side = THREE.FrontSide) {
  const m = new THREE.MeshBasicMaterial({ color: c, transparent: op < 1, opacity: op, depthWrite: op >= 1, side });
  m.userData.outlineParameters = { visible: false }; return m;
}
const BOX = (x, y, z) => new THREE.BoxGeometry(x, y, z);
const CYL = (a, b, h, s = 8) => new THREE.CylinderGeometry(a, b, h, s);
const SPH = (r, w = 10, h = 7) => new THREE.SphereGeometry(r, w, h);
const CONE = (r, h, s = 7) => new THREE.ConeGeometry(r, h, s);
function part(geo, mat, parent, pos = [0, 0, 0], rot = null, scl = null) {
  const m = new THREE.Mesh(geo, typeof mat === 'number' ? toon(mat) : mat);
  m.position.set(...pos); if (rot) m.rotation.set(...rot); if (scl) m.scale.set(...scl); parent.add(m); return m;
}
function pivot(parent, pos = [0, 0, 0]) { const g = new THREE.Group(); g.position.set(...pos); parent.add(g); return g; }
function blob(parent, r) { const m = part(new THREE.CircleGeometry(r, 16), flat(INK, 0.18), parent, [0, 0.02, 0], [-Math.PI / 2, 0, 0]); m.renderOrder = 1; return m; }

// text sprites
const texCache = {};
function textTex(text, bg, fg) {
  const k = text + bg + fg; if (texCache[k]) return texCache[k];
  const c = document.createElement('canvas'), x = c.getContext('2d'), f = '44px Bangers, sans-serif';
  x.font = f; const w = Math.ceil(x.measureText(text).width) + 36; c.width = w; c.height = 64;
  x.font = f; const rr = (a, b, c2, d, r) => { x.beginPath(); if (x.roundRect) x.roundRect(a, b, c2, d, r); else x.rect(a, b, c2, d); x.fill(); };
  x.fillStyle = '#161216'; rr(0, 0, w, 64, 18); x.fillStyle = bg; rr(5, 5, w - 10, 54, 14);
  x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, w / 2, 35);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.userData = { aspect: w / 64 };
  return (texCache[k] = t);
}
function sprite(text, bg = '#fff', fg = '#161216', h = 0.55) {
  const m = new THREE.SpriteMaterial({ map: textTex(text, bg, fg), depthTest: false, transparent: true });
  m.userData.outlineParameters = { visible: false };
  const s = new THREE.Sprite(m); s.renderOrder = 10; s.userData.h = h; setSprite(s, text, bg, fg); return s;
}
function setSprite(s, text, bg = '#fff', fg = '#161216') {
  const t = textTex(text, bg, fg); s.material.map = t; s.material.needsUpdate = true; s.scale.set(s.userData.h * t.userData.aspect, s.userData.h, 1);
}

// ======================= ground =======================
{
  part(new THREE.PlaneGeometry(240, 240), flat(0xE9E1CC), scene, [0, -0.02, 0], [-Math.PI / 2, 0, 0]);
  part(new THREE.PlaneGeometry(N * T, N * T), flat(0xFBF8EE), scene, [0, 0, 0], [-Math.PI / 2, 0, 0]);
  const pts = [];
  for (let i = 0; i <= N; i++) { const v = i * T - HALF; pts.push(v, 0.01, -HALF, v, 0.01, HALF, -HALF, 0.01, v, HALF, 0.01, v); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  const lm = new THREE.LineBasicMaterial({ color: INK, transparent: true, opacity: 0.13 }); lm.userData.outlineParameters = { visible: false };
  scene.add(new THREE.LineSegments(g, lm));
  for (const [x, z, w, d] of [[0, -HALF - .15, N * T + .6, .3], [0, HALF + .15, N * T + .6, .3], [-HALF - .15, 0, .3, N * T], [HALF + .15, 0, .3, N * T]])
    part(BOX(w, .12, d), toon(INK, false), scene, [x, .06, z]);
}

// ======================= models =======================
function wallModel(g, m) {
  const M = MAT[m] || MAT.brick;
  part(BOX(T, 1.7, T), M.col, g, [0, .85, 0]);
  const L = toon(M.line, false);
  if (m === 'straw') { for (const y of [.45, .9, 1.35]) part(BOX(T + .05, .07, T + .05), L, g, [0, y, 0]); part(BOX(T + .12, .14, T + .12), toon(0xFFE27A), g, [0, 1.72, 0]); }
  else if (m === 'sticks') { for (const x of [-.62, 0, .62]) part(BOX(.12, 1.74, T + .05), L, g, [x, .87, 0]); part(BOX(T + .06, .1, T + .06), L, g, [0, 1.2, 0]); }
  else { for (const y of [.42, .85, 1.28]) part(BOX(T + .04, .06, T + .04), L, g, [0, y, 0]); for (const [x, y] of [[-.4, .63], [.5, .63], [0, 1.06], [-.6, 1.5], [.45, 1.5], [.15, .2]]) part(BOX(.06, .37, T + .04), L, g, [x, y, 0]); }
}
function pigModel(kind) {
  const g = new THREE.Group(), body = pivot(g), s = kind === 'boxer' ? 1.3 : kind === 'captain' ? 1.08 : 1;
  body.scale.setScalar(s); blob(g, .55 * s);
  const legs = [];
  for (const k of [-1, 1]) { const h = pivot(body, [k * .17, .32, 0]); part(CYL(.1, .11, .3), PIG, h, [0, -.15, 0]); part(SPH(.13), kind === 'captain' ? YEL : INK, h, [0, -.3, .05], null, [1, .6, 1.4]); legs.push(h); }
  part(SPH(.44), PIG, body, [0, .66, 0], null, [1, .95, .9]);
  if (kind === 'boxer') { part(CYL(.42, .46, .38, 10), BLUE, body, [0, .5, 0]); for (const k of [-1, 1]) part(BOX(.08, .5, .05), BLUE, body, [k * .2, .85, .37], [-.2, 0, 0]); }
  if (kind === 'captain') { part(BOX(.75, .85, .06), RED, body, [0, .78, -.38], [.12, 0, 0]); part(new THREE.TorusGeometry(.32, .04, 4, 10, Math.PI), toon(0xC9C3B8), body, [0, 1.0, .1], [Math.PI / 2 + .25, 0, Math.PI]); }
  const arms = [];
  for (const k of [-1, 1]) {
    const a = pivot(body, [k * .45, .82, 0]); part(SPH(.12), PIG, a, [0, -.12, 0]); arms.push(a);

function wolfTick(dt) {

const clock = new THREE.Clock();

(async () => {
