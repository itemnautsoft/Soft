<script type="module">
// PAWNBALL 3D — an Itemnaut game by itemnaut.
// Pull back on a pawn, let go. Every friend you bump adds +1 to the hit.
// Bonk the uniforms until the helmet pops; whoever is inside joins you.
// Nobody crosses the board alone. Drag the empty board to look around.
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const INK = '#1b1b1b', PAPER = '#fbf8ef', SKY = '#dcf1ff';
const HL = { yellow:'#fff04d', green:'#8dff5c', orange:'#ff9d3d', blue:'#5cc8ff', pink:'#ff5aa8', lav:'#c8b6ff' };
const SHADE = { '#fff04d':'#d9c200', '#8dff5c':'#46c522', '#ff9d3d':'#de6510', '#5cc8ff':'#2a90d0', '#ff5aa8':'#d02a78' };
const HCOL = [HL.orange, HL.green, HL.blue, HL.yellow, HL.pink];
const FURS = ['#f0c999', '#e6e6e6', '#e8a86a', '#6a6a6a'];
const FONT = '"Arial Black","Arial Rounded MT Bold",Impact,system-ui,sans-serif';
const N = 8, R = 0.34, GR = 0.4, TEAM_MAX = 14;

let calm = false, soundOn = true, best = 0;
try {
  best = +localStorage.getItem('pawnball.best') || 0;
  calm = localStorage.getItem('pawnball.calm') === '1';
  soundOn = localStorage.getItem('pawnball.sound') !== '0';
} catch (e) {}
function save(k, v) { try { localStorage.setItem('pawnball.' + k, v); } catch (e) {} }

// ================= three setup =================
const glc = document.getElementById('gl'), ui = document.getElementById('ui'), g2 = ui.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
const effect = new OutlineEffect(renderer, { defaultThickness: 0.0055, defaultColor: [0.08, 0.08, 0.08] });
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 300);
scene.add(new THREE.AmbientLight(0xffffff, 2.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.7); sun.position.set(6, 12, 8); scene.add(sun);
const NO_OUTLINE = { visible: false };
const wv = (x, z, y) => new THREE.Vector3(x - 4, y || 0, 4 - z);

// ---------- geometry building: many coloured parts merged into one mesh ----------
const _m = new THREE.Matrix4(), _q = new THREE.Quaternion(), _e = new THREE.Euler(), _c = new THREE.Color();
function P(geo, col, pos, rot, scl) { return { geo, col, pos: pos || [0, 0, 0], rot: rot || [0, 0, 0], scl: scl || [1, 1, 1] }; }
function merge(parts) {
  const pos = [], nor = [], col = [];
  for (const p of parts) {
    let g = p.geo.index ? p.geo.toNonIndexed() : p.geo.clone();
    g.deleteAttribute('uv');
    _m.compose(new THREE.Vector3(...p.pos), _q.setFromEuler(_e.set(...p.rot)), new THREE.Vector3(...p.scl));
    g.applyMatrix4(_m);
    _c.set(p.col);
    const a = g.attributes.position.array, n = g.attributes.normal.array;
    for (let i = 0; i < a.length; i++) { pos.push(a[i]); nor.push(n[i]); }
    for (let i = 0; i < a.length / 3; i++) col.push(_c.r, _c.g, _c.b);
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  out.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  return out;
}
const MAT = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
const INKMAT = new THREE.MeshBasicMaterial({ color: INK });
const SPH = (r, w, h) => new THREE.SphereGeometry(r, w || 8, h || 6);
const ICO = (r, d) => new THREE.IcosahedronGeometry(r, d || 1);
const CYL = (a, b, h, s) => new THREE.CylinderGeometry(a, b, h, s || 8);
const CONE = (r, h, s) => new THREE.ConeGeometry(r, h, s || 4);
const BOX = (x, y, z) => new THREE.BoxGeometry(x, y, z);

const geoCache = new Map();
function cached(key, fn) { if (!geoCache.has(key)) geoCache.set(key, fn()); return geoCache.get(key); }
function dogGeo(col) {
  return cached('dog' + col, () => {
    const dk = SHADE[col] || col;
    const lathe = new THREE.LatheGeometry([new THREE.Vector2(0.33, 0.08), new THREE.Vector2(0.3, 0.2), new THREE.Vector2(0.22, 0.38), new THREE.Vector2(0.16, 0.52)].map(v => v), 10);
    return merge([
      P(CYL(0.33, 0.35, 0.08, 10), dk, [0, 0.04, 0]),
      P(lathe, col),
      P(CYL(0.2, 0.2, 0.07, 10), dk, [0, 0.55, 0]),
      P(ICO(0.21, 1), col, [0, 0.74, 0]),
      P(SPH(0.17), '#f6e3c4', [0, 0.32, 0.15]),
      P(SPH(0.085), '#fff6e6', [0, 0.28, 0.29], 0, [1, 0.75, 0.8]),
      P(SPH(0.035, 6, 4), INK, [0, 0.31, 0.36]),
      P(BOX(0.07, 0.24, 0.14), '#7a5536', [-0.25, 0.37, 0.04], [0, 0, 0.35]),
      P(BOX(0.07, 0.24, 0.14), '#7a5536', [0.25, 0.37, 0.04], [0, 0, -0.35]),
    ]);
  });
}
const dogEyes = () => cached('dogEyes', () => merge([P(SPH(0.03, 6, 4), INK, [-0.07, 0.39, 0.29]), P(SPH(0.03, 6, 4), INK, [0.07, 0.39, 0.29])]));
function catGeo(col, fur) {
  return cached('cat' + col + fur, () => merge([
    P(CYL(0.19, 0.29, 0.44, 8), col, [0, 0.22, 0], [0, Math.PI / 8, 0]),
    P(ICO(0.25, 1), fur, [0, 0.62, 0], 0, [1, 0.88, 0.95]),
    P(CONE(0.085, 0.17, 4), fur, [-0.14, 0.84, 0], [0, 0, 0.35]),
    P(CONE(0.085, 0.17, 4), fur, [0.14, 0.84, 0], [0, 0, -0.35]),
    P(SPH(0.035, 6, 4), HL.pink, [0, 0.6, 0.235]),
    P(BOX(0.2, 0.014, 0.014), fur === '#6a6a6a' ? '#ffffff' : INK, [-0.2, 0.57, 0.18], [0, 0.3, 0.1]),
    P(BOX(0.2, 0.014, 0.014), fur === '#6a6a6a' ? '#ffffff' : INK, [0.2, 0.57, 0.18], [0, -0.3, -0.1]),
    P(new THREE.TorusGeometry(0.17, 0.035, 4, 8, Math.PI), fur, [0, 0.22, -0.3], [0, Math.PI / 2, 0]),
  ]));
}
const catEyes = () => cached('catEyes', () => merge([P(SPH(0.032, 6, 4), INK, [-0.095, 0.66, 0.21]), P(SPH(0.032, 6, 4), INK, [0.095, 0.66, 0.21])]));
function helmetParts() {
  const r8 = [0, Math.PI / 8, 0], parts = [
    P(CYL(0.38, 0.4, 0.08), '#737985', [0, 0.04, 0], r8),
    P(CYL(0.31, 0.35, 0.8), '#9aa0ab', [0, 0.48, 0], r8),
    P(CYL(0.37, 0.35, 0.1), '#9aa0ab', [0, 0.92, 0], r8),
    P(CYL(0.358, 0.358, 0.04), '#4a4e57', [0, 0.25, 0], r8),
  ];
  for (let k = 0; k < 4; k++) { const a = Math.PI / 4 + k * Math.PI / 2; parts.push(P(BOX(0.15, 0.14, 0.15), '#9aa0ab', [Math.sin(a) * 0.27, 1.04, Math.cos(a) * 0.27], [0, a, 0])); }
  return parts;
}
const goonGeo = () => cached('goon', () => merge([...helmetParts(),
  P(SPH(0.2), '#f0c999', [0, 0.56, 0.2], 0, [1, 0.9, 0.7]),
  P(CONE(0.07, 0.16, 4), '#f0c999', [-0.12, 1.08, 0], [0, 0, 0.3]),
  P(CONE(0.07, 0.16, 4), '#f0c999', [0.12, 1.08, 0], [0, 0, -0.3]),
  P(BOX(0.075, 0.016, 0.02), INK, [-0.075, 0.6, 0.335]), P(BOX(0.075, 0.016, 0.02), INK, [0.075, 0.6, 0.335]),
  P(SPH(0.028, 6, 4), HL.pink, [0, 0.54, 0.345]),
]));
const helmetGeo = () => cached('helmet', () => merge(helmetParts()));

// ---------- textures: numbers, badges, comic bursts ----------
const texCache = new Map();
function canvasTex(key, w, h, paint) {
  if (texCache.has(key)) return texCache.get(key);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  texCache.set(key, t); return t;
}
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); }
function numTex(text, kind) {
  return canvasTex(kind + ':' + text, 128, 128, (g) => {
    if (kind !== 'ink') { g.fillStyle = kind === 'warn' ? HL.pink : '#fff'; g.strokeStyle = INK; g.lineWidth = 9; rr(g, 8, 20, 112, 88, 16); g.fill(); g.stroke(); }
    const s = String(text);
    g.fillStyle = INK; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.font = `900 ${s.length > 1 ? 64 : 84}px ${FONT}`; g.fillText(s, 64, 68);
  });
}
function starPath(g, x, y, r1, r2, n) {
  g.beginPath();
  for (let i = 0; i < n * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; g.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
  g.closePath();
}
function powTex(text, col) {
  return canvasTex('pow:' + text + col, 256, 256, (g) => {
    g.fillStyle = col; g.strokeStyle = INK; g.lineWidth = 8; g.lineJoin = 'round';
    starPath(g, 128, 128, 122, 84, 12); g.fill(); g.stroke();
    let fs = 56; g.font = `900 ${fs}px ${FONT}`;
    while (g.measureText(text).width > 200 && fs > 20) { fs -= 2; g.font = `900 ${fs}px ${FONT}`; }
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.save(); g.translate(128, 128); g.rotate(-0.12);
    g.fillStyle = INK; g.fillText(text, 4, 5);
    g.lineWidth = fs * 0.2; g.strokeText(text, 0, 0); g.fillStyle = '#fff'; g.fillText(text, 0, 0); g.restore();
  });
}
function tagTex(text) {
  return canvasTex('tag:' + text, 128, 64, (g) => {
    g.font = `900 46px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    g.fillStyle = INK; g.fillText(text, 67, 35); g.lineWidth = 9; g.strokeStyle = INK; g.strokeText(text, 64, 32);
    g.fillStyle = HL.yellow; g.fillText(text, 64, 32);
  });
}

// ---------- the world ----------
function buildWorld() {
  // ground: printer paper
  // one sheet of printer paper floating in the sky, the board sitting on it like a diorama
  const ground = new THREE.Mesh(BOX(12.5, 0.08, 14.5), new THREE.MeshBasicMaterial({ color: PAPER }));
  ground.position.set(0, -0.5, -0.4); ground.rotation.y = 0.035; scene.add(ground);
  // slab
  const slab = new THREE.Mesh(BOX(8.36, 0.4, 8.36), new THREE.MeshLambertMaterial({ color: HL.orange, flatShading: true }));
  slab.position.y = -0.26; scene.add(slab);
  // tiles, grid ink and the line to cross
  const parts = [];
  for (let z = 0; z < N; z++) for (let x = 0; x < N; x++) {
    const dark = (x + z) % 2 === 1;
    let c = dark ? '#c9f7a8' : PAPER;
    if (z === 0) c = dark ? '#f2e96a' : '#fff9c2';
    if (z === N - 1) c = dark ? '#ffc58a' : '#ffe6cc';
    parts.push(P(BOX(1, 0.06, 1), c, [x - 3.5, -0.03, 3.5 - z]));
  }
  for (let i = 0; i <= N; i++) {
    const w = i === 0 || i === N ? 0.07 : 0.03;
    parts.push(P(BOX(w, 0.012, 8.02), INK, [i - 4, 0.002, 0]));
    parts.push(P(BOX(8.02, 0.012, w), INK, [0, 0.002, 4 - i]));
  }
  for (let i = 0; i < 16; i++) parts.push(P(BOX(0.3, 0.02, 0.09), HL.pink, [-3.75 + i * 0.5, 0.008, -4]));
  const tiles = new THREE.Mesh(merge(parts), new THREE.MeshBasicMaterial({ vertexColors: true }));
  tiles.material.userData.outlineParameters = NO_OUTLINE; scene.add(tiles);
  // sign on the paper beyond the far edge
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(4.2, 0.7), new THREE.MeshBasicMaterial({ transparent: true, map: canvasTex('sign', 512, 86, g => {
    g.font = `900 52px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = INK; g.fillText('THE OTHER SIDE', 256, 46);
  }) }));
  sign.material.userData.outlineParameters = NO_OUTLINE;
  sign.rotation.x = -Math.PI / 2; sign.position.set(0, -0.455, -4.85); scene.add(sign);
  // sun and clouds
  const sunM = new THREE.Mesh(ICO(1.9, 1), new THREE.MeshBasicMaterial({ color: HL.yellow }));
  sunM.position.set(-6.5, -4.5, -28); scene.add(sunM);
  for (let i = 0; i < 5; i++) {
    const cl = new THREE.Mesh(merge([P(ICO(1.6, 1), '#ffffff', [0, 0, 0], 0, [1.6, 0.7, 1]), P(ICO(1.2, 1), '#ffffff', [1.6, 0.5, 0], 0, [1.2, 0.8, 1]), P(ICO(1, 1), '#ffffff', [-1.7, 0.2, 0.2], 0, [1.1, 0.7, 1])]), MAT);
    cl.position.set(-30 + i * 14 + Math.random() * 5, -13 + i % 3 * 4 + Math.random() * 2, -25 - Math.random() * 8);
    cl.userData.v = 0.25 + Math.random() * 0.35; clouds.push(cl); scene.add(cl);
  }
  // the arm: only as strong as the uniforms on the board. The rest of him never shows up.
  arm.root = new THREE.Group(); arm.root.position.set(2.5, -8.5, -26); arm.root.scale.setScalar(0.62); arm.root.rotation.y = -0.25;
  const sleeveMat = new THREE.MeshLambertMaterial({ color: '#9aa0ab', flatShading: true });
  const skin = new THREE.MeshLambertMaterial({ color: HL.lav, flatShading: true });
  const upper = new THREE.Mesh(CYL(1.0, 1.15, 16, 8), sleeveMat); upper.rotation.z = Math.PI / 2; upper.position.x = 8; arm.root.add(upper);
  for (let i = 0; i < 3; i++) {
    const ch = new THREE.Mesh(BOX(0.25, 0.9, 0.2), new THREE.MeshLambertMaterial({ color: '#4a4e57' }));
    ch.position.set(5.2 + i * 0.6, 0.2, 1.05); ch.rotation.z = 0.5; arm.root.add(ch);
  }
  arm.bicep = new THREE.Mesh(ICO(1, 1), sleeveMat); arm.bicep.position.set(2.6, 0.5, 0); arm.root.add(arm.bicep);
  arm.fore = new THREE.Group(); arm.root.add(arm.fore);
  const fm = new THREE.Mesh(CYL(0.8, 0.95, 5.4, 8), skin); fm.position.y = 2.7; arm.fore.add(fm);
  const fist = new THREE.Mesh(ICO(1.3, 1), skin); fist.position.y = 5.8; arm.fore.add(fist);
  const elbow = new THREE.Mesh(ICO(1.05, 1), skin); arm.root.add(elbow);
  scene.add(arm.root);
}
const clouds = [], arm = { r: 1, v: 0 };
buildWorld();

// aim dots + selection ring
const dots = [];
const dotGeo = CYL(0.07, 0.07, 0.02, 10);
const dotMats = [new THREE.MeshBasicMaterial({ color: HL.pink }), new THREE.MeshBasicMaterial({ color: INK })];
for (const m of dotMats) m.userData.outlineParameters = NO_OUTLINE;
for (let i = 0; i < 26; i++) { const d = new THREE.Mesh(dotGeo, dotMats[i % 2]); d.visible = false; scene.add(d); dots.push(d); }
const selRing = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.56, 28), new THREE.MeshBasicMaterial({ color: HL.yellow, side: THREE.DoubleSide }));
selRing.material.userData.outlineParameters = NO_OUTLINE; selRing.rotation.x = -Math.PI / 2; scene.add(selRing);
const selInk = new THREE.Mesh(new THREE.RingGeometry(0.56, 0.6, 28), INKMAT.clone());
selInk.material.userData.outlineParameters = NO_OUTLINE; selInk.rotation.x = -Math.PI / 2; scene.add(selInk);

// ---------- sound ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
const sndT = {};
function tone(f, d, type, v, f2, delay, key) {
  if (!soundOn || !AC) return;
  if (key) { const n = performance.now(); if (sndT[key] && n - sndT[key] < 45) return; sndT[key] = n; }
  const t0 = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, t0);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + d);
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v || 0.12, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
  o.connect(g).connect(AC.destination); o.start(t0); o.stop(t0 + d + 0.03);
}
const arp = (notes, gap, type, v) => notes.forEach((f, i) => tone(f, 0.18, type || 'triangle', v || 0.1, 0, i * gap));

// ================= game state & rules =================
let pieces = [], goons = [], fx = [], bubbles = [], leavers = [], pops = [], goers = [];
let nextNum = 1, state = 'title', turn = 0, score = 0, freed = 0, crossed = 0;
let shot = null, rollT = 0, stillT = 0, advT = 0, selected = null, aim = null;
let shake = 0, t = 0, overT = 0, idleT = 0, everAimed = false;

function mkPiece(kind, x, z) {
  return { kind, x, z, vx:0, vz:0, y:0, vy:0, num: nextNum++, col: HCOL[(nextNum * 3) % HCOL.length],
    fur: FURS[(Math.random() * FURS.length) | 0], sq:0, sqv:0, blink: 1 + Math.random() * 4, star:false,
    happy:0, id: Math.random(), badge:0, face: 0 };
}
function spawnRow() {
  const n = Math.min(7, 1 + Math.floor(turn / 3) + (Math.random() < 0.35 ? 1 : 0));
  const cols = [0,1,2,3,4,5,6,7].sort(() => Math.random() - 0.5).slice(0, n);
  for (const c of cols) {
    if (goons.some(g => Math.abs(g.x - (c + 0.5)) < 0.1 && g.z > 6.9)) continue;
    let hp = 1 + Math.floor(Math.random() * (1 + turn / 3.5));
    if (turn > 5 && Math.random() < 0.12) hp += 3;
    goons.push({ x: c + 0.5, z: 7.5, hz: 7.5, y: 1.6 + Math.random() * 0.8, vy: 0, hop: 0, hp, max: hp, sh: 0, id: Math.random(), hits: {} });
  }
}
function newGame() {
  pieces = []; goons = []; fx = []; bubbles = []; leavers = []; pops = []; goers = [];
  nextNum = 1; turn = 0; score = 0; freed = 0; crossed = 0; shot = null; aim = null;
  for (const x of [2.4, 4, 5.6]) { const p = mkPiece('dog', x, 0.9); p.y = 2 + Math.random(); pieces.push(p); }
  selected = pieces[1];
  spawnRow(); goons.forEach(g => { g.z = g.hz = 6.5; });
  spawnRow();
  state = 'aim'; overT = 0;
}

const rnd = a => a[(Math.random() * a.length) | 0];
const FREE_LINES = ['Wait. Same side?', 'Shift’s over.', 'Ugh, that helmet itched.', 'Never even met the guy.', 'Oh. Hi. Snacks?', 'I just needed the job.', 'Do I still get dental?'];
const CLOCK_LINES = ['Gotta make rent…', 'Back after this shift.', 'Hold my spot?', 'Just till the car’s paid off.'];
const HOME_LINES = ['Team’s full? I’ll head home.', 'Taking the day off. Forever.', 'Going to go see the ocean.', 'Gonna go learn guitar.'];
const CROSS_LINES = ['Made it! Thanks, all.', 'Couldn’t do it alone.', 'Your turn next.', 'Look at the view!'];
function say(p, text, life) { bubbles = bubbles.filter(b => b.p !== p); if (bubbles.length >= 3) bubbles.shift(); bubbles.push({ p, text, life: life || 2.4, max: life || 2.4 }); }
function addFx(o) { fx.push(Object.assign({ life: 0.7, max: 0.7 }, o)); }
function kick(a) { if (!calm) shake = Math.min(0.35, shake + a * 0.025); }
function support() { return shot ? shot.touched.size - 1 : 0; }
function power(p) { return 1 + support() + (p.star ? 1 : 0); }
function touchFriend(p) {
  if (!shot || shot.touched.has(p.id)) return;
  shot.touched.add(p.id);
  addFx({ type:'tag', x:p.x, z:p.z, y:1.3, text:'+1', life:0.9, max:0.9 });
  shot.shooter.badge = 1;
  tone(520 + support() * 70, 0.12, 'triangle', 0.1, 0, 0, 'sup');
}

function physics(dt) {
  const toCross = [];

    else { const s = 0.4 + k * (calm ? 0.8 : 1.8); o.scale.setScalar(s); o.rotation.set(t * 2, t * 3, 0); for (const l of o.children) l.material.opacity = 1 - k; }
  }
  for (const [f, o] of fxLive) if (!o.userData.seen) { scene.remove(o); fxLive.delete(f); if (o.material) o.material.dispose(); else o.children.forEach(l => l.material.dispose()); } else o.userData.seen = false;
}
const popLive = new Map();
function syncPops() {
  for (const Pp of pops) {
    let m = popLive.get(Pp);
    if (!m) { const mat = MAT.clone(); mat.transparent = true; mat.userData.outlineParameters = { alpha: 1 }; m = new THREE.Mesh(helmetGeo(), mat); scene.add(m); popLive.set(Pp, m); }
    m.userData.seen = true;
    m.position.copy(wv(Pp.x, Pp.z, Pp.y)); m.rotation.set(Pp.rx, 0, Pp.rz);
    const a = Math.min(1, Pp.life * 2); m.material.opacity = a; m.material.userData.outlineParameters.alpha = a;
  }
  for (const [Pp, m] of popLive) if (!m.userData.seen) { scene.remove(m); m.material.dispose(); popLive.delete(Pp); } else m.userData.seen = false;
}
function syncScene(dt) {
  for (const c of live.values()) c.seen = false;
  for (const p of pieces) syncPiece(p, dt);
  for (const L of leavers) { const a = Math.max(0, 1 - L.t / 2.6); syncPiece(L.p, dt, 'leave', a); syncGoon(L.g, a); }
  for (const G of goers) syncPiece(G.p, dt, 'go', Math.max(0, Math.min(1, (2.4 - G.t) * 2)));
  for (const g of goons) syncGoon(g);
  for (const [o, c] of live) if (!c.seen) { dropCharacter(c); live.delete(o); }
  syncFx(); syncPops();
  // selection + aim preview
  const showSel = state === 'aim' && selected && pieces.includes(selected);
  selRing.visible = selInk.visible = !!showSel;
  if (showSel) {
    const s = 1 + Math.sin(t * 5) * 0.08;
    selRing.position.copy(wv(selected.x, selected.z, 0.012)); selInk.position.copy(selRing.position);
    selRing.scale.set(s, s, 1); selInk.scale.set(s, s, 1);
  }
  let shown = 0;
  if (showSel && aim && aim.mode === 'aim') {
    const v = aimVec(aim);
    if (v && v.scr > 12) {
      let x = selected.x, z = selected.z, dx = v.dx, dz = v.dz;
      const len = 1.2 + v.pw * 4.2, step = 0.28;
      for (let d = 0; d < len && shown < dots.length; d += step) {
        x += dx * step; z += dz * step;
        if (x < R || x > N - R) { dx = -dx; x = Math.max(R, Math.min(N - R, x)); }
        if (z < R || z > N - R) { dz = -dz; z = Math.max(R, Math.min(N - R, z)); }
        const dm = dots[shown++]; dm.visible = true; dm.position.copy(wv(x, z, 0.02));
      }
    }
  }
  for (let i = shown; i < dots.length; i++) dots[i].visible = false;
  // sky
  for (const cl of clouds) { cl.position.x += cl.userData.v * dt; if (cl.position.x > 40) cl.position.x = -40; }
  const f = Math.min(1, (arm.S || 0) / 10);
  arm.bicep.scale.set(arm.r * 1.15, arm.r * (0.6 + 0.5 * f), arm.r);
  arm.bicep.position.y = 0.3 + 0.5 * f * arm.r;
  arm.fore.rotation.z = 2.5 + (0.35 - 2.5) * f + Math.sin(t * 2) * 0.03 * f;
}

// ================= 2D overlay: HUD, band, bubbles, panels =================
function label(txt, x, y, size, fill, stroke, drop) {
  g2.font = `${size}px ${FONT}`; g2.textAlign = 'center'; g2.textBaseline = 'middle'; g2.lineJoin = 'round';
  if (drop) { g2.fillStyle = INK; g2.fillText(txt, x + drop, y + drop); }
  if (stroke) { g2.lineWidth = Math.max(2, size * 0.18); g2.strokeStyle = INK; g2.strokeText(txt, x, y); }
  g2.fillStyle = fill; g2.fillText(txt, x, y);
}
function rr2(x, y, w, h, r) { g2.beginPath(); g2.roundRect ? g2.roundRect(x, y, w, h, r) : g2.rect(x, y, w, h); }
const btns = [];
function drawHUD() {
  const L = (W - Math.min(W, H * 0.64)) / 2, VW = Math.min(W, H * 0.64), top = Math.max(14, 14 * U0);
  g2.textAlign = 'left'; g2.textBaseline = 'top'; g2.lineJoin = 'round';
  g2.font = `${Math.round(34 * U0)}px ${FONT}`;
  g2.fillStyle = INK; g2.fillText(String(score), L + 16 * U0 + 3, top + 3);
  g2.lineWidth = 5; g2.strokeStyle = INK; g2.strokeText(String(score), L + 16 * U0, top);
  g2.fillStyle = '#fff'; g2.fillText(String(score), L + 16 * U0, top);
  g2.font = `${Math.round(12 * U0)}px ${FONT}`; g2.fillStyle = INK;
  g2.fillText(`turn ${turn}  ·  best ${best}  ·  team ${pieces.length}`, L + 18 * U0, top + 42 * U0);
  btns.length = 0;
  const r = 17 * U0, items = [['snd', soundOn ? '♪' : '×'], ['calm', 'calm'], ['view', '⟲']];
  let x = L + VW - 24 * U0;
  for (const [id, txt] of items) {
    const y = top + r, wide = id === 'calm';
    if (wide) x -= r * 0.4;
    g2.fillStyle = id === 'calm' ? (calm ? HL.blue : '#fff') : id === 'snd' ? (soundOn ? HL.yellow : '#fff') : '#fff';
    g2.strokeStyle = INK; g2.lineWidth = 2.5;
    if (wide) { rr2(x - r * 1.3, y - r * 0.75, r * 2.6, r * 1.5, r * 0.75); }
    else { g2.beginPath(); g2.arc(x, y, r, 0, 7); }
    g2.fill(); g2.stroke();
    label(txt, x, y + 1, Math.round((wide ? 11 : 16) * U0), INK);
    btns.push({ id, x, y, r: wide ? r * 1.4 : r });
    x -= wide ? r * 2.9 + 8 * U0 : r * 2 + 10 * U0;
  }
}
function drawBubbles() {
  for (const b of bubbles) {
    const P = b.p, s = toScreen(P.x, P.y + 1.2, P.z);
    if (s.behind) continue;
    const VW = Math.min(W, H * 0.64), L = (W - VW) / 2;
    g2.font = `${Math.round(12 * U0)}px ${FONT}`;
    const w = g2.measureText(b.text).width + 16 * U0, h = 24 * U0;
    const x = Math.max(L + w / 2 + 4, Math.min(L + VW - w / 2 - 4, s.x)), y = s.y - 18 * U0;
    g2.globalAlpha = Math.min(1, b.life * 3);
    g2.fillStyle = '#fff'; g2.strokeStyle = INK; g2.lineWidth = 2;
    rr2(x - w / 2, y - h / 2, w, h, 8 * U0); g2.fill(); g2.stroke();
    g2.beginPath(); g2.moveTo(s.x - 5 * U0, y + h / 2 - 1); g2.lineTo(s.x, y + h / 2 + 8 * U0); g2.lineTo(s.x + 5 * U0, y + h / 2 - 1); g2.fill();
    g2.beginPath(); g2.moveTo(s.x - 5 * U0, y + h / 2); g2.lineTo(s.x, y + h / 2 + 8 * U0); g2.lineTo(s.x + 5 * U0, y + h / 2); g2.stroke();
    label(b.text, x, y + 1, Math.round(12 * U0), INK);
    g2.globalAlpha = 1;
  }
}
function drawBadgeAndBand() {
  if (shot && pieces.includes(shot.shooter)) {
    const P = shot.shooter, s = toScreen(P.x, P.y + 1.35, P.z);
    if (!s.behind) {
      const k = 1 + P.badge * 0.5;
      g2.fillStyle = HL.yellow; g2.strokeStyle = INK; g2.lineWidth = 2.5;
      g2.beginPath(); g2.arc(s.x, s.y, 11 * U0 * k, 0, 7); g2.fill(); g2.stroke();
      label(String(power(P)), s.x, s.y + 1, Math.round(13 * U0 * k), INK);
    }
  }
  if (state === 'aim' && selected && pieces.includes(selected)) {
    const s = toScreen(selected.x, 0.35, selected.z);
    if (aim && aim.mode === 'aim') {
      g2.lineCap = 'round';
      g2.strokeStyle = INK; g2.lineWidth = 7 * U0; g2.beginPath(); g2.moveTo(s.x, s.y); g2.lineTo(aim.cx, aim.cy); g2.stroke();
      g2.strokeStyle = HL.pink; g2.lineWidth = 4 * U0; g2.stroke(); g2.lineCap = 'butt';
    } else if (!everAimed) {
      label('pull back from a pawn', s.x, s.y + 52 * U0, Math.round(13 * U0), '#fff', true, 2);
      label('drag the board to look around', W / 2, H - 26 * U0, Math.round(11 * U0), INK);
    }
  }
}
function panel(lines, y0) {
  const VW = Math.min(W, H * 0.64), w = VW * 0.86, x = (W - w) / 2;
  let h = 0; for (const l of lines) h += l.gap; h += 24 * U0;
  g2.fillStyle = INK; rr2(x + 5, y0 + 5, w, h, 14 * U0); g2.fill();
  g2.fillStyle = PAPER; g2.strokeStyle = INK; g2.lineWidth = 3; rr2(x, y0, w, h, 14 * U0); g2.fill(); g2.stroke();
  let y = y0 + 14 * U0;
  for (const l of lines) { y += l.gap / 2; label(l.t, W / 2, y, Math.round(l.s * U0), l.c || INK, l.stroke, l.drop); y += l.gap / 2; }
}
function drawOverlay() {
  if (state === 'title') {
    panel([
      { t: 'PAWNBALL', s: 44, gap: 56 * U0, c: HL.yellow, stroke: true, drop: 4 },
      { t: 'Pull back on a pawn. Let go.', s: 14, gap: 26 * U0 },
      { t: 'Every friend you bump adds +1.', s: 14, gap: 22 * U0 },
      { t: 'Bonk a uniform to zero:', s: 14, gap: 22 * U0 },
      { t: 'whoever’s inside joins you.', s: 14, gap: 22 * U0 },
      { t: 'Nobody crosses alone.', s: 16, gap: 34 * U0, c: HL.pink, stroke: true, drop: 2 },
      { t: 'drag to look · pinch to zoom', s: 11, gap: 20 * U0, c: '#555' },
      { t: 'tap to start', s: 13, gap: 26 * U0, c: Math.sin(t * 4) > 0 ? INK : '#777' },
    ], H * 0.12);
  } else if (state === 'over') {
    panel([
      { t: 'TAKE FIVE.', s: 36, gap: 50 * U0, c: HL.orange, stroke: true, drop: 3 },
      { t: `score ${score}  ·  best ${best}`, s: 15, gap: 26 * U0 },
      { t: `freed ${freed}  ·  crossed ${crossed}  ·  turns ${turn}`, s: 13, gap: 24 * U0 },
      { t: 'The board’s still here.', s: 13, gap: 24 * U0 },
      { t: overT > 0.8 ? 'tap to go again' : ' ', s: 13, gap: 26 * U0, c: Math.sin(t * 4) > 0 ? INK : '#777' },
    ], H * 0.16);
  }
}
function drawUI() {
  g2.clearRect(0, 0, W, H);
  drawBadgeAndBand(); drawBubbles(); drawHUD(); drawOverlay();
}

// ================= input =================
const ptrs = new Map();
let drag = null, lastTap = 0;
function aimVec(a) {
  const dx = a.cx - a.sx, dy = a.cy - a.sy, scr = Math.hypot(dx, dy);
  if (scr < 1e-3) return null;
  // screen drag -> ground directions relative to where the camera is looking
  const rx = Math.cos(cam.yaw), rz = -Math.sin(cam.yaw), fx_ = -Math.sin(cam.yaw), fz = -Math.cos(cam.yaw);
  const wx = -dx * rx + dy * fx_, wz = -dx * rz + dy * fz;
  const bx = wx, bz = -wz, L = Math.hypot(bx, bz);
  return { dx: bx / L, dz: bz / L, pw: Math.min(1, scr / (Math.min(W, H) * 0.3)), scr };
}
function pickPiece(x, y) {
  let bp = null, bd = 1e9;
  for (const p of pieces) {
    const a = toScreen(p.x, 0.4, p.z), b = toScreen(p.x, 1.0, p.z);
    const th = Math.max(34, Math.abs(b.y - a.y) * 0.9 + 10);
    const d = Math.min(Math.hypot(x - a.x, y - a.y), Math.hypot(x - b.x, y - b.y));
    if (d < th && d < bd) { bd = d; bp = p; }
  }
  return bp;
}
ui.addEventListener('pointerdown', e => {
  ac();
  try { ui.setPointerCapture(e.pointerId); } catch (_) {}
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (ptrs.size === 2) { // two fingers: pinch + turn
    const [a, b] = [...ptrs.values()];
    drag = { mode: 'pinch', d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2, zoom: cam.zoom };
    aim = null; return;
  }
  if (ptrs.size > 2) return;
  const x = e.clientX, y = e.clientY;
  for (const b of btns) if (Math.hypot(x - b.x, y - b.y) < b.r + 6) {
    if (b.id === 'snd') { soundOn = !soundOn; save('sound', soundOn ? '1' : '0'); if (soundOn) tone(660, 0.1, 'triangle', 0.1); }
    else if (b.id === 'calm') { calm = !calm; save('calm', calm ? '1' : '0'); }
    else resetCam();
    ptrs.delete(e.pointerId); return;
  }
  if (state === 'aim') {
    const bp = pickPiece(x, y);
    if (bp) {
      selected = bp; bp.sqv += 2; tone(440, 0.05, 'sine', 0.06);
      aim = { mode: 'aim', sx: x, sy: y, cx: x, cy: y }; drag = aim; return;
    }
  }
  drag = { mode: 'orbit', lx: x, ly: y, sx: x, sy: y, lt: performance.now(), moved: 0 };
  cam.vy = cam.vp = 0;
});
ui.addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;
  if (drag.mode === 'aim') { drag.cx = e.clientX; drag.cy = e.clientY; }
  else if (drag.mode === 'orbit') {
    const dx = e.clientX - drag.lx, dy = e.clientY - drag.ly, now = performance.now(), dtm = Math.max(1, now - drag.lt) / 1000;
    cam.yaw -= dx * 0.008; cam.pitch += dy * 0.006; cam.user = true;
    cam.vy = -dx * 0.008 / dtm * 0.6; cam.vp = dy * 0.006 / dtm * 0.6;
    drag.moved += Math.hypot(dx, dy); drag.lx = e.clientX; drag.ly = e.clientY; drag.lt = now;
  } else if (drag.mode === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    cam.zoom = drag.zoom * drag.d / Math.max(20, d);
    cam.yaw -= (mx - drag.mx) * 0.008; cam.pitch += (my - drag.my) * 0.006; cam.user = true;
    drag.mx = mx; drag.my = my;
  }
});
function up(e) {
  ptrs.delete(e.pointerId);
  if (!drag) return;
  if (drag.mode === 'aim') {
    if (state === 'aim' && selected) { const v = aimVec(drag); if (v && v.scr > 14) fire(selected, v.dx, v.dz, v.pw); }
    aim = null; drag = null;
  } else if (drag.mode === 'orbit') {
    const tap = drag.moved < 8;
    if (performance.now() - drag.lt > 90) { cam.vy = 0; cam.vp = 0; }
    drag = null;
    if (tap) {
      if (state === 'title') { newGame(); arp([392, 523, 659], 0.08); cam.user = false; resetCam(); }
      else if (state === 'over') { if (overT > 0.8) newGame(); }
      else { const n = performance.now(); if (n - lastTap < 320) resetCam(); lastTap = n; }
    }
  } else if (drag.mode === 'pinch' && ptrs.size < 2) { drag = null; cam.vy = cam.vp = 0; }
}
ui.addEventListener('pointerup', up);
ui.addEventListener('pointercancel', e => { ptrs.delete(e.pointerId); aim = null; drag = null; });
ui.addEventListener('wheel', e => { e.preventDefault(); cam.zoom *= Math.exp(e.deltaY * 0.0012); cam.user = true; }, { passive: false });
addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') cam.vy -= 2; if (e.key === 'ArrowRight') cam.vy += 2;
  if (e.key === 'ArrowUp') cam.vp += 1.5; if (e.key === 'ArrowDown') cam.vp -= 1.5;
  if (e.key === 'r' || e.key === 'R') resetCam();
});
addEventListener('contextmenu', e => e.preventDefault());

// ================= loop =================
(function demo() {
  for (const x of [2.4, 4, 5.6]) pieces.push(mkPiece('dog', x, 1.2));
  nextNum = 1; turn = 3; spawnRow(); goons.forEach(g => { g.y = 0; g.z = g.hz = 5.5; }); turn = 0;
})();
function frame(dt) {
  if (!window.PB_PAUSE) update(dt);
  placeCamera(dt);
  syncScene(dt);
  effect.render(scene, camera);
  drawUI();
}
let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now(), dt = Math.min(0.05, (now - last) / 1000); last = now;
  frame(dt);
});
document.getElementById('boot').remove();
window.PB = {
  get state() { return { state, turn, score, team: pieces.length, goons: goons.length, freed, crossed }; },
  start() { newGame(); cam.user = false; resetCam(); },
  step(dt, n) { for (let i = 0; i < (n || 1); i++) update(dt); placeCamera(dt); syncScene(dt); effect.render(scene, camera); drawUI(); },
  fling(i, dx, dz, pw) { const p = pieces[i]; if (p && state === 'aim') { selected = p; fire(p, dx, dz, pw); } },
  cam, aim(a) { aim = a; drag = a; }, get pieces() { return pieces; }, toScreen, calls: () => renderer.info.render.calls,
};
