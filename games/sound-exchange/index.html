<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sound Exchange</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a 90s Japanese music toy that hatches battle pets — loud, kind, a bit strange
   IDEA: the page is a chunky plastic tape-player housing with an LCD window
   PICTURE: ink-line creatures built from record, gear, clock and speaker parts
   COLOUR and TYPE: speaker-yellow grille, toy red body, primaries per genre; Dela Gothic + M PLUS Rounded, DotGothic LCD
   LAYOUT: one device column; screen on top, toy buttons as the tab bar */
:root{color-scheme:light dark;--bg:light-dark(#ffd21f,#1b1b1b);--grill:light-dark(#f0bf00,#262626);
--ink:#141414;--paper:#fffdf6;--red:#ff3b30;--blue:#2f5bff;--yel:#ffd400;--lcd:#c9d8a4;--lcdink:#26331a;
--BEAT:#ffb800;--VOLT:#8fdc1e;--ROAR:#ff3b30;--BLOOM:#ff5fa2;--SOUL:#2f6bff;--DRIFT:#8a5cff;--spb:.6s}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) repeating-linear-gradient(0deg,transparent 0 9px,var(--grill) 9px 12px);color:var(--ink);font:16px/1.45 "M PLUS Rounded 1c",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dev{max-width:760px;margin:14px auto 28px;padding:0 10px}
.handle{height:34px;margin:0 46px;border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;background:var(--blue)}
.body{background:var(--red);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:14px 14px 10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 4px 12px}
.logo{font:400 clamp(22px,5.6vw,36px)/1 "Dela Gothic One",sans-serif;color:#fff;text-shadow:3px 3px 0 var(--ink);letter-spacing:.02em;margin:0}
.logo span:nth-child(1){color:var(--yel)}
.tag{font:400 12px/1.2 "DotGothic16",monospace;color:#fff;opacity:.9}
.mute{margin-left:auto;border:3px solid var(--ink);background:var(--yel);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 var(--ink);min-height:44px}
.mute[aria-pressed=false]{background:#fff}
.screen{background:var(--paper);border:4px solid var(--ink);border-radius:20px;min-height:520px;overflow:hidden;position:relative}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tabs button{border:3px solid var(--ink);border-radius:16px;padding:8px 4px;font-weight:800;box-shadow:0 4px 0 var(--ink);background:#fff;min-height:48px;font-size:14px}
.tabs button:nth-child(1){background:var(--yel)}.tabs button:nth-child(2){background:#7fd3ff}.tabs button:nth-child(3){background:#fff}.tabs button:nth-child(4){background:var(--VOLT)}
.tabs button[aria-current=true]{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.pad{padding:16px}
h2{font:400 clamp(22px,4.6vw,30px)/1.1 "Dela Gothic One",sans-serif;margin:0 0 6px}
.sub{margin:0 0 14px;font-size:15px;opacity:.8}
label{font-weight:800;font-size:14px;display:block;margin:12px 0 4px}
.in{width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;min-height:46px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font:800 12px/1.6 "M PLUS Rounded 1c",sans-serif;color:var(--ink);background:#fff;white-space:nowrap}
.btn{border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;background:#fff;box-shadow:0 4px 0 var(--ink);min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font:400 22px/1 "Dela Gothic One",sans-serif;padding:16px 22px;background:var(--yel);width:100%}
.btn:disabled{opacity:.5}
.tracks{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.tracks li{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px;background:#fff}
.tracks .tt{flex:1;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.tracks .tt b{display:block}
.tone{border:2.5px solid var(--ink);border-radius:10px;padding:4px 8px;font:800 12px/1 "M PLUS Rounded 1c",sans-serif;min-height:34px;min-width:64px}
.x{border:0;background:none;font-size:22px;line-height:1;width:36px;height:36px}
.mix{display:flex;height:18px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 2px;background:#eee}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:800}
.legend b{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);border-radius:3px;margin-right:4px;vertical-align:-1px}
.badge{font:400 13px "DotGothic16",monospace;background:var(--lcd);color:var(--lcdink);border:2.5px solid var(--ink);border-radius:8px;padding:3px 8px;display:inline-block;margin-top:6px}
.samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.note{font-size:13px;opacity:.75;margin:6px 0 0}
details summary{cursor:pointer;font-weight:800;margin-top:10px}
textarea.in{min-height:110px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end}
@media(max-width:520px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.two .btn{grid-column:1/-1}}
/* card */
.stage{position:relative;height:300px;overflow:hidden;border-bottom:4px solid var(--ink)}
.stage svg.bgarc{position:absolute;inset:0;width:100%;height:100%}
.stage .crit{position:absolute;left:50%;bottom:6px;height:280px;transform:translateX(-50%)}
.cardgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:600px){.cardgrid{grid-template-columns:minmax(0,1fr)}}
.name{font:400 clamp(28px,7vw,44px)/1 "Dela Gothic One",sans-serif;margin:0}
.stat{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2.6em 2.8em;gap:8px;align-items:center;font-weight:800;font-size:14px;margin:5px 0}
.stat .bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#eee;overflow:hidden}
.stat .bar i{display:block;height:100%}
.stat .n{text-align:right;font-family:"DotGothic16",monospace}
.up{color:#0a8a2a}.dn{color:#d1001f}
.moves{display:grid;gap:8px;margin-top:6px}
.move{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff;text-align:left;width:100%;box-shadow:0 3px 0 var(--ink)}
.move .dot{width:16px;height:16px;border:2.5px solid var(--ink);border-radius:50%}
.move b{display:block;font-size:15px}
.move small{display:block;font-size:12px;opacity:.75;line-height:1.3}
.move .pw{font-family:"DotGothic16",monospace,monospace;font-size:14px}
.aura{border:3px dashed var(--ink);border-radius:14px;padding:8px 12px;margin-top:10px;font-size:14px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:800;margin-top:10px}
.toggle input{width:22px;height:22px}
/* battle */
.arena{position:relative;height:clamp(300px,62vw,380px);background:#2c9a3e;overflow:hidden;border-bottom:4px solid var(--ink);touch-action:manipulation}
.arena svg.field{position:absolute;inset:0;width:100%;height:100%}
.fighter{position:absolute;transition:transform .18s}
.fighter svg{width:100%;height:100%;overflow:visible}
.f-foe{right:4%;top:6%;width:min(38%,190px);height:min(48%,190px)}
.f-me{left:3%;bottom:2%;width:min(44%,220px);height:min(56%,220px)}
.hud{position:absolute;background:var(--lcd);color:var(--lcdink);border:3px solid var(--ink);border-radius:10px;padding:5px 8px;font:400 13px/1.2 "DotGothic16",monospace;width:min(46%,230px);box-shadow:3px 3px 0 var(--ink)}
.hud.foe{left:3%;top:5%}.hud.me{right:3%;bottom:8%}
.hud .hp,.hud .hy{height:9px;border:2px solid var(--lcdink);border-radius:4px;margin-top:3px;background:#a9b985;overflow:hidden}
.hud .hp i{display:block;height:100%;background:var(--lcdink);transition:width .4s}
.hud .hy i{display:block;height:100%;background:#ff5fa2;transition:width .4s}
.hud .st{font-size:11px;min-height:13px}
.lunge-r{transform:translate(18%,-14%) scale(1.05)}.lunge-l{transform:translate(-18%,14%) scale(1.05)}
.hit{animation:hit .35s}
@keyframes hit{0%,100%{translate:0}20%{translate:-8px 0;filter:brightness(2)}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:4px 0}}
.boom{position:absolute;font:400 clamp(26px,6vw,40px)/1 "Bangers",Impact,sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:pop .9s forwards;z-index:4}
.boom::before{content:"";position:absolute;inset:-22px -26px;z-index:-1;background:var(--c,#ff2e9a);clip-path:polygon(50% 0,61% 30%,95% 12%,74% 42%,100% 55%,70% 64%,82% 98%,52% 74%,24% 100%,30% 66%,0 60%,26% 44%,8% 12%,40% 30%);border:0}
.dmg{position:absolute;font:400 28px/1 "DotGothic16",monospace;color:#fff;text-shadow:2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);pointer-events:none;animation:rise 1s forwards;z-index:5}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg)}25%{transform:scale(1.15) rotate(4deg)}40%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-50px);opacity:0}}
.rhythm{position:absolute;inset:0;display:none;place-items:center;z-index:6;background:rgba(20,20,20,.25);cursor:pointer}
.rhythm.on{display:grid}
.rhythm .ringbox{position:relative;width:130px;height:130px}
.rhythm .tgt,.rhythm .rg{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--ink)}
.rhythm .rg{border-color:var(--yel)}
.rhythm .lbl{position:absolute;top:calc(50% + 78px);left:0;right:0;text-align:center;font:400 22px/1 "Bangers",Impact,sans-serif;color:#fff;-webkit-text-stroke:1.5px var(--ink);letter-spacing:.04em}
.rhythm .judge{position:absolute;top:calc(50% - 110px);left:0;right:0;text-align:center;font:400 36px/1 "Bangers",Impact,sans-serif;color:var(--yel);-webkit-text-stroke:2px var(--ink)}
.log{font:400 15px/1.35 "DotGothic16",monospace;background:var(--lcd);color:var(--lcdink);border-bottom:4px solid var(--ink);padding:10px 12px;min-height:66px}
.cmds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px}
.cmd{border:3px solid var(--ink);border-radius:14px;padding:8px 10px;text-align:left;background:#fff;box-shadow:0 4px 0 var(--ink);min-height:58px;position:relative}
.cmd b{display:block;font-size:14px;line-height:1.15;padding-right:14px}
.cmd small{display:block;font-size:11.5px;opacity:.8}
.cmd .eff{font-weight:800}
.cmd i{position:absolute;right:8px;top:8px;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink)}
.cmd:disabled{opacity:.4;cursor:not-allowed}
.cmd.fin{grid-column:1/-1;background:#ff5fa2;color:#fff}
.cmd.fin small{opacity:.95}
.over{position:absolute;inset:0;background:rgba(255,253,246,.96);z-index:9;display:none;padding:18px;overflow:auto}
.over.on{display:block}
.mask{font:400 15px "DotGothic16",monospace;letter-spacing:.06em}
.press{position:absolute;inset:0;background:var(--paper);display:none;place-items:center;z-index:10;text-align:center}
.press.on{display:grid}
.press svg{width:200px;height:200px;animation:spin .5s linear infinite}
.spin{animation:spin 1.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes spin{to{transform:rotate(360deg)}}
.bob{animation:bob calc(var(--spb)*2) ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,50%,100%{transform:translateY(0) scale(1,1)}8%,58%{transform:translateY(0) scale(1.05,.94)}28%,78%{transform:translateY(-5px) scale(.98,1.03)}}
.reveal{animation:reveal .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes reveal{from{transform:translateX(-50%) scale(.1) rotate(-30deg)}to{transform:translateX(-50%) scale(1)}}
.empty{text-align:center;padding:40px 16px}
.crate{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.slot{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:6px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.slot svg{width:100%;height:130px}
.slot b{display:block;font-size:15px}
.slot .row{justify-content:center;margin-top:6px}
.slot.act{background:#fff6c2}
.mini{font-size:13px;padding:6px 10px;min-height:38px;box-shadow:0 3px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.bob,.spin,.press svg{animation:none}}
</style>
</head>
<body>
<div class="dev">
  <div class="handle"></div>
  <div class="body">
    <div class="top">
      <div>
        <p class="tag">find something strange at the…</p>
        <h1 class="logo"><span>SOUND</span> EXCHANGE</h1>
      </div>
      <button class="mute" id="mute" aria-pressed="false">♪ Music off</button>
    </div>
    <div class="screen" id="screen"></div>
    <nav class="tabs" id="tabs">
      <button data-v="ritual">Press</button>
      <button data-v="crate">Crate</button>
      <button data-v="card">Card</button>
      <button data-v="battle">Battle</button>
    </nav>
  </div>
</div>
<script>
{
/* ---------- seeds ---------- */
const h32=s=>{let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}h^=h>>>16;h=Math.imul(h,2246822507);h^=h>>>13;h=Math.imul(h,3266489909);h^=h>>>16;return h>>>0};
const norm=s=>(s||'').toLowerCase().replace(/\s+/g,' ').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- tones (genre families) ---------- */
const TONES={
 BEAT:{c:'#ffb800',label:'Beat',kw:['hip hop','hip-hop','rap','trap','drill','grime','boom bap','reggaeton','afrobeat','dancehall','reggae','latin','lil ','mc ','freestyle','cypher','bars'],bias:[2,6,2,3,3],adj:['Boom-Bap','Gold Chain','Block Party','Head-Nod','Sample'],boom:['BAP!','BOOM!','WORD!']},
 VOLT:{c:'#8fdc1e',label:'Volt',kw:['edm','house','techno','trance','dubstep','dnb','drum and bass','synth','electro','hyperpop','vaporwave','club','rave','neon','overclock','8-bit','chip','dj '],bias:[1,3,1,7,4],adj:['Neon','Chrome','Laser','Glitch','Turbo'],boom:['ZAP!','WUB!','BZZT!']},
 ROAR:{c:'#ff3b30',label:'Roar',kw:['rock','metal','punk','grunge','emo','hardcore','screamo','riff','mosh','amp','iron','knockout','shred'],bias:[4,7,3,2,0],adj:['Feedback','Power-Chord','Mosh','Amp-Blown','Riot'],boom:['CRASH!','SHRED!','KRANG!']},
 BLOOM:{c:'#ff5fa2',label:'Bloom',kw:['pop','k-pop','kpop','j-pop','jpop','city pop','disco','idol','sugar','bubblegum','glitter','sparkle','heart','candy'],bias:[2,3,2,5,4],adj:['Glitter','Bubblegum','Idol','Sparkle','Sugar'],boom:['POP!','✦SHINE✦','KYAA!']},
 SOUL:{c:'#2f6bff',label:'Soul',kw:['soul','r&b','rnb','jazz','funk','gospel','blues','motown','neo soul','groove','velvet','swing','syrup'],bias:[5,2,3,2,4],adj:['Velvet','Brass','Midnight','Silk','Gospel'],boom:['OOH!','SHOO-BE!','FUNK!']},
 DRIFT:{c:'#8a5cff',label:'Drift',kw:['ambient','classical','lofi','lo-fi','folk','acoustic','country','piano','soundtrack','ost','instrumental','lullaby','waltz','sleep','chill','rain'],bias:[3,1,6,1,5],adj:['Hush','Cloud','Paper','Moss','Lull'],boom:['hush…','DRIFT!','~lull~']}
};
const TK=Object.keys(TONES);
const BEATS={ROAR:'VOLT',VOLT:'SOUL',SOUL:'BEAT',BEAT:'BLOOM',BLOOM:'DRIFT',DRIFT:'ROAR'}; // attacker > defender
const typeMult=(a,d)=>BEATS[a]===d?1.5:BEATS[d]===a?0.67:1;
const guessTone=(text,seed)=>{const t=' '+norm(text)+' ';let best=null,score=0;for(const k of TK){let s=0;for(const w of TONES[k].kw)if(t.includes(w))s+=w.length;if(s>score){score=s;best=k}}return best||TK[seed%6]};

/* ---------- skills, auras ---------- */
const KINDS={
 STRIKE:{n:['Stomp','Smash','Slam'],d:'big hit',p:52},
 FLURRY:{n:['Flurry','Triplet','Drumroll'],d:'3 quick hits',p:20},
 DRAIN:{n:['Siphon','Sample-Swipe','Leech'],d:'hit + heal half',p:40},
 CRESCENDO:{n:['Crescendo','Build-Up','Riser'],d:'hit + raise ATK',p:24},
 DISSONANCE:{n:['Dissonance','Detune','Scratch'],d:'hit + lower foe DEF',p:28},
 ENCORE:{n:['Encore','Reprise','Hymn'],d:'heal yourself',p:0},
 OFFBEAT:{n:['Offbeat','Syncopate','Skip'],d:'hit, may stun',p:34},
 FINALE:{n:['Finale','Outro','Grand Coda'],d:'closer · needs full hype',p:105}
};
const KLIST=['STRIKE','FLURRY','DRAIN','CRESCENDO','DISSONANCE','ENCORE','OFFBEAT'];
const AURAS={
 Nocturne:{kw:['night','midnight','moon','dark','late','2am','3am','nocturne'],d:'+25% FX below half HP'},
 Heartbeat:{kw:['love','heart','crush','kiss','valentine','sweet'],d:'heals 5% HP each turn'},
 Overdrive:{kw:['fire','burn','hot','heat','rage','boss','gym','rush'],d:'+12% damage'},
 Undertow:{kw:['rain','ocean','sea','water','wave','tide','puddle','river'],d:'foe starts with −1 SPD'},
 'Tempo Up':{kw:['run','fast','speed','drive','race','sprint','turbo'],d:'starts with +1 SPD'},
 Lullaby:{kw:['dream','sleep','sleepy','lull','pillow','sunday','nap','cozy'],d:'foe may doze off (12%/turn)'},
 'Tour Bus':{kw:['home','road','trip','bus','train','travel','highway','walk','commute'],d:'+15% max HP'},
 Headliner:{kw:['king','queen','champ','star','idol','legend','victory'],d:'starts with 35 hype'}
};
const AURA_FALL={BEAT:'Overdrive',VOLT:'Tempo Up',ROAR:'Overdrive',BLOOM:'Headliner',SOUL:'Heartbeat',DRIFT:'Lullaby'};

/* ---------- creature generator ---------- */
const HEADS=['vinyl','gear','clock','triangle','boombox','lcd','spike'];
const BODIES=['biped','quad','bean','spider','mech'];
const EYES=['pie','dot','ring','googly','happy','angry'];
const MOUTHS=['smile','grin','tongue','snout','fang','o'];
const ACCS=['phones','crown','antenna','wings','horns','none'];
const PATS=['checker','stripes','number','heart','bolt','star'];

function makeName(title,seed){
  const w=norm(title).replace(/[^a-z0-9 ]/g,'').split(' ').filter(Boolean);
  let s=w.slice(0,3).map(x=>x.slice(0,x.length>3?2:x.length)).join('');
  if(s.length<3)s+=['zu','ko','bo','ri'][seed%4];
  s+=['','o','ix','bop','tron','ka','zu','nee'][seed>>>3&7];
  return s.charAt(0).toUpperCase()+s.slice(1,10);
}
function cleanTracks(pl){
  let tr=(pl.tracks||[]).filter(t=>(t.t||'').trim());
  if(!tr.length&&pl.link){const s=h32(pl.link);tr=Array.from({length:6},(_,i)=>({a:'',t:'Unknown track '+(i+1),tone:TK[(s>>>(i*3))%6],ghost:1}))}
  return tr;
}
function mixOf(tracks){
  const c={};tracks.forEach(t=>c[t.tone]=(c[t.tone]||0)+1);
  return TK.filter(k=>c[k]).map(k=>({k,w:c[k]/tracks.length})).sort((a,b)=>b.w-a.w);
}
function makeCreature(pl,lvl=1){
  const tracks=cleanTracks(pl);
  if(!tracks.length)return null;
  const P=h32(norm(pl.title)||'untitled'),n=tracks.length;
  const hs=tracks.map(t=>h32(norm(t.a)+'|'+norm(t.t)));
  const mix=mixOf(tracks),dom=mix[0].k,sec=(mix[1]&&mix[1].w>=.2)?mix[1].k:dom;
  const look={head:HEADS[hs[0]%7],body:BODIES[P%5],eyes:EYES[(hs[1]??P>>>4)%6],mouth:MOUTHS[(hs[2]??P>>>6)%6],
    acc:ACCS[(hs[n-1]>>>5)%6],pat:PATS[((P>>>9)+n)%6],pose:(hs[0]>>>11)%3,c1:TONES[dom].c,c2:sec===dom?'#ffffff':TONES[sec].c,num:n%10};
  if(look.head==='boombox'&&look.acc==='phones')look.acc='antenna';
  // stats
  const st=[30,30,30,30,30];

  scr.querySelectorAll('[data-cy]').forEach(b=>b.onclick=()=>{const t=d.tracks[b.dataset.cy];t.tone=TK[(TK.indexOf(t.tone)+1)%6];upd()});
  scr.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{d.tracks.splice(+b.dataset.rm,1);upd()});
  scr.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const s=SAMPLES[b.dataset.s];S.draft={title:s.title,link:'',tracks:s.tracks.map(t=>({...t}))};upd()});
  const clr=$('#clr');if(clr)clr.onclick=()=>{d.tracks=[];upd()};
  $('#add').onclick=()=>{const a=$('#na').value.trim(),t=$('#nt').value.trim();if(!t)return $('#nt').focus();d.tracks.push(...parseLines(a?a+' - '+t:t));upd();$('#na').focus()};
  $('#nt').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};
  $('#addall').onclick=()=>{d.tracks.push(...parseLines($('#paste').value));upd()};
  $('#press').onclick=press;
}
async function press(){
  const d=S.draft,c=makeCreature(d);if(!c)return;
  const fx=$('#pressfx');fx.classList.add('on');
  const prevE=S.editing&&S.crate.find(e=>e.id===S.editing);S.prev=prevE?makeCreature(prevE):null;
  for(const s of c.skills){Music.sfx(s.motif,s.tone,60,.55);await sleep(170)}
  await sleep(500);
  const entry={id:S.editing||('c'+Date.now().toString(36)),title:d.title,link:d.link,tracks:d.tracks.map(t=>({...t}))};
  const i=S.crate.findIndex(e=>e.id===entry.id);if(i>=0)S.crate[i]=entry;else S.crate.push(entry);
  S.active=entry.id;S.editing=null;S.fresh=true;S.draft={title:'',link:'',tracks:[]};save();go('card');
}

/* ---------- card ---------- */
const statRows=(c,prev)=>[['HP','hp'],['ATK','atk'],['DEF','def'],['SPD','spd'],['FX','fx']].map(([l,k])=>{const v=c.stats[k],d=prev?v-prev.stats[k]:0;return `<div class="stat"><span>${l}</span><div class="bar"><i style="width:${clamp(v/1.4,4,100)}%;background:${c.look.c1}"></i></div><span class="n">${v}</span><span class="n ${d>0?'up':d<0?'dn':''}">${d?(d>0?'+':'')+d:''}</span></div>`}).join('');
const moveRow=(s,i,sleeve)=>`<button class="move" data-mv="${i}"><span class="dot" style="background:${TONES[s.tone].c}"></span><span><b>${esc(s.name)}${s.role==='opener'?' ★':''}${s.role==='closer'?' · Closer':''}</b><small>${TONES[s.tone].label} · ${KINDS[s.kind].d}${sleeve?'':` · ♪ ${esc(s.src.t)}${s.src.a?' — '+esc(s.src.a):''}`}</small></span><span class="pw">${s.pw?'PW '+s.pw:'heal'}</span></button>`;
function viewCard(){
  const c=activeCreature();if(!c)return go('ritual');
  const mv=[...c.skills,...(c.closer?[c.closer]:[])];
  scr.innerHTML=`<div class="stage">${bgArcs(c)}${creatureSVG(c,'crit'+(S.fresh?' reveal':''))}</div>
  <div class="pad"><p class="name">${esc(c.name)}</p><p class="sub">pressed from “${esc(S.sleeve?'▢▢▢▢▢':c.title)}” · ${c.tracks.length} tracks · ${TONES[c.dom].label}${c.sec!==c.dom?' / '+TONES[c.sec].label:''}</p>
  ${mixBar(c.mix)}
  <div class="cardgrid" style="margin-top:14px"><div>${statRows(c,S.prev)}<div class="stat"><span>MAX</span><span style="grid-column:2/5;font-family:DotGothic16,monospace">${c.maxhp} HP in battle</span></div>
   <div class="aura"><b>Aura · ${esc(c.aura)}</b><br>${AURAS[c.aura].d}</div>
   <label class="toggle"><input type="checkbox" id="slv" ${S.sleeve?'checked':''}> Sleeve mode (hide songs for screenshots)</label></div>
   <div><b>Moves</b> <span class="note">· tap one to hear it</span><div class="moves">${mv.map((s,i)=>moveRow(s,i,S.sleeve)).join('')}</div>
   ${c.closer?'':'<p class="note">Add a 5th track to unlock a Closer (your last track becomes a finisher).</p>'}</div></div>
  <div class="row" style="margin-top:16px"><button class="btn" id="cry">▶ Hear its cry</button><button class="btn" id="remix">Remix songs</button><button class="btn" id="fight" style="background:var(--VOLT)">Battle →</button></div></div>`;
  setMusicFor(c.mix,c.key);
  const cry=()=>Music.sfx(c.skills[0].motif.map(n=>({...n,deg:n.deg+12})),c.skills[0].tone,60,.8);
  if(S.fresh){S.fresh=false;setTimeout(cry,350)}
  $('#cry').onclick=cry;
  scr.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const s=mv[b.dataset.mv];Music.sfx(s.motif,s.tone)});
  $('#slv').onchange=e=>{S.sleeve=e.target.checked;viewCard();syncBob()};
  $('#remix').onclick=()=>{const e=activeEntry();S.editing=e.id;S.draft={title:e.title,link:e.link,tracks:e.tracks.map(t=>({...t}))};go('ritual')};
  $('#fight').onclick=()=>{S.prev=null;go('battle')};
}

/* ---------- crate ---------- */
function viewCrate(){
  if(!S.crate.length){scr.innerHTML=`<div class="empty"><h2>Your crate is empty</h2><p class="sub">Press a playlist to fill it.</p><button class="btn big" id="gp" style="max-width:320px">Go press one</button></div>`;$('#gp').onclick=()=>go('ritual');setMusicFor([],0);return}
  scr.innerHTML=`<div class="pad"><h2>Crate</h2><p class="sub">Every pressing you've made. Pick one to carry into battle.</p><div class="crate">${S.crate.map(e=>{const c=makeCreature(e);return c?`<div class="slot ${e.id===S.active?'act':''}">${creatureSVG(c)}<b>${esc(c.name)}</b><span class="note">${TONES[c.dom].label} · ${e.tracks.length} tracks</span><div class="row"><button class="btn mini" data-pick="${e.id}">${e.id===S.active?'Active':'Use'}</button><button class="btn mini" data-del="${e.id}" aria-label="Release ${esc(c.name)}">Release</button></div></div>`:''}).join('')}</div></div>`;
  const a=activeCreature();setMusicFor(a?a.mix:[],a?a.key:0);
  scr.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{S.active=b.dataset.pick;save();go('card')});
  scr.querySelectorAll('[data-del]').forEach(b=>{let armed=false;b.onclick=()=>{if(!armed){armed=true;b.textContent='Sure?';return}S.crate=S.crate.filter(e=>e.id!==b.dataset.del);if(S.active===b.dataset.del)S.active=S.crate[0]?.id||null;save();render()}});
}

/* ---------- battle ---------- */
let B=null;
const fieldSVG=`<svg class="field" viewBox="0 0 400 300" preserveAspectRatio="none"><rect width="400" height="300" fill="#2c9a3e"/><g stroke="#fff" stroke-opacity=".55" stroke-width="1.5" fill="none">${[110,150,200,260].map(y=>`<path d="M0 ${y}H400"/>`).join('')}${[-300,-100,100,300,500,700].map(x=>`<path d="M200 60L${x} 300"/>`).join('')}</g><path d="M0 60H400" stroke="#fff" stroke-width="2.5"/><rect width="400" height="60" fill="#1f7a30"/><g fill="#fff" opacity=".85">${[40,120,300,360].map((x,i)=>`<circle cx="${x}" cy="${20+i%2*14}" r="${2+i%2}"/>`).join('')}</g></svg>`;
function fighter(c,lvl,side){const s=c.stats,st={...c,lvl,side,hp:c.maxhp,atk:0,def:0,spd:0,hype:0,stun:0,guard:0};if(c.aura==='Tempo Up')st.spd=1;if(c.aura==='Headliner')st.hype=35;return st}
const stage=v=>1+.25*clamp(v,-3,3)*(v<0?.67:1);
function viewBattle(){
  const me=activeCreature();if(!me)return go('ritual');
  const R=RIVALS[S.rival%RIVALS.length],foe=makeCreature(R.pl,R.lvl);
  B={me:fighter(me,1,'me'),foe:fighter(foe,R.lvl,'foe'),busy:false,heard:new Set(),R};
  if(me.aura==='Undertow')B.foe.spd=-1;if(foe.aura==='Undertow')B.me.spd=-1;
  scr.innerHTML=`<div class="arena" id="arena">${fieldSVG}
   <div class="fighter f-foe" id="ffoe">${creatureSVG(foe)}</div><div class="fighter f-me" id="fme">${creatureSVG(me)}</div>
   <div class="hud foe" id="hfoe"></div><div class="hud me" id="hme"></div>
   <div class="rhythm" id="rh"><div class="ringbox"><div class="tgt"></div><div class="rg" id="rg"></div></div><div class="judge" id="jd"></div><div class="lbl" id="rl"></div></div></div>
   <div class="log" id="log"></div><div class="cmds" id="cmds"></div>
   <div class="over" id="over"></div>`;
  setMusicFor(me.mix,me.key);
  hud();log(`${R.who} drops the needle on ${foe.name}! Music on helps you hit the beat.`);cmds();
}
function hud(){for(const k of['me','foe']){const f=B[k];$('#h'+k).innerHTML=`<div><b>${esc(f.name)}</b> <span style="float:right">${TONES[f.dom].label}</span></div><div class="hp"><i style="width:${(f.hp/f.maxhp*100).toFixed(1)}%"></i></div><div class="st">${Math.max(0,Math.ceil(f.hp))}/${f.maxhp}${f.atk?` ATK${f.atk>0?'+':''}${f.atk}`:''}${f.def?` DEF${f.def>0?'+':''}${f.def}`:''}${f.stun?' · dazed':''}</div>${k==='me'?`<div class="hy"><i style="width:${f.hype}%"></i></div><div class="st">HYPE ${Math.round(f.hype)}</div>`:''}`}}
const log=t=>{$('#log').textContent=t};
function effTag(s){const m=typeMult(s.tone,B.foe.dom);return m>1?'<span class="eff up">▲ strong</span>':m<1?'<span class="eff dn">▼ weak</span>':''}
function cmds(){
  const m=B.me,list=m.skills.map((s,i)=>`<button class="cmd" data-k="${i}"><i style="background:${TONES[s.tone].c}"></i><b>${esc(s.name)}</b><small>${KINDS[s.kind].d} ${effTag(s)}</small></button>`);
  list.push(`<button class="cmd" data-k="g"><i style="background:#fff"></i><b>Guard</b><small>halve damage · +20 hype</small></button>`);
  if(m.closer)list.push(`<button class="cmd fin" data-k="c" ${m.hype>=100?'':'disabled'}><b>★ ${esc(m.closer.name)}</b><small>Closer · ${m.hype>=100?'ready!':'fill your hype to 100'} ${effTag(m.closer)}</small></button>`);
  $('#cmds').innerHTML=list.join('');
  $('#cmds').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>turn(b.dataset.k));
}
function rhythm(label){return new Promise(res=>{
  const rh=$('#rh'),rg=$('#rg'),jd=$('#jd');$('#rl').textContent=label;jd.textContent='';rh.classList.add('on');
  const start=Music.now(),{spb}=Music.grid();let done=false,raf;
  const loop=()=>{const {t0,spb}=Music.grid(),ph=(((Music.now()-t0)/spb)%1+1)%1;rg.style.transform=`scale(${(1+1.3*(1-ph)).toFixed(3)})`;rg.style.opacity=(.4+.6*ph).toFixed(2);if(Music.now()-start>spb*4)fin(null);else raf=requestAnimationFrame(loop)};
  const fin=off=>{if(done)return;done=true;cancelAnimationFrame(raf);rh.onpointerdown=null;window.removeEventListener('keydown',key);
    const r=off==null?'MISS':off<.075?'PERFECT':off<.15?'GOOD':'MISS';jd.textContent=r==='MISS'&&off==null?'TOO SLOW':r+'!';setTimeout(()=>{rh.classList.remove('on');res(r)},420)};
  const tap=()=>{const now=Music.now();if(now-start<.18)return;const {t0,spb}=Music.grid(),p=(now-t0)/spb,off=Math.abs(p-Math.round(p))*spb;fin(off)};
  const key=e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();tap()}};
  rh.onpointerdown=e=>{e.preventDefault();tap()};window.addEventListener('keydown',key);raf=requestAnimationFrame(loop)})}
function fx(el,cls,ms=380){el.classList.add(cls);return sleep(ms).then(()=>el.classList.remove(cls))}
function pop(sideEl,text,color,cls='boom'){const a=$('#arena'),r=sideEl.getBoundingClientRect(),ar=a.getBoundingClientRect(),d=document.createElement('div');d.className=cls;d.textContent=text;if(color)d.style.setProperty('--c',color);d.style.left=(r.left-ar.left+r.width*(.25+Math.random()*.3))+'px';d.style.top=(r.top-ar.top+r.height*(.15+Math.random()*.2))+'px';a.appendChild(d);setTimeout(()=>d.remove(),1000)}
async function use(atk,def,s,isMe){
  const aEl=$('#f'+atk.side),dEl=$('#f'+def.side);
  log(`${atk.name} plays ${s.name}!`);
  const len=Music.sfx(s.motif,s.tone,isMe?60:55);if(!isMe)B.heard.add(s.src.t);
  await sleep(Math.min(900,(len||.5)*1000));
  const needsHit=s.kind!=='ENCORE';
  let judge='GOOD';
  if(isMe)judge=await rhythm(s.kind==='ENCORE'?'TAP ON THE BEAT TO HEAL':'TAP ON THE BEAT!');
  else if(needsHit&&!def.guard)judge=await rhythm('GUARD ON THE BEAT!');
  const tm=isMe?{PERFECT:1.3,GOOD:1.1,MISS:.85}[judge]:{PERFECT:.55,GOOD:.8,MISS:1}[judge];
  if(isMe){atk.hype=clamp(atk.hype+{PERFECT:18,GOOD:10,MISS:4}[judge],0,100)}
  if(s.kind==='ENCORE'){const amt=Math.round(atk.maxhp*.26*(atk.stats.fx/62)*(isMe?tm:1));atk.hp=Math.min(atk.maxhp,atk.hp+amt);pop(aEl,'+'+amt,null,'dmg');pop(aEl,TONES[s.tone].boom[1],TONES[s.tone].c);hud();return}
  aEl.classList.add(isMe?'lunge-r':'lunge-l');await sleep(170);aEl.classList.remove('lunge-r','lunge-l');
  const useFx=['DRAIN','DISSONANCE','OFFBEAT'].includes(s.kind),aStat=s.kind==='FINALE'?Math.max(atk.stats.atk,atk.stats.fx):useFx?atk.stats.fx:atk.stats.atk;
  const fxBoost=atk.aura==='Nocturne'&&atk.hp<atk.maxhp/2&&useFx?1.25:1,od=atk.aura==='Overdrive'?1.12:1;
  const hits=s.kind==='FLURRY'?3:1;let total=0;const mult=typeMult(s.tone,def.dom);
  for(let h=0;h<hits;h++){
    let dmg=s.pw*(aStat*stage(atk.atk)*fxBoost)/(def.stats.def*stage(def.def))*1.05*mult*tm*od*(def.guard?.5:1)*(.92+Math.random()*.14);
    dmg=Math.max(1,Math.round(dmg));def.hp=Math.max(0,def.hp-dmg);total+=dmg;
    Music.thud();pop(dEl,String(dmg),null,'dmg');fx(dEl,'hit');if(h===0)pop(dEl,TONES[s.tone].boom[(Math.random()*3)|0],TONES[s.tone].c);hud();if(hits>1)await sleep(220)}
  if(!isMe)def.hype=clamp(def.hype+8,0,100);
  let extra='';
  if(s.kind==='DRAIN'){const hl=Math.round(total*.5);atk.hp=Math.min(atk.maxhp,atk.hp+hl);extra=` Drained ${hl} HP.`}
  if(s.kind==='CRESCENDO'&&atk.atk<3){atk.atk++;extra=' ATK rises!'}
  if(s.kind==='DISSONANCE'&&def.def>-3){def.def--;extra=` ${def.name}'s DEF drops!`}
  if(s.kind==='OFFBEAT'&&def.hp>0&&Math.random()<(judge==='PERFECT'&&isMe?.55:.35)){def.stun=1;extra=` ${def.name} is dazed!`}
  if(s.kind==='FINALE')atk.hype=0;
  log(`${s.name} hits for ${total}${mult>1?' (strong!)':mult<1?' (weak…)':''}.${extra}`+(isMe?` ${judge==='PERFECT'?'Perfect timing!':judge==='GOOD'?'Good timing.':'Off the beat.'}`:''));hud();
}
function foeChoice(){const f=B.foe,opts=f.skills.filter(s=>!(s.kind==='ENCORE'&&f.hp>f.maxhp*.55));let best=opts[0],sc=-1;
  for(const s of opts){const v=(s.pw||60)*typeMult(s.tone,B.me.dom)*(s.kind==='ENCORE'?1.4:1)*(.7+Math.random()*.6);if(v>sc){sc=v;best=s}}return best}
async function turn(k){
  if(B.busy)return;B.busy=true;$('#cmds').querySelectorAll('button').forEach(b=>b.disabled=true);
  const m=B.me,f=B.foe;m.guard=k==='g'?1:0;f.guard=0;
  if(m.guard){m.hype=clamp(m.hype+20,0,100);log(`${m.name} braces and listens…`);hud();await sleep(500)}
  const mySkill=k==='c'?m.closer:k==='g'?null:m.skills[+k];
  const order=(m.stats.spd*stage(m.spd))>=(f.stats.spd*stage(f.spd))?['me','foe']:['foe','me'];
  for(const who of order){
    const a=B[who],d=B[who==='me'?'foe':'me'];if(a.hp<=0||d.hp<=0)continue;
    if(a.stun){a.stun=0;log(`${a.name} is dazed and misses the cue!`);hud();await sleep(800);continue}
    if(d.aura==='Lullaby'&&Math.random()<.12){log(`${a.name} dozes off to ${d.name}'s lullaby…`);await sleep(900);continue}
    if(who==='me'){if(mySkill)await use(m,f,mySkill,true)}else await use(f,m,foeChoice(),false);
    await sleep(650);
  }
  for(const x of[m,f])if(x.aura==='Heartbeat'&&x.hp>0){x.hp=Math.min(x.maxhp,x.hp+Math.round(x.maxhp*.05))}
  hud();
  if(f.hp<=0||m.hp<=0)return end(f.hp<=0);
  B.busy=false;cmds();
}
function end(won){
  const f=B.foe,mask=t=>t.split(/\s+/).map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join(' ');
  const heard=[...B.heard];
  const o=$('#over');o.classList.add('on');
  o.innerHTML=`<h2>${won?'You win!':'Knocked out…'}</h2><p class="sub">${won?`${esc(f.name)} spins down. `:''}${esc(B.R.who)}'s record stays secret — but you heard ${heard.length} of its songs:</p>
  ${heard.map(t=>`<p class="mask">♪ ${esc(mask(t))}</p>`).join('')||'<p class="note">None this time.</p>'}
  <p class="note">Hints show each word's first letter. In the full game these would be the real clips you heard, with a link back to the song.</p>
  <div class="row" style="margin-top:14px">${won&&S.rival<RIVALS.length-1?'<button class="btn" id="nx" style="background:var(--VOLT)">Next rival →</button>':''}<button class="btn" id="again">Rematch</button><button class="btn" id="tocard">Back to card</button></div>`;
  if(won&&S.rival<RIVALS.length-1)$('#nx').onclick=()=>{S.rival++;viewBattle();syncBob()};
  $('#again').onclick=()=>{viewBattle();syncBob()};$('#tocard').onclick=()=>go('card');
}

/* ---------- boot ---------- */
const mute=$('#mute');
mute.onclick=()=>{if(Music.on){Music.stop();mute.setAttribute('aria-pressed','false');mute.textContent='♪ Music off'}else{Music.start();mute.setAttribute('aria-pressed','true');mute.textContent='♪ Music on'}syncBob()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='ritual'&&!S.editing){}go(b.dataset.v)});
if(activeEntry())S.view='card';
render();
window.SX={S,Music,makeCreature,creatureSVG,SAMPLES,RIVALS,go,turn,B:()=>B};
}
</script>
</body>
</html>
