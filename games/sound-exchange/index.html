<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a 90s Japanese music toy that hatches battle pets — loud, kind, a bit strange
   IDEA: the page is a chunky plastic tape-player housing with an LCD window
   PICTURE: ink-line creatures built from record, gear, clock and speaker parts
   COLOUR and TYPE: speaker-yellow grille, toy red body, primaries per genre; Dela Gothic + M PLUS Rounded, DotGothic LCD
   LAYOUT: one device column; screen on top, toy buttons as the tab bar */
:root{color-scheme:light dark;--bg:light-dark(#ffd21f,#1b1b1b);--grill:light-dark(#f0bf00,#262626);
--ink:#141414;--paper:#fffdf6;--red:#ff3b30;--blue:#2f5bff;--yel:#ffd400;--lcd:#c9d8a4;--lcdink:#26331a;
--BEAT:#ffb800;--VOLT:#8fdc1e;--ROAR:#ff3b30;--BLOOM:#ff5fa2;--SOUL:#2f6bff;--DRIFT:#8a5cff;--spb:.6s}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg) repeating-linear-gradient(0deg,transparent 0 9px,var(--grill) 9px 12px);color:var(--ink);font:16px/1.45 "M PLUS Rounded 1c",system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.dev{max-width:760px;margin:14px auto 28px;padding:0 10px}
.handle{height:34px;margin:0 46px;border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;background:var(--blue)}
.body{background:var(--red);border:4px solid var(--ink);border-radius:30px;box-shadow:0 8px 0 var(--ink);padding:14px 14px 10px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:2px 4px 12px}
.lionmark{border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);flex:none}
.logo{font:400 clamp(22px,5.6vw,36px)/1 "Dela Gothic One",sans-serif;color:#fff;text-shadow:3px 3px 0 var(--ink);letter-spacing:.02em;margin:0}
.logo span:nth-child(1){color:var(--yel)}
.tag{font:400 12px/1.2 "DotGothic16",monospace;color:#fff;opacity:.9}
.mute{margin-left:auto;border:3px solid var(--ink);background:var(--yel);border-radius:999px;padding:6px 14px;font-weight:800;box-shadow:0 3px 0 var(--ink);min-height:44px}
.mute[aria-pressed=false]{background:#fff}
.screen{background:var(--paper);border:4px solid var(--ink);border-radius:20px;min-height:520px;overflow:hidden;position:relative}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
.tabs button{border:3px solid var(--ink);border-radius:16px;padding:8px 4px;font-weight:800;box-shadow:0 4px 0 var(--ink);background:#fff;min-height:48px;font-size:14px}
.tabs button:nth-child(1){background:var(--yel)}.tabs button:nth-child(2){background:#7fd3ff}.tabs button:nth-child(3){background:#fff}.tabs button:nth-child(4){background:var(--VOLT)}
.tabs button[aria-current=true]{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.pad{padding:16px}
h2{font:400 clamp(22px,4.6vw,30px)/1.1 "Dela Gothic One",sans-serif;margin:0 0 6px}
.sub{margin:0 0 14px;font-size:15px;opacity:.8}
label{font-weight:800;font-size:14px;display:block;margin:12px 0 4px}
.in{width:100%;border:3px solid var(--ink);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;min-height:46px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px;font:800 12px/1.6 "M PLUS Rounded 1c",sans-serif;color:var(--ink);background:#fff;white-space:nowrap}
.btn{border:3px solid var(--ink);border-radius:14px;padding:10px 16px;font-weight:800;background:#fff;box-shadow:0 4px 0 var(--ink);min-height:46px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{font:400 22px/1 "Dela Gothic One",sans-serif;padding:16px 22px;background:var(--yel);width:100%}
.btn:disabled{opacity:.5}
.tracks{list-style:none;margin:8px 0;padding:0;display:grid;gap:6px}
.tracks li{display:flex;align-items:center;gap:8px;border:2.5px solid var(--ink);border-radius:12px;padding:6px 8px;background:#fff}
.tracks .tt{flex:1;font-size:14px;line-height:1.25;overflow-wrap:anywhere}
.tracks .tt b{display:block}
.tone{border:2.5px solid var(--ink);border-radius:10px;padding:4px 8px;font:800 12px/1 "M PLUS Rounded 1c",sans-serif;min-height:34px;min-width:64px}
.x{border:0;background:none;font-size:22px;line-height:1;width:36px;height:36px}
.mix{display:flex;height:18px;border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 2px;background:#eee}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:800}
.legend b{display:inline-block;width:10px;height:10px;border:2px solid var(--ink);border-radius:3px;margin-right:4px;vertical-align:-1px}
.badge{font:400 13px "DotGothic16",monospace;background:var(--lcd);color:var(--lcdink);border:2.5px solid var(--ink);border-radius:8px;padding:3px 8px;display:inline-block;margin-top:6px}
.samples{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.note{font-size:13px;opacity:.75;margin:6px 0 0}
details summary{cursor:pointer;font-weight:800;margin-top:10px}
textarea.in{min-height:110px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:6px;align-items:end}
@media(max-width:520px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.two .btn{grid-column:1/-1}}
/* card */
.stage{position:relative;height:300px;overflow:hidden;border-bottom:4px solid var(--ink)}
.stage svg.bgarc{position:absolute;inset:0;width:100%;height:100%}
.stage .crit{position:absolute;left:50%;bottom:6px;height:280px;transform:translateX(-50%)}
.cardgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media(max-width:600px){.cardgrid{grid-template-columns:minmax(0,1fr)}}
.name{font:400 clamp(28px,7vw,44px)/1 "Dela Gothic One",sans-serif;margin:0}
.stat{display:grid;grid-template-columns:3.2em minmax(0,1fr) 2.6em 2.8em;gap:8px;align-items:center;font-weight:800;font-size:14px;margin:5px 0}
.stat .bar{height:14px;border:2.5px solid var(--ink);border-radius:999px;background:#eee;overflow:hidden}
.stat .bar i{display:block;height:100%}
.stat .n{text-align:right;font-family:"DotGothic16",monospace}
.up{color:#0a8a2a}.dn{color:#d1001f}
.moves{display:grid;gap:8px;margin-top:6px}
.move{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:3px solid var(--ink);border-radius:14px;padding:8px 10px;background:#fff;text-align:left;width:100%;box-shadow:0 3px 0 var(--ink)}
.move .dot{width:16px;height:16px;border:2.5px solid var(--ink);border-radius:50%}
.move b{display:block;font-size:15px}
.move small{display:block;font-size:12px;opacity:.75;line-height:1.3}
.move .pw{font-family:"DotGothic16",monospace,monospace;font-size:14px}
.aura{border:3px dashed var(--ink);border-radius:14px;padding:8px 12px;margin-top:10px;font-size:14px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:800;margin-top:10px}
.toggle input{width:22px;height:22px}
/* battle */
.arena{position:relative;height:clamp(300px,62vw,380px);background:#2c9a3e;overflow:hidden;border-bottom:4px solid var(--ink);touch-action:manipulation}
.arena svg.field{position:absolute;inset:0;width:100%;height:100%}
.fighter{position:absolute;transition:transform .18s}
.fighter svg{width:100%;height:100%;overflow:visible}
.f-foe{right:4%;top:6%;width:min(38%,190px);height:min(48%,190px)}
.f-me{left:3%;bottom:2%;width:min(44%,220px);height:min(56%,220px)}
.hud{position:absolute;background:var(--lcd);color:var(--lcdink);border:3px solid var(--ink);border-radius:10px;padding:5px 8px;font:400 13px/1.2 "DotGothic16",monospace;width:min(46%,230px);box-shadow:3px 3px 0 var(--ink)}
.hud.foe{left:3%;top:5%}.hud.me{right:3%;bottom:8%}
.hud .hp,.hud .hy{height:9px;border:2px solid var(--lcdink);border-radius:4px;margin-top:3px;background:#a9b985;overflow:hidden}
.hud .hp i{display:block;height:100%;background:var(--lcdink);transition:width .4s}
.hud .hy i{display:block;height:100%;background:#ff5fa2;transition:width .4s}
.hud .st{font-size:11px;min-height:13px}
.lunge-r{transform:translate(18%,-14%) scale(1.05)}.lunge-l{transform:translate(-18%,14%) scale(1.05)}
.hit{animation:hit .35s}
@keyframes hit{0%,100%{translate:0}20%{translate:-8px 0;filter:brightness(2)}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:4px 0}}
.boom{position:absolute;font:400 clamp(26px,6vw,40px)/1 "Bangers",Impact,sans-serif;color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);pointer-events:none;animation:pop .9s forwards;z-index:4}
.boom::before{content:"";position:absolute;inset:-22px -26px;z-index:-1;background:var(--c,#ff2e9a);clip-path:polygon(50% 0,61% 30%,95% 12%,74% 42%,100% 55%,70% 64%,82% 98%,52% 74%,24% 100%,30% 66%,0 60%,26% 44%,8% 12%,40% 30%);border:0}
.dmg{position:absolute;font:400 28px/1 "DotGothic16",monospace;color:#fff;text-shadow:2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);pointer-events:none;animation:rise 1s forwards;z-index:5}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg)}25%{transform:scale(1.15) rotate(4deg)}40%{transform:scale(1)}85%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-50px);opacity:0}}
.rhythm{position:absolute;inset:0;display:none;place-items:center;z-index:6;background:rgba(20,20,20,.25);cursor:pointer}
.rhythm.on{display:grid}
.rhythm .ringbox{position:relative;width:130px;height:130px}

  if(dm==='attack'&&dD<.34){pop(d.side,'CLASH!','#ffd400');RD.clash(a,d);hitF(a,d,sk,{tm:.35,small:true});hitF(d,a,d.skills[d.si%d.skills.length],{tm:.35,small:true});return}
  const ob=onBeat();if(ob)pop(a.side,'ON BEAT!','#ffd400');
  if(sk.kind==='FLURRY'){for(let i=0;i<3;i++)setTimeout(()=>{if(!B.over)hitF(a,d,sk,{small:i<2,tm:ob?1.25:1})},i*130);return}
  const dmg=hitF(a,d,sk,{tm:ob?1.25:1});if(!dmg)return;
  if(sk.kind==='DRAIN'){RD.drain(d,a,sk);const hl=Math.round(dmg*.5);a.hp=Math.min(a.maxhp,a.hp+hl);setTimeout(()=>pop(a.side,'+'+hl,null,'dmg'),500)}
  if(sk.kind==='CRESCENDO'&&a.atk<3){a.atk++;RD.buff(a,sk)}
  if(sk.kind==='DISSONANCE'&&d.def>-3){d.def--;RD.glitch(d,sk)}
  if(sk.kind==='OFFBEAT'&&Math.random()<.35){d.stunT=1.2;RD.stun(d,true)}
}
function hitF(a,d,sk,o={}){
  if(B.over||d.hp<=0)return 0;
  const useFx=['DRAIN','DISSONANCE','OFFBEAT'].includes(sk.kind),aStat=sk.kind==='FINALE'?Math.max(a.stats.atk,a.stats.fx):useFx?a.stats.fx:a.stats.atk;
  const fxB=a.aura==='Nocturne'&&a.hp<a.maxhp/2&&useFx?1.25:1,od=a.aura==='Overdrive'?1.12:1,mult=typeMult(sk.tone,d.dom),pw=o.pw??(sk.pw||40);
  let dmg=pw*(aStat*stage(a.atk)*fxB)/(d.stats.def*stage(d.def))*DMG*mult*od*(o.tm||1)*(.9+Math.random()*.2);dmg=Math.max(1,Math.round(dmg));
  d.hp=Math.max(0,d.hp-dmg);Music.thud();RD.impact(d,sk,mult,o.small);d.hitT=1;if(!d.air)d.air={t:0,d:.25,h:o.small?.1:.22,roll:(Math.random()-.5)*.6};
  pop(d.side,String(dmg),null,'dmg');if(!o.small&&Math.random()<.5)pop(d.side,TONES[sk.tone].boom[(Math.random()*3)|0],TONES[sk.tone].c);
  if(!B.special){a.hype=Math.min(100,a.hype+7);d.hype=Math.min(100,d.hype+5)}
  if(d.hp<=0)ko(d);return dmg}
function ko(d){d.ko=true;B.over=true;d.tw.length=0;RD.stun(d,false);sBtn();setTimeout(()=>end(d.side==='foe'),1500)}
async function strikeAnim(f,o,sk,type,onHit){const p=rimPos(f),q=rimPos(o),dx=q.x-p.x,dz=q.z-p.z,d=Math.hypot(dx,dz)||1,ux=dx/d,uz=dz/d,reach=Math.min(.75,d*.45);f.yaw=Math.atan2(dx,dz);
  if(type==='kick'){RD.kickArc(f,sk);await tween(f,.26,k=>{f.spin=Math.PI*2*eo(k);f.y=.35*Math.sin(k*Math.PI);f.off2.x=ux*reach*Math.sin(k*Math.PI);f.off2.z=uz*reach*Math.sin(k*Math.PI)});f.spin=0;f.y=0;onHit&&onHit();return}
  if(type==='upper'){await tween(f,.2,k=>{f.y=.7*Math.sin(k*Math.PI);f.lean=-.5*Math.sin(k*Math.PI);f.off2.x=ux*reach*k;f.off2.z=uz*reach*k});onHit&&onHit();await tween(f,.15,k=>{f.off2.x=ux*reach*(1-k);f.off2.z=uz*reach*(1-k)});f.y=0;f.lean=0;return}
  await tween(f,.07,k=>{f.lean=-.18*k});RD.punchFx(f,sk);
  await tween(f,.08,k=>{f.lean=-.18+.6*k;f.off2.x=ux*reach*eo(k);f.off2.z=uz*reach*eo(k)});onHit&&onHit();
  await tween(f,.16,k=>{f.lean=.42*(1-k);f.off2.x=ux*reach*(1-k);f.off2.z=uz*reach*(1-k)});f.off2.x=f.off2.z=0;f.lean=0}
/* the S special: hop across, tap on the beat */
async function special(f,o){
  if(B.special)return;const sk=f.closer||f.skills[0],isMe=f.side==='me',N=8;B.special=f.side;B.frozen=o.side;f.hype=0;f.v=0;o.v=0;hud();sBtn();
  shout(f,{...sk,name:f.closer?sk.name:shoutName(sk.src.t,'FINALE',0)},true);f.flash=1.5;RD.cam.special();RD.buff(f,sk);
  const p=rimPos(f),q=rimPos(o),tx=(q.x-p.x)*.62,tz=(q.z-p.z)*.62;
  await tween(f,.45,k=>{f.off.x=tx*k;f.off.z=tz*k;f.y=1.4*4*k*(1-k)});f.y=0;f.sq=.35;RD.dust(f);
  const {t0,spb}=Music.grid(),first=Math.ceil((Music.now()-t0)/spb)+2,beats=Array.from({length:N},(_,i)=>t0+(first+i)*spb),res=Array(N).fill(null);
  const ui=isMe?specialUI(beats,res,spb):null;let perf=0;
  for(let i=0;i<N&&!B.over;i++){
    await waitClock(f,beats[i]+(isMe?.17:0));
    let r=res[i];if(!isMe){const x=Math.random();r=x<.45?'PERFECT':x<.8?'GOOD':'MISS'}r=r||'MISS';res[i]=r;if(ui)ui.judge(i,r);if(r==='PERFECT')perf++;
    if(r==='MISS'){f.sq=.2;pop(f.side,'miss','#ffffff');continue}
    strikeAnim(f,o,sk,['punch','kick','upper','punch','kick','punch','upper','kick'][i],()=>hitF(f,o,sk,{pw:sk.pw*.15*(r==='PERFECT'?1.25:.75),small:true}));
  }
  if(ui)ui.done(perf,N);
  if(!B.over){await waitT(f,.3);await RD.vinyl(f,o,sk);hitF(f,o,sk,{pw:sk.pw*.42*(.5+perf/N)});pop(f.side,`${perf}/${N} PERFECT`,'#ffd400')}
  await waitT(f,.4);await tween(f,.45,k=>{f.off.x=tx*(1-k);f.off.z=tz*(1-k);f.y=1.2*4*k*(1-k)});f.y=0;f.off.x=f.off.z=0;
  B.special=null;B.frozen=null;RD.cam.auto();sBtn();
}
function specialUI(beats,res,spb){
  const rh=$('#rh'),rg=$('#rg'),jd=$('#jd'),rl=$('#rl');window.SX&&(SX.lastBeats=beats);rh.classList.add('on','sp');rl.textContent='TAP ON THE BEAT!';jd.textContent='';let raf,alive=true,combo=0;
  const loop=()=>{if(!alive)return;const now=Music.now(),i=res.findIndex(x=>!x);if(i<0)return;const dt=beats[i]-now;rg.style.transform=`scale(${clamp(1+dt/spb*1.4,1,3).toFixed(3)})`;rg.style.opacity=dt>spb*1.3?.25:1;
    if(i===0&&dt>spb*.9)jd.textContent=dt>spb*1.6?'READY…':'GO!';raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
  rh.onpointerdown=e=>{e.preventDefault?.();const now=Music.now();let bi=-1,bo=1;for(let i=0;i<beats.length;i++){if(res[i])continue;const off=Math.abs(now-beats[i]);if(off<bo){bo=off;bi=i}}
    if(bi<0||bo>.18)return;res[bi]=bo<.075?'PERFECT':bo<.15?'GOOD':'MISS'};
  const key=e=>{if(e.code==='Space'||e.key==='Enter'){e.preventDefault();rh.onpointerdown(e)}};window.addEventListener('keydown',key);
  return {judge(i,r){combo=r==='MISS'?0:combo+1;jd.textContent=r+(combo>1?' ×'+combo:'')},done(p,n){alive=false;cancelAnimationFrame(raf);window.removeEventListener('keydown',key);rh.onpointerdown=null;jd.textContent=`${p}/${n} PERFECT`;setTimeout(()=>rh.classList.remove('on','sp'),700)}}}
/* comic shouts and pops */
function shout(f,sk,big){const a=$('#arena');if(!a)return;Music.sfx(sk.motif,sk.tone,f.side==='me'?60:55);
  const d=document.createElement('div');d.className='shout'+(big?' big':'');d.style.setProperty('--c',TONES[sk.tone].c);d.style.setProperty('--r',((Math.random()-.5)*14).toFixed(1)+'deg');
  d.innerHTML=`<span>${esc(sk.name)}</span>`;a.appendChild(d);
  if(!big){const r=RD.anchor(f.side);d.style.left=clamp(r.x+r.w/2-d.offsetWidth/2,6,a.clientWidth-d.offsetWidth-6)+'px';d.style.top=clamp(r.y-40,70,a.clientHeight-200)+'px'}
  setTimeout(()=>d.remove(),big?2000:1300);log(`${f.name}: “${sk.name}”`)}
function pop(side,text,color,cls='boom'){const a=$('#arena');if(!a||!RD)return;const r=RD.anchor(side),d=document.createElement('div');d.className=cls;d.textContent=text;if(color)d.style.setProperty('--c',color);
  d.style.left=clamp(r.x+r.w*(.2+Math.random()*.35),4,a.clientWidth-90)+'px';d.style.top=clamp(r.y+r.h*(.05+Math.random()*.3),60,a.clientHeight-120)+'px';a.appendChild(d);setTimeout(()=>d.remove(),1000)}
function fx(el,cls,ms=380){el.classList.add(cls);return sleep(ms).then(()=>el.classList.remove(cls))}
const log=t=>{const l=$('#log');if(l)l.textContent=t};
const MODE_TXT={attack:'⟳ ATTACK',guard:'⟲ GUARD',hold:'■ HOLD',dazed:'✶ DAZED'};
function hud(){if(!B)return;for(const k of['me','foe']){const f=B[k],h=$('#h'+k);if(!h)return;const m=mode(f);
  h.innerHTML=`<div class="hn"><b>${esc(f.name)}</b><span class="md md-${m}">${MODE_TXT[m]}</span></div><div class="hp"><i style="width:${(f.hp/f.maxhp*100).toFixed(1)}%"></i></div><div class="st">${Math.max(0,Math.ceil(f.hp))}/${f.maxhp} · ${TONES[f.dom].label}${f.atk?` · ATK+${f.atk}`:''}${f.def<0?` · DEF${f.def}`:''}</div><div class="hy"><i style="width:${f.hype.toFixed(0)}%"></i></div>`}
  sBtn();const me=B.me;document.querySelectorAll('[data-dir]').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.dir===me.dir)))}
function sBtn(){const b=$('#sbtn');if(!b||!B)return;const ready=B.me.hype>=100&&!B.special&&!B.over;b.disabled=!ready&&!B.me.want;b.classList.toggle('ready',ready&&!B.me.want);b.style.setProperty('--fill',Math.round(B.me.hype)+'%')}
/* scratching your record */
function wireScratch(ar){
  let last=null,lt=0,sm=0;const me=()=>B.me;
  const ang=e=>{const c=RD.screenOf('me'),r=ar.getBoundingClientRect();return Math.atan2(-(e.clientY-r.top-c.y),e.clientX-r.left-c.x)};
  ar.addEventListener('pointerdown',e=>{if(!B||B.over||B.special||e.target.closest('button,.rhythm.on'))return;const f=me();if(f.stunT>0)return;f.drag=true;f.dragV=0;last=ang(e);lt=performance.now();sm=0;ar.setPointerCapture(e.pointerId);$('#hint')?.classList.add('gone')});
  ar.addEventListener('pointermove',e=>{const f=B?.me;if(!f?.drag)return;const a=ang(e),now=performance.now(),da=wrapA(a-last),dt=Math.max(.008,(now-lt)/1000);f.a+=da;sm=sm*.6+(da/dt)*.4;f.dragV=clamp(sm,-14,14);last=a;lt=now});
  const up=()=>{const f=B?.me;if(!f?.drag)return;f.drag=false;if(Math.abs(f.dragV)>.6){f.dir=f.dragV<0?1:-1;f.flick=true;f.v=clamp(f.dragV,-motor(f)*2.2,motor(f)*2.2)}else f.v=0;f.dragV=0};
  ar.addEventListener('pointerup',up);ar.addEventListener('pointercancel',up);
}
/* fullscreen battle layer */
function viewBattle(){
  kill3D();if(B)B.over=true;
  const me=activeCreature();if(!me)return go('ritual');
  const R=RIVALS[S.rival%RIVALS.length],foe=makeCreature(R.pl,R.lvl);
  B={me:fighter(me,1,'me'),foe:fighter(foe,R.lvl,'foe'),over:false,special:null,frozen:null,heard:new Set(),R};
  if(me.aura==='Undertow')B.foe.spd=-1;if(foe.aura==='Undertow')B.me.spd=-1;
  scr.innerHTML=`<div class="empty"><h2>Battle in progress</h2><p class="sub">It's open fullscreen.</p></div>`;
  const L=document.createElement('div');L.className='bfs';L.id='bfs';
  L.innerHTML=`<div class="arena" id="arena">
     <div class="fighter f-foe" id="ffoe">${creatureSVG(foe)}</div><div class="fighter f-me" id="fme">${creatureSVG(me)}</div>
     <div class="rhythm" id="rh"><div class="ringbox"><div class="tgt"></div><div class="rg" id="rg"></div></div><div class="judge" id="jd"></div><div class="lbl" id="rl"></div></div></div>
   <div class="btop"><button class="bx" id="bexit" aria-label="Leave battle">✕</button><div class="hud foe" id="hfoe"></div><div class="bset"><button class="bx" id="bmus" aria-pressed="${Music.on}" aria-label="Music">♪</button><button class="bx" id="b3d" aria-pressed="${S.battle3d}">3D</button></div></div>
   <p class="hint" id="hint">Scratch your record. <b>Clockwise</b> attacks when you pass the gap. <b>Counter‑clockwise</b> into the gap as they hit = parry.</p>
   <div class="bbot"><div class="dirs"><button class="dbtn atk" data-dir="1" aria-label="Spin clockwise to attack">⟳</button><button class="dbtn grd" data-dir="-1" aria-label="Spin counter-clockwise to guard">⟲</button></div><div class="hud me" id="hme"></div><button class="sbtn" id="sbtn" aria-label="Special move" disabled>S</button></div>
   <div class="over" id="over"></div>`;
  document.body.appendChild(L);document.body.classList.add('lock');
  setMusicFor(me.mix,me.key);hud();
  L.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{B.me.dir=+b.dataset.dir;B.me.flick=false;hud()});
  $('#sbtn').onclick=()=>{if(B.me.hype>=100&&!B.special&&!B.over){B.me.want=true;sBtn()}};
  $('#bexit').onclick=()=>{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}go('card')};
  $('#bmus').onclick=e=>{$('#mute').click();e.currentTarget.setAttribute('aria-pressed',String(Music.on))};
  $('#b3d').onclick=e=>{S.battle3d=!S.battle3d;store.set('sx.battle3d',S.battle3d);e.currentTarget.setAttribute('aria-pressed',String(S.battle3d));mountRenderer()};
  const key=e=>{if(!B||B.over)return;if(e.key==='ArrowRight'){B.me.dir=1;hud()}else if(e.key==='ArrowLeft'){B.me.dir=-1;hud()}else if(e.key==='s'||e.key==='S')$('#sbtn').click()};
  window.addEventListener('keydown',key);B.cleanup=()=>{window.removeEventListener('keydown',key);L.remove();document.body.classList.remove('lock')};
  wireScratch($('#arena'));setTimeout(()=>$('#hint')?.classList.add('gone'),7000);
  mountRenderer();
}
async function mountRenderer(){
  const ar=$('#arena'),myB=B;if(RD){RD.kill();RD=null}ar.classList.remove('d3');
  const tmp=recRenderer2D(ar);tmp.setTick(simTick);RD=tmp;LIVE3D=()=>{myB.over=true;myB.cleanup&&myB.cleanup();if(RD)RD.kill();RD=null};
  if(!S.battle3d)return;
  try{const r=await recRenderer3D(ar);if(B!==myB||!ar.isConnected||RD!==tmp){r.kill();return}tmp.kill();r.setTick(simTick);RD=r;ar.classList.add('d3')}
  catch(e){console.warn('3D unavailable',e)}
}
function end(won){
  const o=$('#over');if(!o)return;const f=B.foe,mask=t=>t.split(/\s+/).map(w=>w[0]+'_'.repeat(Math.max(0,w.length-1))).join(' ');
  const heard=[...B.heard];o.classList.add('on');
  o.innerHTML=`<div class="ocard"><h2>${won?'You win!':'Knocked out…'}</h2><p class="sub">${won?`${esc(f.name)} spins down. `:''}${esc(B.R.who)}'s record stays secret, but you heard ${heard.length} of its songs:</p>
  ${heard.map(t=>`<p class="mask">♪ ${esc(mask(t))}</p>`).join('')||'<p class="note">None this time.</p>'}
  <div class="row" style="margin-top:14px">${won&&S.rival<RIVALS.length-1?'<button class="btn" id="nx" style="background:var(--VOLT)">Next rival →</button>':''}<button class="btn" id="again">Rematch</button><button class="btn" id="tocard">Back to card</button></div></div>`;
  if(won&&S.rival<RIVALS.length-1)$('#nx').onclick=()=>{S.rival++;viewBattle();syncBob()};
  $('#again').onclick=()=>{viewBattle();syncBob()};$('#tocard').onclick=()=>{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}go('card')};
}

/* ---------- boot ---------- */
function askFS(){try{const r=document.documentElement.requestFullscreen?.();r&&r.catch(()=>{})}catch(e){}}
const mute=$('#mute');
mute.onclick=()=>{if(Music.on){Music.stop();mute.setAttribute('aria-pressed','false');mute.textContent='♪ Music off'}else{Music.start();mute.setAttribute('aria-pressed','true');mute.textContent='♪ Music on'}syncBob()};
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.v==='battle')askFS();if(b.dataset.v==='ritual'&&!S.editing){}go(b.dataset.v)});
if(activeEntry())S.view='card';
render();
window.SX={S,Music,makeCreature,creatureSVG,SAMPLES,RIVALS,go,B:()=>B,RD:()=>RD,MB};
}
