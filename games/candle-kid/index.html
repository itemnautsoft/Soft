<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Candle Kid — AR prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Baloo 2',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#video,#gl,#dark,#fx{position:fixed;inset:0;width:100%;height:100%}
#video{object-fit:cover;z-index:0;display:none}
#gl{z-index:1}#dark{z-index:2;pointer-events:none}#fx{z-index:3;pointer-events:none}
#ui{position:fixed;inset:0;z-index:4}
#hud{position:absolute;left:12px;right:12px;top:10px;display:none;gap:10px;align-items:center;font-size:14px;pointer-events:none}
.bar{flex:1;height:12px;border:2px solid #1b120a;border-radius:8px;background:#2a2118;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.bar i{display:block;height:100%;width:100%;border-radius:5px}
#flameBar i{background:linear-gradient(90deg,#ff9b2f,#ffe27a)}
#waxBar i{background:linear-gradient(90deg,#d8d0c4,#fffaf0)}
.lab{font-weight:800;text-shadow:0 2px 0 #000;white-space:nowrap}
#msg{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:22px;font-weight:800;text-shadow:0 2px 0 #000,0 0 12px #000;pointer-events:none;opacity:0;transition:opacity .4s;padding:0 20px}
#msg.on{opacity:1}
#box{position:absolute;left:50%;bottom:28px;width:230px;height:110px;margin-left:-115px;transition:transform .6s cubic-bezier(.5,-0.3,.4,1.3);transform:translateY(0)}
#box.away{transform:translateY(200px)}
#box .body{position:absolute;inset:0;border:4px solid #120c07;border-radius:12px;background:linear-gradient(#c9452f,#9c2f1f);box-shadow:0 6px 0 #120c07}
#box .label{position:absolute;left:16px;right:16px;bottom:12px;height:34px;border-radius:6px;background:#f6e6c4;border:3px solid #120c07;color:#120c07;font-weight:800;font-size:18px;text-align:center;line-height:28px}
#striker{position:absolute;left:10px;right:10px;top:10px;height:30px;border-radius:6px;border:3px solid #120c07;background:#5a3a22 repeating-linear-gradient(45deg,rgba(0,0,0,.25) 0 3px,transparent 3px 6px)}
#striker.hot{box-shadow:0 0 14px 4px rgba(255,170,60,.8)}
#match{position:absolute;width:16px;height:120px;left:0;top:0;transform-origin:8px 10px;display:none;pointer-events:auto}
#match .stick{position:absolute;left:4px;top:14px;width:8px;height:104px;background:#e8c890;border:2px solid #120c07;border-radius:3px}
#match .burnt{position:absolute;left:4px;top:14px;width:8px;height:0;background:#2b1d12;border-radius:3px}
#match .head{position:absolute;left:0;top:0;width:16px;height:22px;background:#d8402c;border:2px solid #120c07;border-radius:8px 8px 6px 6px}
#match .fl{position:absolute;left:-14px;top:-50px;width:44px;height:60px;display:none;filter:drop-shadow(0 0 10px #ffb347)}
#match.lit .fl{display:block}
#match.lit .head{background:#2b1d12}
#joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:3px solid rgba(255,255,255,.35);display:none;pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,220,150,.45);border:3px solid rgba(255,255,255,.5)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#2a1c10,#000 70%);text-align:center;padding:24px}
.screen h1{margin:0;font-size:44px;line-height:1;color:#ffe27a;text-shadow:0 0 24px #ff9b2f,0 3px 0 #120c07}
.screen p{margin:0;max-width:340px;opacity:.85;font-size:16px;line-height:1.35}
.btn{font:inherit;font-weight:800;font-size:19px;padding:12px 26px;border-radius:14px;border:3px solid #120c07;background:#ffd75e;color:#120c07;box-shadow:0 5px 0 #120c07;cursor:pointer;min-width:230px}
.btn.alt{background:#efe7da}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #120c07}
#over,#win{display:none}
#camNote{font-size:13px;opacity:.7;max-width:320px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js"}}</script>
</head>
<body>
<video id="video" playsinline muted autoplay></video>
<canvas id="gl"></canvas>
<canvas id="dark"></canvas>
<canvas id="fx"></canvas>
<div id="ui">
  <div id="hud">
    <span class="lab">🔥</span><div class="bar" id="flameBar"><i></i></div>
    <span class="lab">Wax</span><div class="bar" id="waxBar"><i></i></div>
    <span class="lab" id="matchCt">×4</span>
    <span class="lab" id="candleCt">0/5</span>
  </div>
  <div id="msg"></div>
  <div id="box" class="away"><div class="body"></div><div id="striker"></div><div class="label">MATCHES</div></div>
  <div id="match"><svg class="fl" viewBox="0 0 44 60"><path d="M22 2C30 16 40 24 40 38a18 18 0 0 1-36 0C4 26 14 22 22 2z" fill="#ffd75e" stroke="#120c07" stroke-width="3"/><path d="M22 26c5 7 8 10 8 16a8 8 0 0 1-16 0c0-6 4-9 8-16z" fill="#fffbe8"/></svg><div class="stick"></div><div class="burnt"></div><div class="head"></div></div>
  <div id="joy"><i></i></div>
  <div class="screen" id="title">
    <h1>Candle Kid</h1>
    <p>It's dark. Strike a match, light the little candle, and find the other candles before your flame — or your wax — runs out.</p>
    <button class="btn" id="btnCam">Play with camera</button>
    <button class="btn alt" id="btnRoom">Play in demo room</button>
    <div id="camNote"></div>
  </div>
  <div class="screen" id="over"><h1 id="overT">Out of matches</h1><p id="overP"></p><button class="btn" id="btnAgain">Try again</button></div>
  <div class="screen" id="win" style="background:radial-gradient(circle at 50% 40%,rgba(80,50,10,.6),rgba(0,0,0,.6) 70%)"><h1>Room lit!</h1><p id="winP"></p><button class="btn" id="btnAgain2">Play again</button></div>
</div>

// ---------- basics ----------
const $ = id => document.getElementById(id);
const glc = $('gl'), dark = $('dark'), fx = $('fx'), video = $('video');
const dctx = dark.getContext('2d'), fctx = fx.getContext('2d');
const renderer = new THREE.WebGLRenderer({canvas: glc, antialias: true, alpha: true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
let W = 0, H = 0;
function resize(){
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  camera.aspect = W / H; camera.updateProjectionMatrix();
  for (const c of [dark, fx]) { c.width = W; c.height = H; }
}
addEventListener('resize', resize); resize();

// toon ramp
const ramp = new THREE.DataTexture(new Uint8Array([105, 105, 105, 255, 185, 185, 185, 255, 255, 255, 255, 255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({color, gradientMap: ramp, ...extra});
const outlineMat = new THREE.ShaderMaterial({
  uniforms: {th: {value: 0.028}},
  vertexShader: `uniform float th; void main(){ vec3 p = position + normal * th; gl_Position = projectionMatrix * modelViewMatrix * vec4(p,1.0); }`,
  fragmentShader: `void main(){ gl_FragColor = vec4(0.05,0.035,0.025,1.0); }`,
  side: THREE.BackSide
});
function mesh(geo, mat, parent, outline = true){
  const m = new THREE.Mesh(geo, mat);
  if (outline){ const o = new THREE.Mesh(geo, outlineMat); m.add(o); }
  parent && parent.add(m); return m;
}
const lathe = (pts, seg = 40) => new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), seg);

// ---------- candle kid: itemnaut's "Lumi" model (from Lumi.blend: mesh + baked colour/normal maps) ----------
const BRASS = 0xa08548;
const black = new THREE.MeshBasicMaterial({color: 0x120c07});
const kid = new THREE.Group(); scene.add(kid);
const body = new THREE.Group(); kid.add(body);
const b64 = (s, T) => { const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return new T(u.buffer); };
const texL = new THREE.TextureLoader();
const lumiMap = texL.load(LUMI_COLOR); lumiMap.colorSpace = THREE.SRGBColorSpace; lumiMap.flipY = true; lumiMap.anisotropy = 4;
const lumiNormal = texL.load(LUMI_NORMAL); lumiNormal.flipY = true;
const lumiMat = new THREE.MeshStandardMaterial({map: lumiMap, normalMap: lumiNormal, roughness: .55, metalness: 0, emissive: 0x000000});
const waxMat = lumiMat, brassMat = lumiMat;
outlineMat.uniforms.th.value = .014;
function lumiPart(d){
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(b64(d.p, Float32Array), 3));

function update(dt){

  S.flare = Math.max(0, S.flare - dt * 1.5);

  // --- movement ---
  let moving = 0;
  if (S.mode === 'play'){
    const j = S.joy;
    const want = new THREE.Vector3(j ? j.dx : 0, 0, j ? j.dy : 0);
    const mag = Math.min(1, want.length());
    S.vel.lerp(want.multiplyScalar(2.6), Math.min(1, dt * 8));
    moving = S.vel.length() / 2.6;
    kid.position.addScaledVector(S.vel, dt);
    for (const o of obstacles){
      const dx = kid.position.x - o.x, dz = kid.position.z - o.z, d = Math.hypot(dx, dz), m = o.r + .45;
      if (d < m && d > 1e-4){ kid.position.x = o.x + dx / d * m; kid.position.z = o.z + dz / d * m; }
    }
    kid.position.x = THREE.MathUtils.clamp(kid.position.x, -ROOM, ROOM);
    kid.position.z = THREE.MathUtils.clamp(kid.position.z, -ROOM, ROOM);
    if (mag > .1){
      const target = Math.atan2(S.vel.x, S.vel.z);
      let d = target - kid.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));

    if (S.gust){ S.gust.t -= dt; if (S.gust.t <= 0){ S.gust = null; S.nextGust = 10 + Math.random() * 10; } }
    // flame + wax
    let drain = .012 + moving * .02;
    if (S.gust) drain += .03 + moving * .17;
    S.flame = Math.max(0, S.flame - drain * dt);
    S.wax = Math.max(0, S.wax - dt * (.004 + .01 * S.flame));
    // candles
    for (const c of candles){
      if (!c.lit && Math.hypot(kid.position.x - c.x, kid.position.z - c.z) < 1.0){
        c.lit = true; c.f.visible = c.gl.visible = true; S.litCount++;
        S.flame = 1; S.flare = .8; noise(.4, 1500, 400, .5, .8);

      }

    if (m.lit){

      const w = toScreen(wickWorld);
      if (Math.hypot(m.x + 8 - w.x, m.y - 8 - w.y) < 46){

    if (m && !m.held && m.rest){

    }
    if (S.match){
      ui.match.style.transform = `translate(${m.x}px,${m.y}px) rotate(${m.ang}deg)`;
    }
  }
  if (S.lit && S.mode === 'play') S.flame = Math.min(1, S.flame + dt * (S.flame < .9 && S.flare > 0 ? 1.6 : 0)); // initial grow-in

  // --- animate kid ---
  const ph = t * 11;
  const walk = Math.min(1, moving * 1.4);
  body.position.y = Math.abs(Math.sin(ph)) * .05 * walk + Math.sin(t * 2) * .008;
  body.rotation.z = Math.sin(ph) * .09 * walk;
  feet.forEach((f, i) => { const sg = i ? -1 : 1; f.position.z = FOOT_REST[i].z + sg * Math.sin(ph) * .16 * walk; f.position.y = FOOT_REST[i].y + Math.max(0, sg * Math.sin(ph)) * .07 * walk; });
  const ws = .62 + .38 * S.wax; applyMelt(ws);
  flameG.position.y = WAX_BASE + WAX_H * ws - .02;
  const blink = (t % 3.7) < .11 ? .15 : 1; eyes.forEach(e => e.scale.y = 1.5 * blink);
  // flame shape
  const f = S.lit ? S.flame : 0;
  flame.visible = f > 0; glow.visible = f > 0 && !S.studio;
  const flick = .9 + .1 * Math.sin(t * 23) * Math.sin(t * 7.3) + (S.gust ? .15 * Math.sin(t * 40) : 0);
  const fs = (.4 + .6 * f) * (1 + S.flare * .4);
  flame.scale.set(fs, fs * flick, fs);
  const lean = new THREE.Vector3(-S.vel.x * .12 + (S.gust ? S.gust.dir * .5 : 0), 0, -S.vel.z * .12);
  lean.applyAxisAngle(new THREE.Vector3(0, 1, 0), -kid.rotation.y);
  flame.rotation.z = THREE.MathUtils.lerp(flame.rotation.z, -lean.x, .2);
  flame.rotation.x = THREE.MathUtils.lerp(flame.rotation.x, lean.z, .2);
  glow.scale.setScalar((.8 + 1.6 * f) * flick);
  lumiMat.emissive.setRGB(.05 * f, .03 * f, .01 * f);
  // world positions
  kid.updateMatrixWorld(true);
  wickWorld.set(0, .14, 0); flameG.localToWorld(wickWorld);
  flameWorld.set(0, .3, 0); flameG.localToWorld(flameWorld);
  kidLight.position.copy(flameWorld);
  kidLight.intensity = S.studioLight ? 0 : (1.5 + f * 4) * flick + S.flare * 4;
  kidLight.distance = 2.5 + f * 4.5;
  fill.intensity = S.studioLight ? 1.6 : .35 + f * 1.6;
  fill.position.copy(kid.position).add(tmp.set(0, 3, 4)); fill.target.position.copy(kid.position);
  for (const c of candles){
    if (c.lit){ c.t += dt; const k = .9 + .1 * Math.sin(c.t * 19) * Math.sin(c.t * 5.7); c.f.scale.set(1, k, 1); c.gl.scale.setScalar(.9 * k); c.L.intensity = 3.5 * k; }
  }
  if (!S.studio) amb.intensity = S.cam ? .9 : .25 + S.reveal * 1.2;

  // --- camera follow ---
  if (S.studio){ hud(); return; }
  const target = tmp.copy(kid.position).add(new THREE.Vector3(0, 3.6, 9.5));
  if (S.mode === 'title') target.set(0, 3.6, 9.5);
  camera.position.lerp(target, Math.min(1, dt * 3));
  camera.lookAt(kid.position.x, kid.position.y + 0.9, kid.position.z - 0.6);
  camera.updateMatrixWorld();
  hud();
}

function render(dt){
  renderer.render(scene, camera);
  // darkness
  dctx.globalCompositeOperation = 'source-over';
  dctx.clearRect(0, 0, W, H);
  if (S.mode === 'title' || S.studio) return;
  const base = S.cam ? .965 : .985;
  dctx.fillStyle = `rgba(3,2,8,${base * (1 - S.reveal)})`; dctx.fillRect(0, 0, W, H);
  const lights = [];
  const flick = .94 + .06 * Math.sin(S.t * 17) * Math.sin(S.t * 6.1);
  const kp = kid.position.clone().add(new THREE.Vector3(0, 1.1, 0));
  const ks = toScreen(kp);
  if (S.lit){
    const R = worldRadiusPx(kp, (.8 + 2.4 * S.flame) * (1 + S.flare * .3)) * flick;
    lights.push({x: ks.x, y: ks.y, r: R, a: 1});
  } else lights.push({x: ks.x, y: ks.y, r: worldRadiusPx(kp, 1.1), a: .28});
  for (const c of candles) if (c.lit){
    const p = new THREE.Vector3(c.x, .5, c.z), s = toScreen(p);
    if (s.z < 1) lights.push({x: s.x, y: s.y, r: worldRadiusPx(p, 1.9) * (.95 + .05 * Math.sin(c.t * 13)), a: .95});
  }
  if (S.match && S.match.lit){
    lights.push({x: S.match.x + 8, y: S.match.y - 14, r: (150 + 30 * S.flare) * flick * (1 - S.match.burn * .4), a: .95});
  }
  dctx.globalCompositeOperation = 'destination-out';
  for (const L of lights){
    const g = dctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    g.addColorStop(0, `rgba(0,0,0,${L.a})`); g.addColorStop(.5, `rgba(0,0,0,${L.a * .82})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(L.x, L.y, L.r, 0, Math.PI * 2); dctx.fill();
  }
  // warm tint
  dctx.globalCompositeOperation = 'source-over';
  for (const L of lights){
    if (L.a < .5) continue;
    const g = dctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    g.addColorStop(0, `rgba(255,170,70,${S.cam ? .22 : .12})`); g.addColorStop(1, 'rgba(255,120,40,0)');
    dctx.fillStyle = g; dctx.beginPath(); dctx.arc(L.x, L.y, L.r, 0, Math.PI * 2); dctx.fill();
  }

  // fx: sparks + wind
  fctx.clearRect(0, 0, W, H);
  fctx.globalCompositeOperation = 'lighter';
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx; p.y += p.vy; p.vy += .35;
    fctx.fillStyle = `rgba(255,${180 + Math.random() * 60 | 0},90,${p.life / p.max})`;
    fctx.beginPath(); fctx.arc(p.x, p.y, p.s, 0, 6.3); fctx.fill();
  }
  fctx.globalCompositeOperation = 'source-over';
  if (S.gust){
    if (Math.random() < .6) wind.push({x: S.gust.dir > 0 ? -100 : W + 100, y: Math.random() * H, l: 60 + Math.random() * 120, v: 900 + Math.random() * 600});
  }
  fctx.strokeStyle = 'rgba(220,230,255,.35)'; fctx.lineWidth = 2; fctx.lineCap = 'round';
  for (let i = wind.length - 1; i >= 0; i--){
    const w = wind[i], d = S.gust ? S.gust.dir : (w.v > 0 ? 1 : -1);
    w.x += d * w.v * dt;
    if (w.x < -300 || w.x > W + 300){ wind.splice(i, 1); continue; }
    fctx.beginPath(); fctx.moveTo(w.x, w.y); fctx.quadraticCurveTo(w.x - d * w.l / 2, w.y - 6, w.x - d * w.l, w.y); fctx.stroke();
  }
}
window.__g = {S, kid, camera, candles, start, ignite, studio(view, ref){
  S.studio = true; S.mode = 'studio'; S.lit = true; S.flame = 1; S.flare = 0; room.visible = false; S.cam = false;
  for (const el of ['title','hud','box','match','msg']) $(el).style.display = 'none';
  renderer.setClearColor(0xffffff, 1); glow.visible = false; S.studioLight = true;
  const a = {front: 0, side: Math.PI / 2, back: Math.PI, q: Math.PI / 4}[view] || 0, d = 14;
  camera.fov = 11; camera.updateProjectionMatrix();
  camera.position.set(Math.sin(a) * d, 1.25, Math.cos(a) * d); camera.lookAt(0, 1.18, 0);
  kid.rotation.y = 0; kid.position.set(0, 0, 0); amb.intensity = 1.4; amb.color.set(0xffffff); amb.groundColor.set(0x887766);
}};
</script>
