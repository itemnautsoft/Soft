<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f2a">
<title>NextQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--px:"Press Start 2P",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0f2a;color:#fff;font-family:var(--px);overflow:hidden;
 touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button{font:inherit;color:inherit}
.hide{display:none!important}
#map{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.win{background:linear-gradient(#2a3db0,#0d1660);border:3px solid #fff;border-radius:6px;
 box-shadow:0 0 0 2px #0b0f2a,0 4px 0 2px #0b0f2a88;padding:12px;font-size:10px;line-height:1.8;color:#fff}
.btn{background:#0d1660;border:2px solid #fff;border-radius:4px;padding:10px 10px;font-size:9px;cursor:pointer;color:#fff;
 box-shadow:0 0 0 2px #0b0f2a;touch-action:manipulation}
.btn:active{background:#3346c4;transform:translateY(1px)}
.btn.gold{border-color:#f2c94c;color:#f2c94c}
.btn.dim{opacity:.45}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 8px 0;display:flex;gap:8px;
 justify-content:space-between;align-items:flex-start;pointer-events:none}
#stats{padding:7px 9px;font-size:8px;line-height:1.9;pointer-events:auto}
#stats b{color:#f2c94c;font-weight:normal}
#gear{pointer-events:auto;padding:8px 10px;font-size:12px}
#chip{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 82px);padding:7px 10px;
 font-size:8px;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
#chip b{color:#f2c94c;font-weight:normal}
#osm{position:fixed;right:4px;bottom:calc(env(safe-area-inset-bottom) + 62px);font:9px ui-monospace,Menlo,monospace;
 color:#fff;background:#0008;padding:1px 4px;border-radius:3px;pointer-events:none}
#side{position:fixed;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
#side .btn{width:40px;height:40px;padding:0;font-size:13px}
#side .btn.on{border-color:#f2c94c;color:#f2c94c}
#bar{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:6px;justify-content:center}
#bar .btn{flex:1;max-width:120px;padding:12px 4px}
#pad{position:fixed;left:10px;bottom:calc(env(safe-area-inset-bottom) + 72px);display:grid;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px);gap:4px}
#pad .btn{padding:0;font-size:12px;opacity:.9}
#pad .sp{visibility:hidden}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 120px);padding:8px 12px;font-size:9px;
 max-width:90vw;text-align:center;pointer-events:none;transition:opacity .4s}
#dlgWrap{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
#dlg{width:100%;max-width:440px;max-height:84vh;display:flex;flex-direction:column}
#dlgT{color:#f2c94c;font-size:11px;margin-bottom:8px}
#dlgB{overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;user-select:text;-webkit-user-select:text}
#dlgB p{margin:0 0 10px}
#dlgB small{color:#b8c4ff;font-size:8px}
#dlgBtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:flex-end}
.row{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed #ffffff44}
.row:last-child{border-bottom:0}
.row .ic{width:30px;height:30px;image-rendering:pixelated;flex:none}
.row .tx{flex:1;min-width:0;font-size:8px;line-height:1.8}
.row .tx b{font-weight:normal;color:#fff;font-size:9px}
.row .tx i{font-style:normal;color:#b8c4ff}
.row .btn{padding:8px;font-size:8px;flex:none}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs .btn{flex:1;padding:8px 4px}
.tabs .btn.on{border-color:#f2c94c;color:#f2c94c}
textarea{width:100%;min-height:70px;font:12px/1.5 ui-monospace,Menlo,monospace;background:#0b1250;color:#fff;border:2px solid #fff;border-radius:4px;padding:8px;user-select:text;-webkit-user-select:text}
.note img{width:100%;border:2px solid #fff;border-radius:4px;image-rendering:auto;display:block}
.load li{list-style:none;margin:4px 0}
.load{padding:0;margin:0}
#intro{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#1b1f5a 0%,#05061a 70%);z-index:30;overflow:hidden}
#intro .st{position:absolute;width:2px;height:2px;background:#fff;animation:tw 3s infinite ease-in-out}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
#paper{position:absolute;left:50%;top:26%;width:150px;height:110px;transform:translate(-50%,-50%);background:#e9dcb5;border:3px solid #6b4a24;
 border-radius:3px;box-shadow:0 0 40px #ffe9a855;display:flex;align-items:center;justify-content:center;color:#6b4a24;font-size:11px;
 animation:float 5s infinite ease-in-out;opacity:0;transition:opacity 2s}
@keyframes float{0%,100%{margin-top:0}50%{margin-top:-10px}}
#dream{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 24px);min-height:120px;font-size:11px;line-height:2;max-width:560px;margin:0 auto}
#caret{position:absolute;right:12px;bottom:6px;animation:tw 1s infinite}
#skip{position:absolute;right:12px;top:calc(env(safe-area-inset-top) + 12px);font-size:8px;padding:8px}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:40;transition:opacity .6s}
</style>
</head>
<body>
<canvas id="map"></canvas>
<div id="hud" class="hide"><div class="win" id="stats"></div><button class="win btn" id="gear" aria-label="Menu">&#9881;</button></div>
<div id="chip" class="win hide"></div>
<div id="osm" class="hide">&copy; OpenStreetMap contributors</div>
<div id="side" class="hide">
 <button class="btn" id="zin" aria-label="Zoom in">+</button>
 <button class="btn" id="zout" aria-label="Zoom out">&minus;</button>
 <button class="btn on" id="me" aria-label="Follow me">&#9678;</button>
</div>
<div id="pad" class="hide">
 <span class="sp"></span><button class="btn" data-d="0,1">&#9650;</button><span class="sp"></span>
 <button class="btn" data-d="-1,0">&#9664;</button><button class="btn" id="turbo" style="font-size:7px">x1</button><button class="btn" data-d="1,0">&#9654;</button>
 <span class="sp"></span><button class="btn" data-d="0,-1">&#9660;</button><span class="sp"></span>
</div>
<div id="bar" class="hide">
 <button class="btn" id="bQuest">QUESTS</button>
 <button class="btn" id="bBag">BAG</button>
 <button class="btn gold" id="bSnap">SNAP</button>
 <button class="btn" id="bNotes">JOURNAL</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<div id="toast" class="win hide"></div>
<div id="dlgWrap" class="hide"><div class="win" id="dlg"><div id="dlgT"></div><div id="dlgB"></div><div id="dlgBtns"></div></div></div>
<div id="intro" class="hide"><div id="paper">HOME</div><button class="btn" id="skip">SKIP</button>
 <div class="win" id="dream"><span id="dreamTxt"></span><span id="caret">&#9660;</span></div></div>
<div id="flash"></div>

<script>
'use strict';
/* =========================================================================
   NextQuest — prototype 0.1  (itemnaut × Claude)
   Your real streets become a JRPG overworld. Plant a flag at home, the map
   downloads from OpenStreetMap, and simple rules (no AI) place shops,
   dungeons, lore stones and daily treasure at real walking distances.
   ========================================================================= */
const $=s=>document.querySelector(s);
const DEMO={lat:40.9347,lon:-74.1197};           // Fair Lawn, NJ
const R=4300;                                     // download radius (m): covers a 2.5 mi walk out
const CELL=10, REVEAL=30;                         // fog cell size, reveal radius (m)
const STRIDE=0.8, MILE=1609.34, ARRIVE=30;        // 10k steps ≈ 5 mi; arrival radius (m)
const OVERPASS=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter'];
const MOCK=/[?&]mock/.test(location.search);
const LS='nextquest.v1';
const PX=3;                                       // CSS pixels per game pixel

let S=null, world=null, grid=null, Dflag=null, flagNode=-1, places=[], today=null;
let revealed=new Set(), lastFix=null, target=null, tree=null, routeCache=null;
const inside=new Set();

/* ---------------- storage ---------------- */
function loadState(){try{return JSON.parse(localStorage.getItem(LS))}catch(e){return null}}
let saveT=0;
function save(now){if(!S)return;const f=()=>{try{S.revealed=[...revealed];localStorage.setItem(LS,JSON.stringify(S))}catch(e){console.warn(e)}};
 clearTimeout(saveT);if(now)f();else saveT=setTimeout(f,1200)}
const idb=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('nextquest',1);
 r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('notes',{keyPath:'id'})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=(st,mode,fn)=>open().then(db=>new Promise((res,rej)=>{const t=db.transaction(st,mode);const q=fn(t.objectStore(st));
  t.oncomplete=()=>res(q?q.result:undefined);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
 return{get:k=>tx('kv','readonly',s=>s.get(k)),set:(k,v)=>tx('kv','readwrite',s=>s.put(v,k)),del:k=>tx('kv','readwrite',s=>s.delete(k)),
  notes:()=>tx('notes','readonly',s=>s.getAll()),putNote:n=>tx('notes','readwrite',s=>s.put(n)),delNote:id=>tx('notes','readwrite',s=>s.delete(id))}})();

/* ---------------- math ---------------- */
let O={lat:0,lon:0,kx:1,ky:110540};
function setOrigin(lat,lon){O={lat,lon,kx:111320*Math.cos(lat*Math.PI/180),ky:110540}}
const P=(lat,lon)=>[(lon-O.lon)*O.kx,(lat-O.lat)*O.ky];
const U=(x,y)=>[O.lat+y/O.ky,O.lon+x/O.kx];
function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mi=m=>(m/MILE).toFixed(m<MILE*10?1:0)+' mi';
const steps=m=>(Math.round(m/STRIDE/100)*100).toLocaleString();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function polyArea(p){let a=0;for(let i=0,n=p.length;i<n;i+=2){const j=(i+2)%n;a+=p[i]*p[j+1]-p[j]*p[i+1]}return Math.abs(a/2)}
function centroid(p){let x=0,y=0,n=p.length/2;for(let i=0;i<p.length;i+=2){x+=p[i];y+=p[i+1]}return[x/n,y/n]}
function pointIn(a,x,y){const b=a.b;if(x<b[0]||x>b[2]||y<b[1]||y>b[3])return false;const p=a.p;let c=false;
 for(let i=0,j=p.length-2;i<p.length;j=i,i+=2){if((p[i+1]>y)!==(p[j+1]>y)&&x<(p[j]-p[i])*(y-p[i+1])/(p[j+1]-p[i+1])+p[i])c=!c}return c}
function mkPoly(k,pts,name){const p=Float32Array.from(pts);let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
 for(let i=0;i<p.length;i+=2){if(p[i]<x0)x0=p[i];if(p[i]>x1)x1=p[i];if(p[i+1]<y0)y0=p[i+1];if(p[i+1]>y1)y1=p[i+1]}
 return{k,p,b:[x0,y0,x1,y1],name:name||null}}
function sunElev(lat,lon,d=new Date()){const r=Math.PI/180;const day=(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(d.getUTCFullYear(),0,0))/864e5;
 const decl=-23.44*Math.cos(r*360/365*(day+10));const ha=((d.getUTCHours()+d.getUTCMinutes()/60+lon/15)-12)*15;
 return Math.asin(Math.sin(lat*r)*Math.sin(decl*r)+Math.cos(lat*r)*Math.cos(decl*r)*Math.cos(ha*r))/r}

/* ---------------- map data: OpenStreetMap + Wikipedia ---------------- */
async function overpass(q){let err;for(const url of OVERPASS){try{const ac=new AbortController();const to=setTimeout(()=>ac.abort(),160000);
 const r=await fetch(url,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ac.signal});
 clearTimeout(to);if(!r.ok)throw new Error('map server said '+r.status);return await r.json()}catch(e){err=e}}throw err}
const HW='primary|primary_link|secondary|secondary_link|tertiary|tertiary_link|unclassified|residential|living_street|pedestrian|footway|path|steps|cycleway|track|bridleway';
const qNet=(la,lo,r)=>`[out:json][timeout:150];way["highway"~"^(${HW})$"](around:${r},${la},${lo});out body qt;>;out skel qt;`;
const qFeat=(la,lo,r)=>{const A=`(around:${r},${la},${lo})`;return `[out:json][timeout:150];(way["leisure"~"^(park|nature_reserve|garden|recreation_ground)$"]${A};way["landuse"~"^(forest|meadow|village_green|recreation_ground)$"]${A};way["natural"~"^(wood|water|scrub|wetland)$"]${A};way["waterway"~"^(river|stream|canal)$"]${A};);out geom qt;(nwr["shop"~"^(convenience|supermarket|general|variety_store|deli|chemist|bakery)$"]${A};nwr["amenity"~"^(pharmacy|cafe|ice_cream|library|townhall|fountain)$"]${A};nwr["historic"]${A};nwr["tourism"~"^(artwork|viewpoint|museum|attraction)$"]${A};);out center qt;`};
async function wikiNear(la,lo){try{const u=`https://en.wikipedia.org/w/api.php?action=query&list=geosearch&gscoord=${la.toFixed(5)}|${lo.toFixed(5)}&gsradius=10000&gslimit=100&format=json&origin=*`;
 const j=await(await fetch(u)).json();return(j.query&&j.query.geosearch||[]).map(g=>({type:'wiki',pageid:g.pageid,title:g.title,lat:g.lat,lon:g.lon}))}catch(e){return[]}}

function buildNet(j){
 const LL=new Map();for(const e of j.elements)if(e.type==='node')LL.set(e.id,e);
 const idx=new Map(),X=[],Y=[],ea=[],eb=[],ew=[],roads=[];
 const gi=id=>{let i=idx.get(id);if(i===undefined){const n=LL.get(id);if(!n)return-1;const[x,y]=P(n.lat,n.lon);i=X.length;X.push(x);Y.push(y);idx.set(id,i)}return i};
 for(const e of j.elements){if(e.type!=='way'||!e.nodes)continue;const t=e.tags||{},hw=t.highway;if(!hw)continue;
  const foot=t.foot,footOK=foot==='yes'||foot==='designated';
  if(foot==='no'||((t.access==='private'||t.access==='no')&&!footOK))continue;
  const kind=/^(primary|secondary)/.test(hw)?2:/^(tertiary|unclassified|residential|living_street)/.test(hw)?1:0;
  const walk=!(kind===2&&(t.sidewalk==='no'||t.sidewalk==='none')&&!footOK);   // sidewalks only
  const pts=[];let pv=-1;
  for(const id of e.nodes){const i=gi(id);if(i<0){pv=-1;continue}pts.push(X[i],Y[i]);
   if(walk&&pv>=0&&pv!==i){ea.push(pv);eb.push(i);ew.push(Math.hypot(X[i]-X[pv],Y[i]-Y[pv]))}pv=i}
  if(pts.length>=4)roads.push(mkPoly(kind,pts,t.name))}
 const n=X.length,off=new Int32Array(n+1);for(let k=0;k<ea.length;k++){off[ea[k]+1]++;off[eb[k]+1]++}for(let i=0;i<n;i++)off[i+1]+=off[i];
 const to=new Int32Array(ea.length*2),w=new Float32Array(ea.length*2),f=off.slice(0,n);
 for(let k=0;k<ea.length;k++){const a=ea[k],b=eb[k];to[f[a]]=b;w[f[a]++]=ew[k];to[f[b]]=a;w[f[b]++]=ew[k]}
 roads.sort((a,b)=>a.k-b.k);
 return{g:{n,x:Float32Array.from(X),y:Float32Array.from(Y),off,to,w},roads}}

const KEEP=['historic','tourism','memorial','artwork_type','inscription','description','start_date','wikipedia','amenity','shop','cuisine','opening_hours'];
function buildFeat(j,wiki){const areas=[],pois=[];
 for(const e of j.elements){const t=e.tags||{};
  if(e.geometry){const G=e.geometry.filter(Boolean);if(G.length<2)continue;const pts=[];for(const g of G){const[x,y]=P(g.lat,g.lon);pts.push(x,y)}
   const closed=G.length>3&&G[0].lat===G[G.length-1].lat&&G[0].lon===G[G.length-1].lon;let k=null;
   if(t.waterway)k='river';else if(t.natural==='water')k='water';else if(t.natural==='wood'||t.landuse==='forest')k='wood';
   else if(t.natural==='wetland'||t.natural==='scrub'||t.landuse==='meadow')k='meadow';else if(t.leisure||t.landuse)k='park';
   if(!k||(k!=='river'&&!closed))continue;const a=mkPoly(k,pts,t.name);
   if(k==='river')a.wide=t.waterway==='river'?16:t.waterway==='canal'?8:3;else{a.area=polyArea(a.p);[a.cx,a.cy]=centroid(a.p)}
   areas.push(a);continue}
  const lat=e.lat??(e.center&&e.center.lat),lon=e.lon??(e.center&&e.center.lon);if(lat==null)continue;
  const sh=t.shop||'',am=t.amenity||'';let k=null;
  if(am==='pharmacy'||/^(convenience|supermarket|general|variety_store|deli|chemist)$/.test(sh))k='shop';
  else if(am==='cafe'||am==='ice_cream'||sh==='bakery')k='inn';
  else if(am==='library')k='guild';else if(am==='townhall')k='castle';
  else if(t.historic||t.tourism||am==='fountain')k='lore';
  if(!k)continue;const[x,y]=P(lat,lon);const tags={};for(const q of KEEP)if(t[q])tags[q]=t[q];
  pois.push({k,id:e.type[0]+e.id,name:t.name||null,x,y,tags})}
 for(const w of wiki){const[x,y]=P(w.lat,w.lon);if(Math.hypot(x,y)>R)continue;pois.push({k:'lore',id:'w'+w.pageid,name:w.title,x,y,pageid:w.pageid,tags:{}})}
 const ord={park:0,meadow:1,wood:2,water:3,river:4};areas.sort((a,b)=>ord[a.k]-ord[b.k]);
 return{areas,pois}}

/* --- mock world (for desk testing: add ?mock to the URL) --- */
function mockData(lat,lon){const prev=O;setOrigin(lat,lon);let id=1;const els=[],ids={},N=40,SP=110,r=rng(7);
 const nid=(i,j)=>{const k=i+','+j;if(!ids[k]){const[la,lo]=U(i*SP+(r()-.5)*20,j*SP+(r()-.5)*20);ids[k]=id;els.push({type:'node',id:id++,lat:la,lon:lo})}return ids[k]};
 for(let j=-N;j<=N;j++){const row=[],col=[];for(let i=-N;i<=N;i++){row.push(nid(i,j));col.push(nid(j,i))}
  els.push({type:'way',id:id++,nodes:row,tags:{highway:j%6===0?'secondary':'residential',name:'Row '+j}});
  els.push({type:'way',id:id++,nodes:col,tags:{highway:j%6===0?'secondary':'residential',name:'Col '+j}})}
 for(let k=0;k<60;k++){const i=Math.floor((r()-.5)*2*N),j=Math.floor((r()-.5)*2*N);els.push({type:'way',id:id++,nodes:[nid(i,j),nid(i+1,j+1)],tags:{highway:'footway'}})}
 const fe=[];const box=(cx,cy,w,h,tags)=>{const g=[[cx-w,cy-h],[cx+w,cy-h],[cx+w,cy+h],[cx-w,cy+h],[cx-w,cy-h]].map(([x,y])=>{const[la,lo]=U(x,y);return{lat:la,lon:lo}});fe.push({type:'way',id:id++,geometry:g,tags})};
 box(400,-300,160,120,{leisure:'park',name:'Memorial Park'});box(-900,700,300,220,{natural:'wood',name:'Old Woods'});box(2200,1500,260,400,{leisure:'park',name:'River Park'});
 box(-2600,-1800,240,200,{leisure:'park',name:'Far Meadows'});box(1000,2600,200,120,{natural:'water',name:'Blue Pond'});
 const g2=[];for(let i=-45;i<=45;i++){const[la,lo]=U(3000+Math.sin(i/6)*120,i*100);g2.push({lat:la,lon:lo})}fe.push({type:'way',id:id++,geometry:g2,tags:{waterway:'river',name:'Passaic River'}});
 const poi=(x,y,tags)=>{const[la,lo]=U(x,y);fe.push({type:'node',id:id++,lat:la,lon:lo,tags})};
 for(let k=0;k<30;k++)poi((r()-.5)*7000,(r()-.5)*7000,{shop:'convenience',name:'Corner Mart '+k});
 poi(180,140,{shop:'convenience',name:'QuickChek'});poi(-700,-400,{amenity:'pharmacy',name:'Drug Fair'});

function reveal(x,y){let nw=0;const r=REVEAL,i0=Math.floor((x-r)/CELL),i1=Math.floor((x+r)/CELL),j0=Math.floor((y-r)/CELL),j1=Math.floor((y+r)/CELL);
 for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const cx=(i+.5)*CELL-x,cy=(j+.5)*CELL-y;if(cx*cx+cy*cy<=(r+CELL/2)**2){const k=ckey(i,j);if(!revealed.has(k)){revealed.add(k);nw++}}}return nw}
function revealLine(ax,ay,bx,by){const d=Math.hypot(bx-ax,by-ay),n=Math.max(1,Math.ceil(d/5));let nw=0;for(let s=1;s<=n;s++)nw+=reveal(ax+(bx-ax)*s/n,ay+(by-ay)*s/n);return nw}
function credit(seg,nw){const dk=dateKey();if(S.day.dk!==dk)S.day={dk,m:0};S.day.m+=seg;S.total+=seg;
 S.acc.g+=seg;S.acc.c+=nw;let got=0;while(S.acc.g>=25){S.acc.g-=25;got++}while(S.acc.c>=12){S.acc.c-=12;got++}S.gold+=got;
 S.acc.mer+=seg;if(S.acc.mer>=350){S.acc.mer=0;if(!(S.merchant&&S.merchant.until>Date.now())&&Math.random()<.35)spawnMerchant()}}
function onPos(pos){if(simOn)return;const c=pos.coords;gpsAcc=Math.round(c.accuracy);if(c.accuracy>35){hud();return}const[x,y]=P(c.latitude,c.longitude);onMove(x,y,false)}
function onMove(x,y,sim){const now=Date.now(),L=lastFix;
 if(!L){lastFix={x,y,t:now};S.pos={x,y};reveal(x,y);after();return}
 const seg=Math.hypot(x-L.x,y-L.y);if(!sim&&seg<4)return;
 const v=seg/Math.max(.5,(now-L.t)/1000);let nw;
 if(sim||(v<4.2&&seg<250)){nw=revealLine(L.x,L.y,x,y);credit(seg,nw)}else reveal(x,y);   // faster than a jog = a car or bus: no credit
 lastFix={x,y,t:now};S.pos={x,y};after()}

  return dlg({title:'CASTLE · '+nm,html:'<p>The guards wave you through.</p>'})}

  return dlg({title:'DUNGEON · '+(nm||'The Green Depths'),html:'<p>It is quiet today. Come back tomorrow.</p>'})}

  return dlg({title:'MILE CHEST!',html:'<p>You walked a mile from home and found it. <b>+40 gold</b> and a supply!</p><p><small>Walk home for 2 miles in all. A new chest appears tomorrow.</small></p>'});

  return dlg({title:'GRAND CHEST!!',html:`<p>2.5 miles along the sidewalks from your flag, ${esc(p.where)}.</p><p><b>+150 gold</b>, a Map Fragment and an <b>Explorer's Star</b>.</p><p>Walk home to finish a 5-mile, 10,000-step day.</p>`})}}

 html:(p.role==='merchant'?'<p>"Psst. Rare goods, fair prices. I move on soon."</p>':'<p>"Welcome! What\'ll it be?"</p>')+`<p>Gold: <b style="color:#f2c94c">${S.gold}</b></p>`+
  list.map(k=>{const it=ITEMS[k],pr=Math.ceil(it.p*mult);return`<div class="row"><div class="tx"><b>${it.n}</b> <i>${pr}g</i><br>${it.d}<br><i>Have ${S.inv[k]||0}</i></div><button class="btn${S.gold<pr?' dim':''}" data-buy="${k}" data-pr="${pr}">BUY</button></div>`}).join(''),
 buttons:[{t:'LEAVE'}]});const wire=()=>$('#dlgB').onclick=e=>{const b=e.target.closest('[data-buy]');if(!b)return;const pr=+b.dataset.pr;if(S.gold<pr){blip([200]);toast('Not enough gold. Keep walking!');return}
  S.gold-=pr;give(b.dataset.buy);blip([990,1320]);save();hud();draw();wire()};draw();wire()}
async function openLore(p,here){const nm=esc(p.name||'Old Stone');
 if(!here&&!S.lore[p.id]){return dlg({title:'LORE STONE',html:`<p><b>${nm}</b></p><p>The words are too faint to read from here. Walk to the stone to learn its story.</p><p><small>${mi(p.wd)} from your flag along the paths.</small></p>`,buttons:[{t:'GO HERE',fn:()=>setTarget(p)},{t:'CLOSE'}]})}

  let txt='';try{txt=await loreText(p)}catch(e){}
  if(!txt)txt=[p.tags.historic&&('A '+p.tags.historic.replace(/_/g,' ')+'.'),p.tags.tourism&&('A local '+p.tags.tourism+'.'),p.tags.inscription&&('It reads: "'+p.tags.inscription+'"'),p.tags.description,p.tags.start_date&&('Dated '+p.tags.start_date+'.')].filter(Boolean).join(' ')||'Its story is not written down anywhere yet. What do you think it was for? Snap a photo and write your own entry.';
  S.lore[p.id]={name:p.name,text:txt,dk:dateKey(),wiki:p.pageid||null};save(true)}
 const L=S.lore[p.id];dlg({title:'LORE STONE',html:`<p><b>${nm}</b></p><p>${esc(L.text)}</p>`+(L.wiki?`<p><small>From Wikipedia. <a style="color:#8fd3f0" href="https://en.wikipedia.org/?curid=${L.wiki}" target="_blank" rel="noopener">Read more</a></small></p>`:'')+'<p><small>Saved to your journal.</small></p>'})}

 buttons:[{t:simOn?'SIM WALK: ON':'SIM WALK: OFF',fn:()=>{if(S.demo){toast('Demo mode always uses sim walk.');return}setSim(!simOn)}},{t:'REDOWNLOAD MAP',fn:()=>confirmBox('Download the map again? Your fog and progress stay.',async()=>{await idb.del('world');world=null;downloadWorld()})},
  {t:'START OVER',fn:()=>confirmBox('Pull up your flag and start over? Fog, gold and items are erased. Field notes stay.',async()=>{await idb.del('world');localStorage.removeItem(LS);location.reload()})},{t:'CLOSE'}]})}
function confirmBox(msg,yes){dlg({title:'ARE YOU SURE?',html:`<p>${esc(msg)}</p>`,buttons:[{t:'NO'},{t:'YES',cls:'gold',fn:yes}]})}

/* ---------------- input ---------------- */
const pts=new Map();let gest=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});audioOn();wake();
 if(pts.size===1)gest={sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y,t:Date.now(),moved:false};
 else if(pts.size===2){const[a,b]=[...pts.values()];gest={pinch:Math.hypot(a.x-b.x,a.y-b.y),m:view.m,moved:true}}});
cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId)||!gest)return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(gest.pinch&&pts.size>=2){const[a,b]=[...pts.values()];view.m=clamp(gest.m*gest.pinch/Math.max(10,Math.hypot(a.x-b.x,a.y-b.y)),.35,9);dirty=true;return}
 const dx=e.clientX-gest.sx,dy=e.clientY-gest.sy;if(!gest.moved&&Math.hypot(dx,dy)>7){gest.moved=true;follow=false;hud()}
 if(gest.moved){view.x=gest.vx-dx/PX*view.m;view.y=gest.vy+dy/PX*view.m;dirty=true}});
const up=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);
 if(gest&&!gest.moved&&!gest.pinch&&Date.now()-gest.t<450)tapAt(e.clientX/PX,e.clientY/PX);
 if(pts.size===1){const[a]=[...pts.values()];gest={sx:a.x,sy:a.y,vx:view.x,vy:view.y,t:0,moved:true}}else if(!pts.size)gest=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();view.m=clamp(view.m*Math.exp(e.deltaY*.002),.35,9);dirty=true},{passive:false});
$('#zin').onclick=()=>{view.m=clamp(view.m/1.5,.35,9);dirty=true};$('#zout').onclick=()=>{view.m=clamp(view.m*1.5,.35,9);dirty=true};
$('#me').onclick=()=>{follow=true;dirty=true;hud()};
$('#chip').onclick=()=>{if(target)confirmBox('Stop following this quest?',()=>setTarget(null))};
$('#bQuest').onclick=questList;$('#bBag').onclick=bag;$('#bNotes').onclick=()=>{refreshNotes().then(journal)};$('#gear').onclick=menu;
document.addEventListener('gesturestart',e=>e.preventDefault());
// sim walk d-pad (desk testing, demo mode)
let simOn=false,simMove=null,simT=0,turbo=1;
function setSim(on){simOn=on;$('#pad').classList.toggle('hide',!on);if(S)S.sim=on;hud();save()}
document.querySelectorAll('#pad [data-d]').forEach(b=>{const go=e=>{e.preventDefault();audioOn();simMove=b.dataset.d.split(',').map(Number);clearInterval(simT);
 const tick=()=>{if(!simMove||!S.pos)return;const sp=0.6*turbo;onMove(S.pos.x+simMove[0]*sp,S.pos.y+simMove[1]*sp,true)};tick();simT=setInterval(tick,100)};
 const stop=()=>{simMove=null;clearInterval(simT);dirty=true};b.addEventListener('pointerdown',go);b.addEventListener('pointerup',stop);b.addEventListener('pointerleave',stop);b.addEventListener('pointercancel',stop)});
$('#turbo').onclick=()=>{turbo=turbo===1?5:turbo===5?20:1;$('#turbo').textContent='x'+turbo};

/* ---------------- sound + wake lock ---------------- */
let AC=null;function audioOn(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function blip(fs,dur=.07){if(!AC)return;let t=AC.currentTime;for(const f of fs){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);t+=dur}}
const fanfare=()=>blip([523,523,523,698,880,784,880,1046],.11);
let wl=null;async function wake(){try{if('wakeLock'in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wl=null;wake()}});

/* ---------------- the dream ---------------- */
const DREAM=['...You are dreaming.','A map unrolls in the dark. It is blank, except for one word: HOME.','A voice drifts up from the paper:',
 '"Every street you walk, I will remember. Every secret you find, I will keep."','"But first, explorer, choose where your story begins."','"Wake up... and plant your flag."'];
function intro(){const I=$('#intro');I.classList.remove('hide');for(let i=0;i<90;i++){const s=document.createElement('div');s.className='st';s.style.left=Math.random()*100+'%';s.style.top=Math.random()*70+'%';s.style.animationDelay=Math.random()*3+'s';I.appendChild(s)}
 let li=0,ci=0,typing=null;const tx=$('#dreamTxt');
 const type=()=>{const L=DREAM[li];ci=0;tx.textContent='';clearInterval(typing);typing=setInterval(()=>{ci++;tx.textContent=L.slice(0,ci);if(ci%2)blip([300+ci%5*40],.02);if(ci>=L.length){clearInterval(typing);typing=null}},34);
  if(li===1)$('#paper').style.opacity=1};
 const next=()=>{audioOn();if(typing){clearInterval(typing);typing=null;tx.textContent=DREAM[li];return}li++;if(li>=DREAM.length)return wakeUp();type()};
 I.onpointerdown=e=>{if(e.target.id==='skip')return;next()};$('#skip').onclick=()=>wakeUp();setTimeout(type,700);
 function wakeUp(){I.onpointerdown=null;const f=$('#flash');f.style.opacity=1;blip([392,523,659,784],.12);setTimeout(()=>{I.classList.add('hide');f.style.opacity=0;plantDialog()},700)}}
function plantDialog(){dlg({title:'YOU WAKE UP',html:`<p>You wake in a town you don't know yet.</p><p>Plant your flag where you stand. This spot becomes <b style="color:#f2c94c">HOME BASE</b>, the 0,0 that every shop, dungeon and treasure is measured from, along real sidewalks.</p><p><small>Stand at home for the best start. Your flag stays on this phone.</small></p>`,
 buttons:[{t:'DEMO: FAIR LAWN',fn:()=>plant(DEMO.lat,DEMO.lon,true)},{t:'PLANT FLAG HERE',cls:'gold',keep:true,fn:gpsPlant}]})}
function gpsPlant(){if(!navigator.geolocation){toast('No GPS on this device. Try the demo.');return}
 dlg({title:'READING THE STARS',html:'<p>Finding where you stand...</p><p id="acc"><small>Allow location when asked.</small></p>',buttons:[{t:'CANCEL',fn:()=>{navigator.geolocation.clearWatch(wid);clearTimeout(tm);plantDialog()}}]});
 let best=null,tm=0;const done=()=>{navigator.geolocation.clearWatch(wid);clearTimeout(tm);if(!best){dlg({title:'NO SIGNAL',html:'<p>Could not get your location. Check that Location is on for Safari, then try again.</p>',buttons:[{t:'BACK',fn:plantDialog}]});return}
  plant(best.latitude,best.longitude,false,Math.round(best.accuracy))};
 const wid=navigator.geolocation.watchPosition(p=>{if(!best||p.coords.accuracy<best.accuracy)best=p.coords;const a=$('#acc');if(a)a.innerHTML='<small>Accuracy &plusmn;'+Math.round(best.accuracy)+' m</small>';if(best.accuracy<=15)done()},
  e=>{if(e.code===1){navigator.geolocation.clearWatch(wid);clearTimeout(tm);dlg({title:'LOCATION OFF',html:'<p>The game needs your location to draw your map. Turn it on in Settings &gt; Privacy &gt; Location Services &gt; Safari Websites, or try the demo.</p>',buttons:[{t:'BACK',fn:plantDialog}]})}},
  {enableHighAccuracy:true,maximumAge:0,timeout:20000});tm=setTimeout(done,12000)}
function plant(lat,lon,demo,acc){S={v:1,flag:{lat,lon},demo,created:Date.now(),gold:10,xp:0,inv:{potion:2},visited:{},once:{},opened:{},lore:{},day:{dk:dateKey(),m:0},total:0,acc:{g:0,c:0,mer:0},revealed:[],pos:{x:0,y:0},sim:demo,merchant:null};
 revealed=new Set();save(true);blip([523,784]);
 dlg({title:'FLAG PLANTED!',html:`<p>${demo?'A flag for Fair Lawn, New Jersey. Use the arrow pad to walk.':'Your flag stands'+(acc?' (&plusmn;'+acc+' m)':'')+'.'}</p><p>Now the map can be drawn around it.</p>`,buttons:[{t:'DRAW THE MAP',cls:'gold',fn:downloadWorld}]})}

/* ---------------- start ---------------- */
let gpsWatch=null,started=false;
function startGame(fresh){setOrigin(S.flag.lat,S.flag.lon);grid=buildGrid();flagNode=nearest(0,0,800);Dflag=dijkstra(flagNode,9000).d;
 places=placeWorld();today=makeDaily();revealed=new Set(S.revealed||[]);
 if(fresh){reveal(0,0);for(let a=0;a<360;a+=30)revealLine(0,0,Math.cos(a*Math.PI/180)*45,Math.sin(a*Math.PI/180)*45)}
 for(const id of['hud','side','bar','osm'])$('#'+id).classList.remove('hide');
 lastFix=null;onMove(S.pos.x,S.pos.y,true);
 setSim(!!(S.demo||S.sim));
 if(!started&&!S.demo&&navigator.geolocation)gpsWatch=navigator.geolocation.watchPosition(onPos,e=>{gpsAcc=null;if(e.code===1)toast('Location is off. Turn it on, or use SIM WALK in the menu.');hud()},{enableHighAccuracy:true,maximumAge:2000,timeout:30000});
 refreshNotes();resize();hud();
 if(fresh){const sh=places.filter(p=>p.role==='shop').sort((a,b)=>a.wd-b.wd)[0];
  dlg({title:'DAY 1',html:`<p>The fog lifts a little around your flag.</p><p>Every street you walk clears the fog for good. Shops, inns, dungeons and lore stones were placed from your town's real map.</p>`+
   (sh?`<p>The nearest <b>Item Shop</b> is ${mi(sh.wd)} away${sh.name?' ('+esc(sh.name)+')':''}.</p>`:'')+
   (today.prize?`<p>Today's <b style="color:#f2c94c">Grand Chest</b> waits 2.5 miles away ${esc(today.prize.where)}. Out and back is a 10,000-step day.</p>`:'')+'<p><small>Tap QUESTS to pick a destination.</small></p>',buttons:[{t:"LET'S GO",cls:'gold'}]})}
 if(!started)setInterval(()=>{if(world&&today&&today.dk!==dateKey()){today=makeDaily();toast('A new day dawns. New chests appeared!');hud();dirty=true}
  if(S.merchant&&S.merchant.until<Date.now()){S.merchant=null;dirty=true}},20000);started=true}
async function boot(){resize();requestAnimationFrame(loop);S=loadState();
 if(!S)return intro();
 setOrigin(S.flag.lat,S.flag.lon);
 try{world=await idb.get('world')}catch(e){world=null}
 if(!world)return downloadWorld();
 startGame(false)}
boot();
</script>
