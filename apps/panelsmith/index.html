<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Panelsmith — Comic Page Maker</title>
<meta name="description" content="Make comic pages on your phone from your own photos: panels, word bubbles, sound effects, print-ready export.">
<meta name="theme-color" content="#1d1d22">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Bowlby+One+SC&family=Bungee&family=Caveat+Brush&family=Comic+Neue:wght@400;700&family=Creepster&family=Dela+Gothic+One&family=Gochi+Hand&family=Kalam:wght@400;700&family=Luckiest+Guy&family=Mochiy+Pop+One&family=Patrick+Hand&family=Permanent+Marker&family=Rampart+One&family=Shojumaru&family=Special+Elite&family=Yusei+Magic&display=swap" rel="stylesheet">
<style>
:root{--bg:#121215;--panel:#1d1d22;--panel2:#26262d;--line:#34343d;--txt:#ececf1;--mut:#9898a6;--acc:#ffd43b;--acc2:#ff5a36;--sel:#3fa9ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:4px;padding:6px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-family:Bangers,Impact,sans-serif;font-size:22px;color:var(--acc);letter-spacing:1px;padding:0 4px;text-shadow:2px 2px 0 #000}
#title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:13px;padding:6px 4px;text-align:left}
.ib{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-size:18px}
.ib:active{background:var(--panel2)}
.ib:disabled{opacity:.3}
#modebar{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--acc);color:#111}
#hint{flex:1;font-size:12px;color:var(--mut);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage{flex:1;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tools,#r3Tools{display:flex;gap:2px;overflow-x:auto;padding:6px 4px calc(6px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);scrollbar-width:none}
#tools::-webkit-scrollbar,#r3Tools::-webkit-scrollbar{display:none}
.tb{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 6px;border-radius:10px}
.tb i{font-style:normal;font-size:19px;line-height:22px}
.tb span{font-size:10.5px;color:var(--mut);white-space:nowrap}
.tb:active,.tb.on{background:var(--panel2)}
.tb.on span{color:var(--acc)}
.tb:disabled{opacity:.3}
.tb.warn span{color:#ff7a7a}
/* sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:58vh;background:var(--panel);border-radius:16px 16px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .22s ease;z-index:20;display:flex;flex-direction:column}
#sheet.open{transform:none}
#sheet.full{max-height:none;height:94vh}
.sh-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px;border-bottom:1px solid var(--line)}
.sh-head b{flex:1;font-size:15px}
#shBody{overflow-y:auto;padding:8px 14px 24px;-webkit-overflow-scrolling:touch;-webkit-user-select:none}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;min-height:36px}
.row>label{flex:0 0 96px;color:var(--mut);font-size:12.5px}
.row input[type=range]{flex:1;accent-color:var(--acc)}
.row .val{flex:0 0 40px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut)}
.row select,.row input[type=text],.row input[type=number],textarea{flex:1;min-width:0;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:16px}
textarea{width:100%;min-height:64px;resize:vertical;-webkit-user-select:text;user-select:text}
input[type=text],input[type=number]{-webkit-user-select:text;user-select:text}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:2px}
.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px 0}
.colors .c{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut)}
.sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:12px 0 4px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:var(--panel2);font-size:12.5px;border:1px solid transparent}
.chip.on{border-color:var(--acc);color:var(--acc)}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;padding:4px 0}
.thumb{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border-radius:10px;background:var(--panel2);border:1px solid transparent;font-size:11px;color:var(--mut)}
.thumb.on{border-color:var(--acc);color:var(--acc)}
.thumb canvas{background:#f4f1ea;border-radius:6px}
.tog{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:0 0 auto}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--acc)}.tog.on::after{left:21px}
.btns{display:flex;flex-wrap:wrap;gap:8px;padding:8px 0}
.btn{padding:10px 14px;border-radius:10px;background:var(--panel2);font-weight:600;font-size:13px}
.btn.pri{background:var(--acc);color:#111}
.btn.dng{color:#ff7a7a}
.btn:active{filter:brightness(1.2)}
.note{font-size:12px;color:var(--mut);line-height:1.45;padding:4px 0}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.tpl button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:12px;background:var(--panel2);border:1.5px solid transparent;text-align:center}
.tpl button.on{border-color:var(--acc)}
.tpl .pg{background:#fff;border:2px solid #000;outline:3px solid rgba(255,90,54,.35)}
.tpl b{font-size:12px}.tpl small{font-size:10.5px;color:var(--mut)}
.lay{display:flex;align-items:center;gap:6px;padding:6px;border-radius:10px;background:var(--panel2);margin:4px 0}
.lay.on{outline:1.5px solid var(--acc)}
.lay .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.lay .sm{padding:6px 8px;border-radius:8px;background:var(--bg);font-size:12px}
.lay .sm.on{color:var(--acc)}
.lib{display:flex;gap:10px;align-items:center;padding:8px;border-radius:10px;background:var(--panel2);margin:6px 0}
.lib img{width:54px;height:72px;object-fit:contain;background:#fff;border-radius:4px}
.lib .meta{flex:1;min-width:0}.lib .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lib .meta small{color:var(--mut)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#000c;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:40;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.open{display:flex}
#modal .box{background:var(--panel);border-radius:14px;padding:16px;width:100%;max-width:360px}
#modal .box p{margin:0 0 12px;line-height:1.45}
#modal input{width:100%;margin-bottom:12px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:16px}
#preview{position:fixed;inset:0;background:#000e;z-index:45;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
#preview.open{display:flex}
#preview img{max-width:100%;max-height:72vh;background:#fff;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#preview p{color:#ddd;font-size:13px;text-align:center;margin:0}
#busy{position:fixed;inset:0;background:#0008;z-index:60;display:none;align-items:center;justify-content:center;font-family:Bangers,sans-serif;font-size:28px;color:var(--acc);letter-spacing:2px}
#busy.open{display:flex}
#r3d{position:fixed;inset:0;z-index:15;background:#141417;display:none;flex-direction:column}
#r3d.open{display:flex}
#r3d .ttl{flex:1;font-weight:700;font-size:15px;white-space:nowrap}
#r3Stage{flex:1;position:relative;overflow:hidden}
#gl,#r3Ov{position:absolute;inset:0;width:100%;height:100%;display:block}
#r3Ov{touch-action:none}
#r3Hint{position:absolute;left:10px;right:80px;top:7px;font-size:12px;color:var(--mut);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#r3Check{position:absolute;right:14px;top:56px;width:56px;height:56px;border-radius:50%;background:var(--acc);color:#111;font-size:28px;font-weight:800;display:none;place-items:center;box-shadow:0 6px 20px #0009;z-index:2}
#r3Check.on{display:grid}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="bMenu" title="Menu">☰</button>
    <span class="logo">Panelsmith</span>
    <button id="title" title="Rename">Untitled page</button>
    <button class="ib" id="bUndo" title="Undo">↶</button>
    <button class="ib" id="bRedo" title="Redo">↷</button>
    <button class="ib" id="bGuides" title="Show/hide guides">◫</button>
    <button class="ib" id="bFit" title="Fit page">⤢</button>
  </header>
  <div id="modebar">
    <div class="seg"><button id="mFrames" class="on">Frames</button><button id="mContent">Content</button></div>
    <div id="hint"></div>
  </div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <nav id="tools"></nav>
</div>
<div id="r3d">
  <header><button class="ib" id="r3Back" title="Back to page">‹</button><span class="ttl">3D Reference</span><button class="ib" id="r3Undo" title="Undo">↶</button><button class="ib" id="r3Redo" title="Redo">↷</button><button class="btn pri" id="r3Place">Place ▸</button></header>
  <div id="r3Stage"><canvas id="gl"></canvas><canvas id="r3Ov"></canvas><div id="r3Hint"></div><button id="r3Check" title="Done reshaping">✓</button></div>
  <nav id="r3Tools"></nav>
</div>
<div id="sheet"><div class="sh-head"><b id="shTitle"></b><button class="ib" id="shClose">✕</button></div><div id="shBody"></div></div>
<div id="toast"></div>
<div id="modal"><div class="box"><p id="mMsg"></p><input id="mIn" type="text"><div class="btns" style="justify-content:flex-end"><button class="btn" id="mNo">Cancel</button><button class="btn pri" id="mYes">OK</button></div></div></div>
<div id="preview"><p id="pvMsg">Long-press the image to save it.</p><img id="pvImg" alt="Exported page"><button class="btn pri" id="pvClose">Done</button></div>
<div id="busy">Inking…</div>
<input type="file" id="fImg" accept="image/*" multiple hidden>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fProj" accept=".json,application/json" hidden>
<script>

/* ============ utils ============ */

  async tx(mode,fn){const db=await this.open();if(!db)throw new Error('no storage');return new Promise((res,rej)=>{const t=db.transaction('projects',mode),st=t.objectStore('projects');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})},
  put(o){return this.tx('readwrite',s=>s.put(o))},get(id){return this.tx('readonly',s=>s.get(id))},all(){return this.tx('readonly',s=>s.getAll())},del(id){return this.tx('readwrite',s=>s.delete(id))}};

async function saveFile(name,blob,isImg){

  if(!DL&&blob.size<60e6){try{const f=new File([blob],name,{type:blob.type||'application/octet-stream'});if(navigator.canShare&&navigator.canShare({files:[f]})&&/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError'){toast('Save cancelled');return}}}
  if(!DL&&!window.__inFrame){try{const u=URL.createObjectURL(blob),a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);toast('Saved '+name);return}catch(_){}}
  if(isImg){const u=URL.createObjectURL(blob);$('#pvImg').src=u;$('#pvMsg').textContent='Long-press (or right-click) the image to save it to your device.';$('#preview').classList.add('open');return}
  try{const u=URL.createObjectURL(blob),a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Download started (if your browser allows it)')}catch(_){toast('Downloads are blocked in this view')}}

  if(!doc.scene3d)doc.scene3d=default3D();const c=sc3().cam;if(c.frame!=='page'&&!doc.panels.some(p=>p.id===c.frame))c.frame=(selPanel()||doc.panels[0]||{}).id||null;
  closeSheet();S3.open=true;S3.mode='pose';S3.hist=[JSON.stringify(sc3())];S3.hi=0;$('#r3d').classList.add('open');refresh3();req3()}
function close3(){if(S3.mode==='mod')exitMod();closeSheet();S3.open=false;$('#r3d').classList.remove('open');commit();refreshUI();req()}
function refresh3(){const T=$('#r3Tools');T.innerHTML='';const o=selObj3(),add=(...b)=>b.forEach(x=>T.append(x));
  if(S3.mode==='mod'){$('#r3Hint').textContent=S3.part?pretty3(S3.part)+' — use the sliders':'Tap a part of the figure to reshape it';$('#r3Check').classList.add('on');
    add(tb('◧','Reshape',modSheet),tb('↺','Reset shape',()=>{if(!o)return;o.parts={};o.prop={...((CHARS3[o.kind]||{}).prop||{})};if(o.dim)o.dim=[...(PRIMS3[o.kind]||PRIMS3.box).dim];push3();req3();modSheet()}),tb('✓','Done',exitMod,{on:1}))}
  else{$('#r3Check').classList.remove('on');const R=o&&RIG[o.type];
    $('#r3Hint').textContent=!o?'Drag to orbit · two fingers to zoom & pan · tap a figure':R&&S3.bone&&S3.bone!==R.root?'Drag the limb to pose it · '+pretty3(S3.bone):'Drag to move it around the floor';
    add(tb('＋','Add',addSheet3),tb('⚒','Mod',enterMod,{dis:!o}),tb('🕺','Pose',poseSheet,{dis:!o}),tb('◎','Lens',lensSheet),tb('🎥','Camera',camSheet),tb('☀','Look',lookSheet),
      tb('⧉','Duplicate',dup3,{dis:!o}),tb('🗑','Delete',del3,{dis:!o,warn:1}))}
  $('#r3Undo').disabled=S3.hi<=0;$('#r3Redo').disabled=S3.hi>=S3.hist.length-1}
function add3(kind){const o=newObj3(kind),c=sc3().cam,n=sc3().objs.length,a=n*1.3;o.pos=[c.tgt[0]+(n?Math.cos(a)*.8:0),0,c.tgt[2]+(n?Math.sin(a)*.5:0)];o.rot=[0,Math.round(c.yaw/D2R/15)*15,0];
  sc3().objs.push(o);S3.sel=o.id;S3.bone=null;closeSheet();push3();req3()}
function dup3(){const o=selObj3();if(!o)return;const q=JSON.parse(JSON.stringify(o));q.id=uid();q.pos[0]+=.7;q.name=o.name;sc3().objs.push(q);S3.sel=q.id;push3();req3()}
function del3(){const o=selObj3();if(!o)return;sc3().objs.splice(sc3().objs.indexOf(o),1);S3.sel=null;S3.bone=null;closeSheet();push3();req3()}
function enterMod(){const o=selObj3();if(!o)return;S3.prevCam=JSON.parse(JSON.stringify(sc3().cam));S3.mode='mod';S3.part=S3.bone&&S3.bone!==(RIG[o.type]||{}).root?S3.bone:null;
  const ev=evalObj(o),c=sc3().cam;c.tgt=[...ev.center];c.dist=Math.max(.6,ev.rad*2.6);refresh3();modSheet();req3()}
function exitMod(){if(S3.prevCam)doc.scene3d.cam=S3.prevCam;S3.prevCam=null;S3.mode='pose';S3.part=null;closeSheet();push3();refresh3();req3()}

/* ---------- sheets ---------- */
function sheet3(key,title,build){openSheet("3d"+key,title,build);S3.sheet3=key;setTimeout(req3,260)}
function closeSheet3(){S3.sheet3=null}
function r3Range(label,obj,key,min,max,step,fmt){const f=fmt||(v=>(+v).toFixed(step<1?(step<.1?2:1):0));const val=h('span',{class:'val'},f(obj[key]));const inp=h('input',{type:'range',min,max,step,value:obj[key]});
  inp.oninput=()=>{obj[key]=+inp.value;val.textContent=f(obj[key]);req3()};inp.onchange=()=>push3();return row(label,inp,val)}
function r3Toggle(label,obj,key){const t=h('button',{class:'tog'+(obj[key]!==false&&obj[key]?' on':'')});t.onclick=()=>{obj[key]=!obj[key];t.classList.toggle('on',!!obj[key]);push3();req3()};return row(label,h('div',{style:{flex:1}}),t)}
function r3Color(label,obj,key){const i=h('input',{type:'color',value:obj[key]});i.oninput=()=>{obj[key]=i.value;req3()};i.onchange=()=>push3();return h('div',{class:'c'},i,label)}
const bt=(label,fn,cls)=>h('button',{class:'btn'+(cls?' '+cls:''),onclick:fn},label);
const arrProxy=(get)=>{const p={};['x','y','z'].forEach((k,i)=>Object.defineProperty(p,k,{get:()=>get()[i],set:v=>{get()[i]=v}}));return p};
function addSheet3(){sheet3('add','Add to scene',B=>{const grp=(t,items,src)=>{B.append(sec(t));const g=h('div',{class:'thumbs'});items.forEach(([k,ic])=>g.append(h('button',{class:'thumb',onclick:()=>add3(k)},h('span',{style:{fontSize:'26px',lineHeight:'34px'}},ic),src[k].n)));B.append(g)};
  grp('People',[['adult','🧍'],['hero','🦸'],['slim','🚶'],['child','🧒']],CHARS3);grp('Creatures',[['dog','🐕'],['cat','🐈'],['horse','🐎']],CHARS3);
  grp('Shapes',[['box','⬛'],['sphere','⚪'],['cylinder','🥫'],['cone','🔺'],['pyramid','△'],['torus','⭕'],['ramp','◺'],['wall','▬'],['floor','▭'],['pillar','┃']],PRIMS3)})}
function poseSheet(){const o=selObj3();if(!o)return;const R=RIG[o.type];sheet3('pose',o.name,B=>{
  if(R){B.append(sec('Pose presets'),chips(Object.entries(POSES3[o.type]).map(([k,v])=>[k,v.n]),null,k=>{o.pose=JSON.parse(JSON.stringify(POSES3[o.type][k].p));push3();req3()}),
      h('div',{class:'btns'},bt('⇋ Mirror pose',()=>{const np={};for(const k in o.pose){const t=k.endsWith('.L')?k.slice(0,-2)+'.R':k.endsWith('.R')?k.slice(0,-2)+'.L':k;const e=o.pose[k];np[t]=[e[0],-e[1],-e[2]]}o.pose=np;push3();req3();poseSheet()}),bt('Reset pose',()=>{o.pose={};push3();req3();poseSheet()})));
    const b=S3.bone&&R.map[S3.bone];
    if(b&&b.p){const P=()=>o.pose[b.n]||(o.pose[b.n]=[0,0,0]),px=arrProxy(P),fd=v=>Math.round(v)+'°';
      B.append(sec('Joint · '+pretty3(b.n)),r3Range('Bend',px,'x',-180,180,1,fd),r3Range('Twist',px,'y',-180,180,1,fd),r3Range('Side',px,'z',-180,180,1,fd),h('div',{class:'btns'},bt('Reset joint',()=>{delete o.pose[b.n];push3();req3();poseSheet()})))}
    else B.append(h('div',{class:'note'},'Tap a limb to select its joint, then drag it to pose — like a wooden drawing mannequin. Fine-tune with the sliders here.'))}
  const rp=arrProxy(()=>o.rot),fd=v=>Math.round(v)+'°';
  B.append(sec('Placement'),r3Range('Turn',rp,'y',-180,180,1,fd),r3Range('Lean',rp,'x',-180,180,1,fd),r3Range('Tilt',rp,'z',-180,180,1,fd),r3Range(o.ground!==false?'Lift':'Height',o.pos,1,o.ground!==false?0:-2,4,.01),
    r3Toggle('Stand on the floor',o,'ground'),r3Range('Scale',o,'scale',.1,5,.01,v=>Math.round(v*100)+'%'),h('div',{class:'colors'},r3Color('Colour',o,'color')))})}
function modSheet(){const o=selObj3();if(!o)return;const R=RIG[o.type];sheet3('mod','Reshape · '+o.name,B=>{
  if(R){const n=S3.part;
    if(n&&R.map[n]){const pp=k=>o.parts[k]||(o.parts[k]={l:1,w:1,d:1}),twin=n.endsWith('.L')?n.slice(0,-2)+'.R':n.endsWith('.R')?n.slice(0,-2)+'.L':null,px={};
      ['l','w','d'].forEach(k=>Object.defineProperty(px,k,{get:()=>pp(n)[k]??1,set:v=>{pp(n)[k]=v;if(twin&&S3.mirror)pp(twin)[k]=v}}));
      Object.defineProperty(px,'s',{get:()=>((pp(n).l??1)+(pp(n).w??1)+(pp(n).d??1))/3,set:v=>{['l','w','d'].forEach(k=>px[k]=v)}});const pc=v=>Math.round(v*100)+'%';
      B.append(sec('Part · '+pretty3(n)),r3Range('Longer / shorter',px,'l',.3,2.5,.01,pc),r3Range('Wider / thinner',px,'w',.3,2.5,.01,pc),r3Range('Deeper / flatter',px,'d',.3,2.5,.01,pc),r3Range('Bigger / smaller',px,'s',.3,2.5,.01,pc),
        twin?r3Toggle('Mirror to other side',S3,'mirror'):'',h('div',{class:'btns'},bt('Reset part',()=>{delete o.parts[n];if(twin&&S3.mirror)delete o.parts[twin];push3();req3();modSheet()})))}
    else B.append(h('div',{class:'note'},'Tap any body part to reshape just that part — make it bigger, smaller, wider or thinner. Hit ✓ when you’re done.'));
    B.append(sec('Whole body'),...PROPS3[o.type].map(([k,l])=>{if(o.prop[k]==null)o.prop[k]=1;return r3Range(l,o.prop,k,.4,2.2,.01,v=>Math.round(v*100)+'%')}),r3Range('Overall size',o,'scale',.1,5,.01,v=>Math.round(v*100)+'%'))}
  else{const dp=arrProxy(()=>o.dim),m=v=>v.toFixed(2)+' m';B.append(sec('Dimensions'),r3Range('Width',dp,'x',.05,8,.01,m),r3Range('Height',dp,'y',.05,8,.01,m),r3Range('Depth',dp,'z',.05,8,.01,m))}
  B.append(h('div',{class:'colors'},r3Color('Colour',o,'color')),h('div',{class:'btns'},bt('✓ Done',exitMod,'pri')))})}
function lensSheet(){const c=sc3().cam;sheet3('lens','Lens',B=>{B.append(chips([['std','Standard'],['fish','Fisheye'],['tilt','Tilt-shift']],c.lens,v=>{c.lens=v;push3();req3();lensSheet()}));
  if(c.lens!=='fish')B.append(sec('Focal length'),chips([[14,'14 ultra-wide'],[24,'24 wide'],[35,'35'],[50,'50 normal'],[85,'85 portrait'],[135,'135 tele'],[200,'200 super-tele']],c.focal,v=>{c.focal=v;push3();req3();lensSheet()}),r3Range('Focal',c,'focal',10,300,1,v=>v+'mm'));
  if(c.lens==='fish')B.append(sec('Fisheye'),r3Range('Distortion',c,'fish',0,1,.01,v=>Math.round(v*100)+'%'),h('div',{class:'note'},'Wide barrel distortion — great for dramatic close-ups and cramped rooms.'));
  if(c.lens==='tilt')B.append(sec('Tilt-shift (miniature look)'),r3Range('Focus height',c,'tsY',0,1,.01,v=>Math.round(v*100)+'%'),r3Range('Sharp band',c,'tsW',.02,.45,.01),r3Range('Blur',c,'tsBlur',1,16,.5),h('div',{class:'note'},'Works best looking down from a high angle.'));
  B.append(sec('Angle'),r3Range('Dutch tilt',c,'roll',-45,45,1,v=>v+'°'))})}
function camSheet(){const c=sc3().cam;sheet3('cam','Camera',B=>{const o=selObj3();const focus=()=>{if(!o)return null;return evalObj(o)};
  const ang=(yaw,pitch)=>()=>{if(yaw!=null)c.yaw=yaw+(o?o.rot[1]*D2R:0);if(pitch!=null)c.pitch=pitch;push3();req3()};
  B.append(sec('View'),chips([['f','Front'],['tq','¾ view'],['s','Side'],['b','Back']],null,v=>({f:ang(0,null),tq:ang(.62,null),s:ang(Math.PI/2,null),b:ang(Math.PI,null)})[v]()),
    chips([['eye','Eye level'],['low','Low angle'],['high','High angle'],['bird',"Bird's eye"],['worm',"Worm's eye"]],null,v=>{const p={eye:.04,low:-.38,high:.55,bird:1.42,worm:-.78}[v];c.pitch=p;if(v==='worm'||v==='low')c.tgt[1]=Math.max(c.tgt[1],.9);push3();req3()}),
    sec('Shot'),chips([['cu','Close-up'],['ms','Medium'],['fs','Full'],['ws','Wide']],null,v=>{const e=focus();let t=e?[...e.center]:[...c.tgt];
      if(e&&e.o.type==='human'){const hd=e.joints.find(j=>j.n==='head'),ch=e.joints.find(j=>j.n==='chest');if(v==='cu'&&hd)t=v3.sc(v3.add(hd.j,hd.e),.5);if(v==='ms'&&ch)t=[...ch.e]}
      c.tgt=t;c.dist={cu:.9,ms:1.9,fs:3.4,ws:7}[v]*(e?e.o.scale:1)*(c.lens==='std'||c.lens==='tilt'?c.focal/35:1);push3();req3()}),
    r3Range('Distance',c,'dist',.25,40,.05,v=>v.toFixed(1)+' m'),r3Range('Aim height',c.tgt,1,-1,6,.01,v=>v.toFixed(2)+' m'),
    h('div',{class:'btns'},bt('Center on selected',()=>{const e=focus();if(e){c.tgt=[...e.center];push3();req3()}else toast('Select something first')})),
    sec('Frame for'),chips(doc.panels.map((p,i)=>[p.id,`Panel ${i+1}`]).concat([['page','Whole page'],[null,'Screen']]),c.frame,v=>{c.frame=v;push3();req3();camSheet()}),
    h('div',{class:'note'},'The yellow frame matches the shape of the panel you’re composing for, so what you see is exactly what gets placed.'))})}
function lookSheet(){const L=sc3().look;sheet3('look','Look',B=>{B.append(sec('Render style'),chips([['toon','Toon'],['clay','Clay'],['ink','Ink lines']],L.style,v=>{L.style=v;push3();req3();lookSheet()}));
  if(L.style!=='clay')B.append(r3Range('Outline',L,'outline',.5,6,.25));
  B.append(sec('Light'),r3Range('Direction',L,'lightAz',0,360,1,v=>v+'°'),r3Range('Height',L,'lightEl',5,89,1,v=>v+'°'),
    sec('Stage'),h('div',{class:'colors'},r3Color('Background',L,'bg')),r3Toggle('Floor',L,'ground'),r3Toggle('Floor grid',L,'grid'),r3Toggle('Contact shadows',L,'shadow'),r3Toggle('Transparent background when placed',L,'transparent'))})}
function placeSheet(){if(S3.mode==='mod')exitMod();sheet3('place','Place this view in…',B=>{B.append(h('div',{class:'note'},'Pick a panel. The render matches the yellow frame; choosing a different-shaped panel reframes it around the same centre.'));
  const g=h('div',{class:'thumbs'});const thumb=hl=>{const t=trimRect(),s=56/Math.max(pageW(),pageH()),c=mkCanvas(Math.round(pageW()*s*2),Math.round(pageH()*s*2)),x=c.getContext('2d');x.scale(s*2,s*2);x.fillStyle='#fff';x.fillRect(0,0,pageW(),pageH());
    doc.panels.forEach(p=>{const pa=panelPath(p);x.fillStyle=p.id===hl?'#ffd43b':'#e8e4da';x.fill(pa);x.lineWidth=2/s;x.strokeStyle='#111';x.stroke(pa)});if(hl==='page'){x.strokeStyle='#ffd43b';x.lineWidth=6/s;x.strokeRect(t.x,t.y,t.w,t.h)}c.style.width=(c.width/2)+'px';c.style.height=(c.height/2)+'px';return c};
  doc.panels.forEach((p,i)=>g.append(h('button',{class:'thumb'+(p.id===sc3().cam.frame?' on':''),onclick:()=>doPlace(p.id)},thumb(p.id),`Panel ${i+1}`)));
  g.append(h('button',{class:'thumb'+(sc3().cam.frame==='page'?' on':''),onclick:()=>doPlace('page')},thumb('page'),'Whole page'));
  B.append(g,r3Toggle('Replace the earlier 3D render there',S3,'replace'),r3Toggle('Transparent background',sc3().look,'transparent'))})}
async function doPlace(pid){busy(true);await new Promise(r=>setTimeout(r,40));try{const p=pid==='page'?null:doc.panels.find(x=>x.id===pid),bb=p?bbox(p.pts):trimRect(),asp=bb.w/bb.h;
  const long=clamp(Math.round(Math.max(bb.w,bb.h)*doc.dpi/72),600,2400),w=asp>=1?long:Math.round(long*asp),hh=asp>=1?Math.round(long/asp):long;
  sc3().cam.frame=p?p.id:'page';render3();const cnv=render3Export(w,hh),src=cnv.toDataURL('image/png'),img=await loadImg(src),id=uid();S.images[id]={src,el:img};
  let a=p&&S3.replace?p.assets.find(x=>x.from3d):!p&&S3.replace?doc.free.find(x=>x.from3d):null;
  if(a){a.img=id;a.w=img.naturalWidth;a.h=img.naturalHeight;a.filter='none'}else{a={id:uid(),type:'image',img:id,x:0,y:0,rot:0,s:1,w:img.naturalWidth,h:img.naturalHeight,filter:'none',op:1,clip:true,from3d:true};(p?p.assets:doc.free).unshift(a)}
  fillFrame(a,'cover');S3.sheet3=null;close3();S.mode='content';S.sel={pid:p?p.id:null,aid:a.id,vi:-1};refreshUI();req();toast(p?`3D view placed in panel ${doc.panels.indexOf(p)+1}`:'3D view placed on the page')}
  catch(e){console.error(e);toast('Could not render: '+(e.message||e))}finally{busy(false)}}

bind3();
