<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Decornaut — decorate your room in MR</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink:#111; --mag:#ff2e88; --yel:#ffd23f; --org:#ff5a1f; --grn:#a6e22e; --lav:#b9a3ff; --bg:#2b2340; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); font-family:Nunito,system-ui,sans-serif; color:#fff; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .top { position:fixed; top:10px; left:10px; right:10px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; pointer-events:none; z-index:2; }
  .title { font-family:Bangers,Impact,sans-serif; font-size:30px; letter-spacing:1px; text-shadow:3px 3px 0 var(--ink); }
  .pill { pointer-events:auto; background:rgba(0,0,0,.6); border:2px solid var(--ink); border-radius:999px; padding:5px 11px; font-size:13px; font-weight:900; box-shadow:3px 3px 0 var(--ink); display:flex; gap:6px; align-items:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:#999; border:2px solid var(--ink); }
  .dot.ok { background:var(--grn); } .dot.warn { background:var(--yel); } .dot.bad { background:var(--org); }
  .spacer { flex:1; }
  .btn { pointer-events:auto; font:900 14px Nunito,sans-serif; color:var(--ink); background:#fff; border:3px solid var(--ink); border-radius:12px; padding:8px 12px; box-shadow:3px 3px 0 var(--ink); cursor:pointer; }
  .btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  .btn.big { font-family:Bangers,Impact,sans-serif; font-size:21px; letter-spacing:1px; padding:6px 14px; color:#fff; text-shadow:2px 2px 0 var(--ink); }
  .btn.mr { background:var(--mag); } .btn.vr { background:#38c6f4; }
  .btn[disabled] { opacity:.4; cursor:default; }
  .lib { position:fixed; left:10px; bottom:10px; width:min(380px,calc(100% - 20px)); max-height:min(56vh,520px); display:flex; flex-direction:column; background:rgba(20,14,34,.88); border:3px solid var(--ink); border-radius:16px; box-shadow:5px 5px 0 var(--ink); z-index:2; }
  .lib.min .libBody { display:none; }
  .libHead { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:2px solid #000; }
  .libHead h2 { font-family:Bangers,Impact,sans-serif; letter-spacing:1px; font-size:22px; margin:0; flex:1; text-shadow:2px 2px 0 var(--ink); }
  .libBody { overflow:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .drop { border:3px dashed #8c7ac0; border-radius:12px; padding:12px; text-align:center; font-weight:700; font-size:13px; color:#d9d0f5; }
  .drop.over { border-color:var(--yel); color:var(--yel); }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); gap:8px; }
  .tile { position:relative; background:#3d3258; border:3px solid var(--ink); border-radius:12px; overflow:hidden; cursor:pointer; box-shadow:2px 2px 0 var(--ink); }
  .tile.on { outline:3px solid var(--yel); outline-offset:1px; }
  .tile img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#241c36; }
  .tile .nm { font-size:11px; font-weight:900; padding:4px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile .kind { position:absolute; top:4px; left:4px; font-size:10px; font-weight:900; background:var(--yel); color:var(--ink); border:2px solid var(--ink); border-radius:6px; padding:0 4px; }
  .tile .x { position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; border:2px solid var(--ink); background:var(--org); color:#fff; font-weight:900; font-size:12px; line-height:16px; padding:0; cursor:pointer; }
  .counts { font-size:12px; font-weight:700; color:#cfc5ea; }
  .sel { position:fixed; right:10px; bottom:10px; display:none; flex-direction:column; gap:6px; align-items:stretch; background:rgba(20,14,34,.9); border:3px solid var(--ink); border-radius:16px; box-shadow:5px 5px 0 var(--ink); padding:10px; z-index:2; width:min(250px,calc(100% - 20px)); }
  .sel.show { display:flex; }
  .sel .row { display:flex; gap:6px; } .sel .row .btn { flex:1; padding:7px 4px; }
  .sel .nm { font-weight:900; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hint { position:fixed; left:50%; top:62px; transform:translateX(-50%); background:var(--yel); color:var(--ink); border:3px solid var(--ink); box-shadow:3px 3px 0 var(--ink); border-radius:12px; padding:7px 12px; font-weight:900; font-size:13px; max-width:92%; text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; z-index:4; }
  .hint.show { opacity:1; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; align-items:center; justify-content:center; z-index:5; }
  .modal.show { display:flex; }
  .card { background:#fff; color:var(--ink); border:4px solid var(--ink); border-radius:18px; box-shadow:6px 6px 0 var(--ink); padding:18px; width:min(360px,90%); text-align:center; }
  .card h3 { font-family:Bangers,Impact,sans-serif; letter-spacing:1px; margin:0 0 6px; font-size:28px; }
  .card p { margin:0 0 14px; font-size:14px; }
  .card .row { display:flex; gap:10px; justify-content:center; }
  #busy { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.45); z-index:6; font-family:Bangers,Impact,sans-serif; font-size:30px; letter-spacing:1px; text-shadow:3px 3px 0 var(--ink); }
  #busy.show { display:flex; }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<canvas id="c"></canvas>

<div class="top">
  <div class="title">DECORNAUT</div>
  <div class="pill"><span class="dot" id="dot"></span><span id="statusText">Checking headset…</span></div>
  <div class="spacer"></div>
  <button class="btn big mr" id="roomBtn" disabled>MY ROOM (MR)</button>
  <button class="btn big vr" id="islandBtn" disabled>ISLAND (VR)</button>
</div>

<div class="lib" id="lib">
  <div class="libHead">
    <h2>LIBRARY</h2>
    <button class="btn" id="importBtn">＋ Import</button>
    <button class="btn" id="libMin" title="Hide or show">▾</button>
  </div>
  <div class="libBody">
    <div class="drop" id="drop">Drop or import 3D models (GLB, glTF, OBJ+MTL, FBX, STL, PLY, DAE, 3MF, 3DS, USDZ, WRL, or a ZIP of a model and its textures) and pictures (PNG, JPG, WEBP, GIF). Pick pictures on their own: picked with a model they count as its textures.</div>
    <div class="tiles" id="tiles"></div>
    <div class="counts" id="counts"></div>
  </div>
  <input type="file" id="file" multiple hidden accept=".glb,.gltf,.bin,.obj,.mtl,.fbx,.stl,.ply,.dae,.3mf,.3ds,.usdz,.wrl,.zip,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif,.tga,image/*">
</div>

<div class="sel" id="sel">
  <div class="nm" id="selName">Item</div>
  <div class="row"><button class="btn" data-act="spinL">⟲ 15°</button><button class="btn" data-act="spinR">⟳ 15°</button></div>
  <div class="row"><button class="btn" data-act="smaller">− Size</button><button class="btn" data-act="bigger">＋ Size</button></div>
  <div class="row"><button class="btn" data-act="real">1:1 size</button><button class="btn" data-act="move">Move</button></div>
  <div class="row"><button class="btn" data-act="delete" style="background:var(--org);color:#fff">Delete</button><button class="btn" data-act="done">Done</button></div>
</div>

<div class="hint" id="hint"></div>
<div id="busy">LOADING…</div>

<div class="modal" id="confirm">
  <div class="card">
    <h3 id="cfTitle">SURE?</h3>
    <p id="cfText"></p>
    <div class="row"><button class="btn" id="cfNo">Keep it</button><button class="btn" id="cfYes" style="background:var(--org);color:#fff">Delete</button></div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';

// =====================================================================
// constants
// =====================================================================
const MODEL_EXT = ['glb','gltf','obj','fbx','stl','ply','dae','3mf','3ds','usdz','wrl'];
const IMAGE_EXT = ['png','jpg','jpeg','webp','gif','bmp','avif'];
const DEFAULT_MODEL_SIZE = 0.35;   // metres, longest side, when first placed
const DEFAULT_IMAGE_SIZE = 0.5;
const ROOM = 'room', ISLAND = 'island';
const ext = n => (n.split('?')[0].split('.').pop() || '').toLowerCase();
const base = n => decodeURIComponent(n.split('?')[0].split('#')[0]).split(/[\\/]/).pop().toLowerCase();
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const $ = id => document.getElementById(id);

// =====================================================================
// storage (IndexedDB on this device)
// =====================================================================
const Store = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('decornaut', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('assets', { keyPath:'id' });
        d.createObjectStore('items', { keyPath:'id' });
        d.createObjectStore('meta', { keyPath:'k' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('no db'));
      const t = this.db.transaction(store, mode), s = t.objectStore(store);
      let out; const q = fn(s); if (q) q.onsuccess = () => { out = q.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  put(store, v) { return this.tx(store, 'readwrite', s => s.put(v)); },
  del(store, k) { return this.tx(store, 'readwrite', s => s.delete(k)); },
  all(store) { return this.tx(store, 'readonly', s => s.getAll()); },
  async meta(k, v) {
    if (v === undefined) { const r = await this.tx('meta', 'readonly', s => s.get(k)); return r ? r.v : undefined; }
    return this.put('meta', { k, v });
  },
};

// =====================================================================
// renderer, scene, rig
// =====================================================================
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const rig = new THREE.Group(); scene.add(rig);            // moves you around the island
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.02, 500);
camera.position.set(0, 2.4, 6.5);
rig.add(camera);

scene.add(new THREE.HemisphereLight('#ffffff', '#6b5a8a', 1.2));
const sun = new THREE.DirectionalLight('#fff3dd', 2.0); sun.position.set(6, 10, 4); scene.add(sun);

// toon look for the island (itemnaut style: 3-band ramp + ink outlines)
const ramp = new THREE.DataTexture(new Uint8Array([95,95,95,255, 175,175,175,255, 255,255,255,255]), 3, 1);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const toon = c => new THREE.MeshToonMaterial({ color:c, gradientMap:ramp });
const INK = new THREE.MeshBasicMaterial({ color:'#111', side:THREE.BackSide });

// =====================================================================
// placeholder digital space: a floating island
// =====================================================================
const island = new THREE.Group(); scene.add(island);
const islandSurfaces = [];
function solid(geo, color, x, y, z, opts = {}) {
  const m = new THREE.Mesh(geo, toon(color));
  m.position.set(x, y, z);
  if (opts.rot) m.rotation.set(...opts.rot);
  const ink = new THREE.Mesh(geo, INK); ink.scale.setScalar(opts.ink ?? 1.03); m.add(ink);
  island.add(m);
  if (opts.surface !== false) islandSurfaces.push(m);
  return m;
}
(function buildIsland() {
  // ground + rock underside
  const top = solid(new THREE.CylinderGeometry(9, 8.6, 0.6, 40), '#8fd14f', 0, -0.3, 0, { ink:1.01 });
  solid(new THREE.ConeGeometry(8.6, 7, 12), '#7a5a48', 0, -4.1, 0, { rot:[Math.PI, 0, 0], surface:false, ink:1.02 });
  solid(new THREE.CylinderGeometry(9.05, 9.05, 0.18, 40), '#6f4f3d', 0, -0.62, 0, { surface:false, ink:1.01 });
  // a little open house frame: back wall, two side walls, floor and a shelf
  const hx = 0, hz = -3.5;
  solid(new THREE.BoxGeometry(5, 0.12, 3.4), '#e8d7b8', hx, 0.06, hz);
  solid(new THREE.BoxGeometry(5, 2.8, 0.16), '#f4efe6', hx, 1.4, hz - 1.62);
  solid(new THREE.BoxGeometry(0.16, 2.8, 3.4), '#b9a3ff', hx - 2.42, 1.4, hz);
  solid(new THREE.BoxGeometry(0.16, 2.8, 3.4), '#b9a3ff', hx + 2.42, 1.4, hz);
  const roof = solid(new THREE.BoxGeometry(5.4, 0.16, 3.9), '#ff2e88', hx, 2.88, hz, { surface:false });
  roof.rotation.x = 0.06;
  solid(new THREE.BoxGeometry(2.2, 0.05, 0.32), '#7a5a48', hx - 0.9, 1.25, hz - 1.38);   // shelf
  solid(new THREE.BoxGeometry(2.2, 0.05, 0.32), '#7a5a48', hx - 0.9, 1.75, hz - 1.38);   // shelf
  solid(new THREE.BoxGeometry(1.2, 0.06, 0.7), '#ffd23f', hx + 1.3, 0.78, hz - 0.6);     // table top
  for (const [dx, dz] of [[-0.52,-0.28],[0.52,-0.28],[-0.52,0.28],[0.52,0.28]])
    solid(new THREE.CylinderGeometry(0.035, 0.035, 0.72, 8), '#3a3a44', hx + 1.3 + dx, 0.38, hz - 0.6 + dz);
  // plinths
  for (const [x, z, h] of [[-3.2, 1.5, 0.9], [3.4, 0.8, 0.6], [2.2, 3.4, 1.1]])
    solid(new THREE.BoxGeometry(0.55, h, 0.55), '#f4efe6', x, h / 2, z);
  // trees and rocks
  for (const [x, z, s] of [[-5.5, -1, 1], [5.6, -2.5, 1.3], [-4.2, 4.6, 0.8], [6.2, 3.8, 0.9]]) {
    solid(new THREE.CylinderGeometry(0.12 * s, 0.16 * s, 1.2 * s, 8), '#7a5a48', x, 0.6 * s, z, { surface:false });
    solid(new THREE.ConeGeometry(0.8 * s, 1.8 * s, 9), '#3fae5a', x, 1.9 * s, z);
  }
  for (const [x, z, s] of [[-2.6, 3.2, 0.5], [4.6, -0.2, 0.4], [-6.6, 2.2, 0.6], [0.8, 6.4, 0.45]])
    solid(new THREE.DodecahedronGeometry(s), '#9a90b0', x, s * 0.5, z);
})();

// sky dome: opaque, so in the island it covers passthrough completely
const skyCv = document.createElement('canvas'); skyCv.width = 16; skyCv.height = 256;
(() => { const g = skyCv.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5b7dff'); gr.addColorStop(0.45, '#9fc2ff'); gr.addColorStop(0.55, '#ffd9ef'); gr.addColorStop(1, '#b9a3ff');
  g.fillStyle = gr; g.fillRect(0, 0, 16, 256); })();
const skyTex = new THREE.CanvasTexture(skyCv); skyTex.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide, fog:false, depthWrite:false }));
sky.renderOrder = -10; scene.add(sky);
const clouds = new THREE.Group(); scene.add(clouds);
for (let i = 0; i < 14; i++) {
  const c = new THREE.Group(), a = i / 14 * Math.PI * 2, r = 40 + (i % 3) * 18;
  for (let j = 0; j < 4; j++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(2.4 + Math.random() * 1.6, 10, 8), toon('#ffffff'));
    s.position.set(j * 2.6 - 4, Math.random() * 1.2, Math.random() * 1.5); c.add(s);
  }
  c.position.set(Math.cos(a) * r, -6 + (i % 4) * 7, Math.sin(a) * r); c.lookAt(0, c.position.y, 0); clouds.add(c);
}

// =====================================================================
// asset loading (all formats), templates, thumbnails
// =====================================================================
const assets = new Map();     // id -> { rec, tpl:Promise }
let thumbR = null;

function fileMapOf(files) {
  const map = new Map(), urls = [];
  for (const f of files) {
    const u = URL.createObjectURL(f.blob); urls.push(u);
    map.set(base(f.name), u);
    map.set(f.name.toLowerCase().replace(/\\/g, '/'), u);
  }
  return { map, urls };
}
function managerFor(map) {
  const m = new THREE.LoadingManager();
  const own = new Set(map.values());
  m.setURLModifier(url => {
    if (own.has(url) || url.startsWith('data:')) return url;
    return map.get(base(url)) || url;   // textures, .bin and .mtl found by file name
  });
  return m;
}
const loaders = {
  async glb(url, mgr) {
    const { GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js');
    const { DRACOLoader } = await import('three/addons/loaders/DRACOLoader.js');
    const { MeshoptDecoder } = await import('three/addons/libs/meshopt_decoder.module.js');
    const l = new GLTFLoader(mgr);
    const d = new DRACOLoader(); d.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/');
    l.setDRACOLoader(d); l.setMeshoptDecoder(MeshoptDecoder);
    const g = await l.loadAsync(url);
    return { obj:g.scene || g.scenes[0], clips:g.animations || [] };
  },
  async obj(url, mgr, files, map) {
    const { OBJLoader } = await import('three/addons/loaders/OBJLoader.js');
    const l = new OBJLoader(mgr);
    const mtl = files.find(f => ext(f.name) === 'mtl');
    if (mtl) {
      const { MTLLoader } = await import('three/addons/loaders/MTLLoader.js');
      const mats = await new MTLLoader(mgr).loadAsync(map.get(base(mtl.name)));
      mats.preload(); l.setMaterials(mats);
    }
    return { obj:await l.loadAsync(url), clips:[] };
  },
  async fbx(url, mgr) {
    const { FBXLoader } = await import('three/addons/loaders/FBXLoader.js');
    const o = await new FBXLoader(mgr).loadAsync(url);
    return { obj:o, clips:o.animations || [] };
  },
  async stl(url, mgr) {
    const { STLLoader } = await import('three/addons/loaders/STLLoader.js');
    const g = await new STLLoader(mgr).loadAsync(url);
    g.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: g.hasColors ? '#ffffff' : '#d9d4e8', vertexColors: !!g.hasColors, roughness:0.6 });
    return { obj:new THREE.Mesh(g, mat), clips:[] };
  },
  async ply(url, mgr) {
    const { PLYLoader } = await import('three/addons/loaders/PLYLoader.js');
    const g = await new PLYLoader(mgr).loadAsync(url);
    const vc = !!g.getAttribute('color');
    if (!g.index) {   // point cloud
      return { obj:new THREE.Points(g, new THREE.PointsMaterial({ size:0.004, vertexColors:vc, color: vc ? '#fff' : '#d9d4e8' })), clips:[] };
    }
    if (!g.getAttribute('normal')) g.computeVertexNormals();
    return { obj:new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors:vc, color: vc ? '#fff' : '#d9d4e8', roughness:0.6 })), clips:[] };
  },
  async dae(url, mgr) {
    const { ColladaLoader } = await import('three/addons/loaders/ColladaLoader.js');
    const c = await new ColladaLoader(mgr).loadAsync(url);
    return { obj:c.scene, clips:c.scene.animations || [] };
  },
  async '3mf'(url, mgr) {
    const { ThreeMFLoader } = await import('three/addons/loaders/3MFLoader.js');
    return { obj:await new ThreeMFLoader(mgr).loadAsync(url), clips:[] };
  },
  async '3ds'(url, mgr) {
    const { TDSLoader } = await import('three/addons/loaders/TDSLoader.js');
    return { obj:await new TDSLoader(mgr).loadAsync(url), clips:[] };
  },
  async usdz(url, mgr) {
    const { USDZLoader } = await import('three/addons/loaders/USDZLoader.js');
    return { obj:await new USDZLoader(mgr).loadAsync(url), clips:[] };
  },
  async wrl(url, mgr) {
    const { VRMLLoader } = await import('three/addons/loaders/VRMLLoader.js');
    return { obj:await new VRMLLoader(mgr).loadAsync(url), clips:[] };
  },
};
loaders.gltf = loaders.glb;

async function loadImageTemplate(rec) {
  const f = rec.files[0];
  const bmp = await createImageBitmap(f.blob);
  const tex = new THREE.Texture(bmp); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4; tex.needsUpdate = true;
  tex.flipY = false;  // ImageBitmap is not flipped by WebGL; flip UVs instead
  const a = bmp.width / bmp.height;
  const w = a >= 1 ? DEFAULT_IMAGE_SIZE : DEFAULT_IMAGE_SIZE * a, h = a >= 1 ? DEFAULT_IMAGE_SIZE / a : DEFAULT_IMAGE_SIZE;
  const geo = new THREE.PlaneGeometry(w, h);
  const uv = geo.getAttribute('uv'); for (let i = 0; i < uv.count; i++) uv.setY(i, 1 - uv.getY(i));
  const g = new THREE.Group();

async function expandZips(files) {
  const out = [];
  for (const f of files) {
    if (ext(f.name) !== 'zip') { out.push({ name:f.name, blob:f }); continue; }
    const { unzipSync } = await import('three/addons/libs/fflate.module.js');
    const z = unzipSync(new Uint8Array(await f.arrayBuffer()));
    for (const [name, data] of Object.entries(z)) {
      if (name.endsWith('/') || /(^|\/)__MACOSX\//.test(name) || base(name).startsWith('.')) continue;
      out.push({ name, blob:new Blob([data]) });
    }
  }
  return out;
}

    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const files = await expandZips(list);
    const models = files.filter(f => MODEL_EXT.includes(ext(f.name)));
    const recs = [];
    if (models.length) {
      const helpers = files.filter(f => !MODEL_EXT.includes(ext(f.name)));
      for (const m of models) {
        // .bin, .mtl and textures that came along are shared by every model in this import
        recs.push({ id:uid(), kind:'model', name:base(m.name).replace(/\.[^.]+$/, ''), main:m.name, files:[m, ...helpers], added:Date.now() });
      }
    } else {
      for (const f of files) {
        if (IMAGE_EXT.includes(ext(f.name)) || (f.blob.type || '').startsWith('image/')) recs.push({ id:uid(), kind:'image', name:base(f.name).replace(/\.[^.]+$/, ''), main:f.name, files:[f], added:Date.now() });

    let ok = 0;
    for (const rec of recs) {
      assets.set(rec.id, { rec, tpl:null });
      try {
        const tpl = await getTemplate(rec.id);
        try { rec.thumb = makeThumb(tpl); } catch (e) { console.warn('thumb', e); }

let actx = null;
function unlockAudio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } if (actx && actx.state === 'suspended') actx.resume().catch(() => {}); }
function sfx(f, len = 0.09) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * 1.5, t + len);
  g.gain.setValueAtTime(0.16, t); g.gain.exponentialRampToValueAtTime(0.001, t + len + 0.05);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + len + 0.06);
}

// help card for the first seconds in the headset
const helpCv = document.createElement('canvas'); helpCv.width = 640; helpCv.height = 300;
const helpTex = new THREE.CanvasTexture(helpCv); helpTex.colorSpace = THREE.SRGBColorSpace;
function drawHelp() {
  const g = helpCv.getContext('2d');
  g.fillStyle = '#ffd23f'; g.fillRect(0, 0, 640, 300); g.lineWidth = 10; g.strokeStyle = '#111'; g.strokeRect(5, 5, 630, 290);
  g.fillStyle = '#111'; g.textAlign = 'center'; g.font = '46px Bangers, Impact, sans-serif'; g.fillText('DECORATE!', 320, 50);
  g.font = '900 23px Nunito, sans-serif';
  ['Point + trigger a picture or model on the panel', 'Point at a wall, shelf or floor, trigger to stick it', 'While holding: stick = size / turn, grip = cancel',
   'Trigger a placed thing to move it · hold A or X to delete', 'B or Y opens the panel · left stick walks on the island'].forEach((l, i) => g.fillText(l, 320, 102 + i * 40));
  helpTex.needsUpdate = true;
}
drawHelp(); document.fonts && document.fonts.ready.then(drawHelp);
const helpCard = new THREE.Mesh(new THREE.PlaneGeometry(0.56, 0.2625), new THREE.MeshBasicMaterial({ map:helpTex, depthTest:false }));
helpCard.renderOrder = 21; helpCard.visible = false; scene.add(helpCard);

// =====================================================================
// buttons, resize, loop, boot
// =====================================================================
$('roomBtn').onclick = () => enterXR(ROOM);
$('islandBtn').onclick = () => enterXR(ISLAND);
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock();
let xrFrames = -1;
renderer.setAnimationLoop((t, frame) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (xr && renderer.xr.isPresenting) {
    updateXR(dt, frame);
    if (xrFrames >= 0 && ++xrFrames > 3) { xrFrames = -1; panelOpenFront(); }
    const now = performance.now();
    helpCard.visible = now < helpUntil;
    if (helpCard.visible && panel.visible) {
      helpCard.position.copy(panel.position).add(new THREE.Vector3(0, 0.37, 0));
      helpCard.quaternion.copy(panel.quaternion);
    } else if (helpCard.visible) {
      const { p, d } = headPose(); helpCard.position.copy(p).addScaledVector(d, 0.8); helpCard.lookAt(p);
    }
  } else {
    orbit.update();
    if (selBox && selected) selBox.update();
  }
  for (const m of mixers) m.update(dt);
  clouds.rotation.y += dt * 0.004;
  renderer.render(scene, camera);
});

(async function boot() {
  setMode('2d');
  checkXR();
  try { await Store.open(); }
  catch (e) { hint('This browser won’t let me save here, so nothing will be remembered', 6000); }
  try {
    for (const rec of await Store.all('assets')) assets.set(rec.id, { rec, tpl:null });
    renderTiles();
    const recs = await Store.all('items');
    for (const rec of recs) {
      if (!assets.has(rec.assetId)) { Store.del('items', rec.id).catch(() => {}); continue; }
      spawnItem(rec).catch(e => console.warn('item', rec.id, e));
    }
  } catch (e) { console.warn(e); }
  updateCounts();
  window.DECORNAUT = { orbit, assets, items, importFiles, newItemFromAsset, endCarry, carryTo, surfaceHit, ray, camera, ISLAND, ROOM, get carry() { return carry; }, quatFor, mountFor };
})();
</script>
</body>
