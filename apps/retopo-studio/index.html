<!DOCTYPE html>
<html lang="en">
<head>

<meta name="description" content="Touch-friendly low-poly modelling and retopology over imported sculpts. A prototype by Claude (AI), made for itemnaut.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Retopo">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">

<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Retopo Studio</title>
<style>
/* Layout: full-screen 3D canvas, one slim tool column on the right, contextual bars only when needed */
:root{--bg:#e9ecf1;--scene:#e9ecf1;--panel:#ffffff;--fg:#1c2330;--muted:#5b6474;--accent:#2f7de1;--danger:#d63a3a;--shadow:rgba(20,32,56,.2);--scrim:rgba(10,14,22,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171c;--scene:#1a1e25;--panel:#272c35;--fg:#e7eaf0;--muted:#9aa3b3;--accent:#5ba1ff;--danger:#ff6b6b;--shadow:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--scene:#1a1e25;--panel:#272c35;--fg:#e7eaf0;--muted:#9aa3b3;--accent:#5ba1ff;--danger:#ff6b6b;--shadow:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;position:fixed;inset:0}
#bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;padding:2px 4px 6px 8px}
.b{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:var(--panel);color:var(--fg);box-shadow:0 2px 6px var(--shadow);font-size:20px;cursor:pointer}
.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b.off{opacity:.4}
#op{width:44px;height:120px;flex:none;writing-mode:vertical-lr;direction:rtl;accent-color:var(--accent)}
#hint{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));text-align:center;color:var(--fg);font-size:14px;pointer-events:none;transition:opacity .6s;text-shadow:0 0 6px var(--bg),0 0 2px var(--bg)}
#stats{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));font-size:12px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
#woodBar input{accent-color:var(--accent)}
#ask{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));touch-action:auto;z-index:20}
#askF{background:var(--panel);color:var(--fg);border-radius:16px;padding:18px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px var(--shadow)}
#askT{margin:0;font-size:15px;line-height:1.4}
#askI{font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--muted);background:var(--bg);color:var(--fg)}
#askF .row{display:flex;gap:8px;justify-content:flex-end}
#askF button{font-size:15px;padding:8px 16px;border-radius:20px;border:none;background:var(--bg);color:var(--fg);cursor:pointer}
#askF #askYes{background:var(--accent);color:#fff;font-weight:600}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<body>
<div id="stats"></div>
<div id="bar">
<button class="b" id="bWood" title="Wood carving mode">🪵</button>
<button class="b" id="bRef" title="Reference box from drawings">📐</button>

<button class="b" id="bHi" title="Show/hide sculpt">👁</button>

</div>

<script type="module">

const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
function sceneBg(){const c=getComputedStyle(document.documentElement).getPropertyValue('--scene').trim();scene.background=new THREE.Color(c||'#e9ecf1')}
sceneBg();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sceneBg)}catch(e){}
new MutationObserver(sceneBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(2,3,4);scene.add(dl);
const el=renderer.domElement;

// ---------- state ----------
let V=[],F=[],pend=[],hist=[],VU=[],texOn=false,texMat=null;
let high=null, size=2, snapOn=true;
const free=()=>!high||!snapOn;
const grid=new THREE.GridHelper(4,20,0x999999,0xdddddd);grid.position.y=-1.3;grid.visible=false;scene.add(grid);
const hint=(t,ms=3500)=>{const h=$('hint');h.textContent=t;h.style.opacity=1;clearTimeout(hint.t);hint.t=setTimeout(()=>h.style.opacity=0,ms)};
function ask(text,{value,ok='OK'}={}){return new Promise(res=>{const A=$('ask'),I=$('askI');$('askT').textContent=text;
  I.hidden=value===undefined;if(value!==undefined)I.value=value;$('askYes').textContent=ok;A.hidden=false;
  const done=v=>{A.hidden=true;$('askF').onsubmit=null;$('askNo').onclick=null;res(v)};
  $('askF').onsubmit=e=>{e.preventDefault();done(value===undefined?true:I.value)};

  setTimeout(()=>(value===undefined?$('askYes'):I).focus(),0)})}
const save=()=>{hist.push(JSON.stringify([V,F]));if(hist.length>80)hist.shift()};
const undo=()=>{if(woodMode){if(!woodUndo.length)return hint('No more undo: wood remembers');wood.field.set(woodUndo.pop());return woodRefresh()}
  if(!hist.length)return;[V,F]=JSON.parse(hist.pop());pend=[];rebuild()};

// ---------- high-res sculpt ----------

  scene.add(w);w.updateMatrixWorld(true);high=w;highGeo=null;size=2;
  V=[];F=[];VU=[];pend=[];hist=[];rebuild();
}
function getHighGeo(){if(highGeo)return highGeo;const gs=[];high.updateMatrixWorld(true);
  high.traverse(o=>{if(o.isMesh){let g=o.geometry.clone().applyMatrix4(o.matrixWorld);g=g.index?g.toNonIndexed():g;
    const ng=new THREE.BufferGeometry();ng.setAttribute('position',g.attributes.position);gs.push(ng)}});
  return highGeo=mergeVertices(mergeGeometries(gs))}
function demo(){
  const g=new THREE.IcosahedronGeometry(1,6),p=g.attributes.position,v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    const n=1+.12*Math.sin(v.x*5)*Math.cos(v.y*4)+.06*Math.sin(v.z*9+v.x*3);
    v.multiplyScalar(n);v.y*=1.25;p.setXYZ(i,v.x,v.y,v.z)}

}
function loadFile(f){
  const name=f.name.toLowerCase(),r=new FileReader();
  if(!/\.(obj|glb|gltf|stl|ply|fbx|dae|blend)$/.test(name))return hint('That file type is not supported. Use BLEND, OBJ, GLB, STL, PLY, FBX or DAE.',5000);
  if(name.endsWith('.blend')){hint('Reading Blender file…',60000);
    f.arrayBuffer().then(blendBytes).then(u=>{const r=parseBlend(u);const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.BufferAttribute(r.pos,3));g.setIndex(new THREE.BufferAttribute(r.idx,1));
      setHigh(geoMesh(g));const n=r.count+' object'+(r.count>1?'s':'');
      if(r.warn.has('multires'))hint('Loaded '+n+'. This sculpt uses Multires, so only the base mesh came through. In Blender, apply the Multires modifier and save, then import again.',9000);
      else if(r.warn.has('mods'))hint('Loaded '+n+'. Modifiers are not applied: apply them in Blender first if the shape looks different.',7000);
      else hint('Loaded '+f.name+' ('+n+')')})
    .catch(e=>{console.error(e);hint(({zstd:'This .blend is compressed and the decompressor could not load. In Blender, turn off Compress when saving, or export a .glb.',
      notblend:'That file is not a Blender file.',nomesh:'No mesh found in that .blend file.'})[e&&e.message]||'Could not read that .blend file. In Blender, export a .glb instead.',8000)});
    return}

    if(!has)return hint('No mesh found in that file');setHigh(root);hint('Loaded '+f.name)};

    if(name.endsWith('.obj'))fromObj(new OBJLoader().parse(d));

    else if(name.endsWith('.fbx'))fromObj(new FBXLoader().parse(d,''));
    else if(name.endsWith('.dae'))fromObj(new ColladaLoader().parse(d,'').scene);
    else new GLTFLoader().parse(d,'',gl=>fromObj(gl.scene),er=>hint('Could not read file'));
  }catch(err){console.error(err);hint('Could not read file')}};
  (name.endsWith('.obj')||name.endsWith('.dae'))?r.readAsText(f):r.readAsArrayBuffer(f);

// ---------- .blend reader (meshes only, Blender 2.6 to 5.x layouts) ----------

function rebuild(){meshGeo();
  if(texOn&&high){clearTimeout(rebuild.t);rebuild.t=setTimeout(()=>{sampleAll();meshGeo()},250)}
  const lp=[];for(const e of edges().values())lp.push(...V[e.a],...V[e.b]);
  lines.geometry.dispose();lines.geometry=new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(lp,3));
  pts.geometry.dispose();pts.geometry=new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(V.flat(),3));
  pendL.geometry.dispose();pendL.geometry=new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(pend.flatMap(i=>V[i]),3));
  $('bX').style.display=pend.length?'block':'none';
  $('stats').textContent=V.length+' verts · '+F.length+' faces';
}

// ---------- screen picking ----------
const scr=p=>{const v=new THREE.Vector3(...p).project(cam);return [(v.x+1)/2*innerWidth,(1-v.y)/2*innerHeight,v.z]};
function front(p){if(free())return true;const P=new THREE.Vector3(...p),d=P.clone().sub(cam.position);
  rc.set(cam.position,d.clone().normalize());const h=rc.intersectObject(high,true)[0];return !h||h.distance>d.length()-size*.03}
function pickV(x,y,r=22){let bi=-1,bd=r;V.forEach((p,i)=>{const s=scr(p);const d=Math.hypot(s[0]-x,s[1]-y);
  if(d<bd&&s[2]<1&&front(p)){bd=d;bi=i}});return bi}
function pickE(x,y,r=16){let best=null,bd=r;for(const e of edges().values()){const A=scr(V[e.a]),B=scr(V[e.b]);
  const dx=B[0]-A[0],dy=B[1]-A[1],L=dx*dx+dy*dy||1,t=Math.max(0,Math.min(1,((x-A[0])*dx+(y-A[1])*dy)/L));
  const d=Math.hypot(A[0]+t*dx-x,A[1]+t*dy-y);
  if(d<bd&&front(V[e.a].map((v,k)=>(v+V[e.b][k])/2))){bd=d;best=e}}return best}

// ---------- operations ----------
function addPend(i){
  if(pend.length>=3&&i===pend[0]){save();F.push([...pend]);addMirFace(pend);pend=[];hint('Triangle made');return rebuild()}
  if(pend.includes(i))return;pend.push(i);
  if(pend.length===4){save();F.push([...pend]);addMirFace(pend);pend=[];hint('Quad made')}
  rebuild()}
function extrude(e){const ma=mirOn?mir(e.a):-1,mb=mirOn?mir(e.b):-1,n0=V.length;save();const r=extrude1(e);
  if(mirOn&&ma>=0&&mb>=0&&!(new Set([e.a,e.b,ma,mb]).size===2)){const me=edges().get(ek(ma,mb));
    if(me&&me.faces.length){const r2=extrude1(me),mOf=new Map([[r.src[0],r.nw[0]],[r.src[1],r.nw[1]]]);const drops=[];
      r2.src.forEach((sv,k)=>{const twin=mOf.get(mir(sv));if(twin==null)return;
        if(mir(sv)===sv){V[twin][0]=0;drops.push([twin,r2.nw[k]])}else V[r2.nw[k]]=mp(V[twin])});
      drops.sort((a,b)=>b[1]-a[1]).forEach(([k,d])=>weld(k,d))}}
  else if(mirOn){r.src.forEach((sv,k)=>{if(mir(sv)===sv)V[r.nw[k]][0]=0});if(mir(r.src[0])===r.src[1])V[r.nw[1]]=mp(V[r.nw[0]])}
  rebuild();hint('Extruded – drag the new edge');return r}
function extrude1(e){
  const f=F[e.faces[0]],i=f.indexOf(e.a),fwd=f[(i+1)%f.length]===e.b;const a=fwd?e.a:e.b,b=fwd?e.b:e.a;
  const c=new THREE.Vector3();f.forEach(j=>c.add(new THREE.Vector3(...V[j])));c.divideScalar(f.length);
  const A=new THREE.Vector3(...V[a]),B=new THREE.Vector3(...V[b]);
  const dir=A.clone().add(B).multiplyScalar(.5).sub(c).normalize().multiplyScalar(A.distanceTo(B));
  const n=fnorm(f);const na=V.push(snap(A.clone().add(dir).toArray(),n))-1,nb=V.push(snap(B.clone().add(dir).toArray(),n))-1;
  F.push([b,a,na,nb]);return {src:[a,b],nw:[na,nb]}}
function loopCut(e0){if(!e0.faces.every(fi=>F[fi].length===4))return hint('Loop cuts need quads');
  const ma=mirOn?mir(e0.a):-1,mb=mirOn?mir(e0.b):-1,pa=mp(V[e0.a]),pb=mp(V[e0.b]),n0=V.length;save();loop1(e0);
  if(mirOn&&ma>=0&&mb>=0&&new Set([e0.a,e0.b,ma,mb]).size>2){const find=p=>V.findIndex(q=>Math.hypot(q[0]-p[0],q[1]-p[1],q[2]-p[2])<MT());
    const me=edges().get(ek(find(pa),find(pb)));if(me&&me.faces.every(fi=>F[fi].length===4))loop1(me)}
  if(mirOn)symmetrize(n0);rebuild();hint('Edge loop added')}
function loop1(e0){const em=edges();const mid=new Map(),done=new Set(),newF=[];
  const midOf=(a,b)=>{const k=ek(a,b);if(!mid.has(k)){const p=V[a].map((v,j)=>(v+V[b][j])/2);
    const q=snap(p,vnorm(a));if(mirOn){const A=mir(a),B=mir(b);if(A===b||(A===a&&B===b))q[0]=0}mid.set(k,V.push(q)-1)}return mid.get(k)};
  const walk=(a,b,fi)=>{while(fi!=null&&!done.has(fi)&&F[fi].length===4){done.add(fi);const f=F[fi];
    let i=f.indexOf(a);if(f[(i+1)%4]!==b){i=f.indexOf(b);[a,b]=[b,a]}
    const v0=f[i],v1=f[(i+1)%4],v2=f[(i+2)%4],v3=f[(i+3)%4],m1=midOf(v0,v1),m2=midOf(v2,v3);
    newF.push([fi,[v0,m1,m2,v3],[m1,v1,v2,m2]]);
    const nx=em.get(ek(v2,v3));a=v2;b=v3;fi=nx?nx.faces.find(x=>!done.has(x)):null}};
  e0.faces.forEach(fi=>walk(e0.a,e0.b,fi));
  const rm=new Set(newF.map(x=>x[0]));F=F.filter((f,i)=>!rm.has(i));newF.forEach(x=>F.push(x[1],x[2]))}
function delV(i){const m=mirOn?mir(i):-1,ds=[...new Set([i,m].filter(x=>x>=0))].sort((a,b)=>b-a);save();
  for(const d of ds){F=F.filter(f=>!f.includes(d)).map(f=>f.map(j=>j>d?j-1:j));V.splice(d,1)}pend=[];rebuild();hint(ds.length>1?'Points deleted':'Point deleted')}
async function auto(){if(!high)return hint('Load a sculpt first');const t=await ask('Target face count. Auto makes triangles, then you clean up by hand.',{value:'800',ok:'Run'});if(!t||!(+t>0))return;
  hint('Working…');setTimeout(()=>{const g=getHighGeo().clone();const tri=(g.index?g.index.count:g.attributes.position.count)/3;
    const s=new SimplifyModifier().modify(g,Math.max(0,Math.floor(g.attributes.position.count*(1-(+t)/tri))));
    const p=s.attributes.position,ix=s.index;save();V=[];for(let i=0;i<p.count;i++)V.push([p.getX(i),p.getY(i),p.getZ(i)]);
    F=[];for(let i=0;i<ix.count;i+=3)F.push([ix.getX(i),ix.getX(i+1),ix.getX(i+2)]);pend=[];rebuild();hint('Auto retopo done')},50)}
function exportOBJ(){let s='# retopo export\n';const uv=texOn&&VU.length===V.length;V.forEach(p=>s+='v '+p.map(v=>v.toFixed(5)).join(' ')+'\n');
  if(uv)VU.forEach(u=>s+='vt '+u[0].toFixed(5)+' '+u[1].toFixed(5)+'\n');
  F.forEach(f=>s+='f '+f.map(i=>uv?(i+1)+'/'+(i+1):i+1).join(' ')+'\n');const a=document.createElement('a');
  dl_(new Blob([s],{type:'text/plain'}),'retopo.obj')}
const dlP=(window.claude&&window.claude.use)?Promise.resolve(window.claude.use('downloads')).catch(()=>null):null;
function crc32(u){let c=~0;for(let i=0;i<u.length;i++){c^=u[i];for(let k=0;k<8;k++)c=(c>>>1)^(0xEDB88320&-(c&1))}return (~c)>>>0}
function zip1(name,d){const n=new TextEncoder().encode(name),crc=crc32(d),dt=((2026-1980)<<9)|(1<<5)|1;
  const L=new DataView(new ArrayBuffer(30));L.setUint32(0,0x04034b50,true);L.setUint16(4,20,true);L.setUint16(12,dt,true);
  L.setUint32(14,crc,true);L.setUint32(18,d.length,true);L.setUint32(22,d.length,true);L.setUint16(26,n.length,true);
  const C=new DataView(new ArrayBuffer(46));C.setUint32(0,0x02014b50,true);C.setUint16(4,20,true);C.setUint16(6,20,true);C.setUint16(14,dt,true);
  C.setUint32(16,crc,true);C.setUint32(20,d.length,true);C.setUint32(24,d.length,true);C.setUint16(28,n.length,true);
  const E=new DataView(new ArrayBuffer(22));E.setUint32(0,0x06054b50,true);E.setUint16(8,1,true);E.setUint16(10,1,true);
  E.setUint32(12,46+n.length,true);E.setUint32(16,30+n.length+d.length,true);
  return new Blob([L,n,d,C,n,E],{type:'application/zip'})}
async function dl_(blob,n){
  if(!dlP){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=n;a.click();return hint('Exported '+n)}
  const d=await dlP;if(!d)return hint('Saving files is not available in this view');
  const z=zip1(n,new Uint8Array(await blob.arrayBuffer()));
  try{await d.save({filename:n+'.zip',data:z});hint('Saved '+n+'.zip. Unzip it to get your '+n.split('.').pop().toUpperCase()+' file')}
  catch(e){hint(e&&e.code==='declined'?'Save cancelled':'Could not save the file'+(e&&e.code?' ('+e.code+')':''))}}
function exportWood(fmt){const g=woodGeo(),m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0xc49a6c}));
  if(fmt==='obj'){const a=g.attributes.position.array;let o='# wood carving\n';
    for(let i=0;i<a.length;i+=3)o+='v '+a[i].toFixed(5)+' '+a[i+1].toFixed(5)+' '+a[i+2].toFixed(5)+'\n';
    for(let i=0;i<a.length/3;i+=3)o+='f '+(i+1)+' '+(i+2)+' '+(i+3)+'\n';return dl_(new Blob([o]),'carving.obj')}
  if(fmt==='stl')return dl_(new Blob([new STLExporter().parse(m,{binary:true})]),'carving.stl');
  if(fmt==='ply')return new PLYExporter().parse(m,r=>dl_(new Blob([r]),'carving.ply'),{binary:true});
  new GLTFExporter().parse(m,r=>dl_(new Blob([r]),'carving.glb'),()=>hint('Export failed'),{binary:true})}
function lowObj(){let mt=new THREE.MeshStandardMaterial({color:0x4aa3ff});if(lowMesh.material===texMat){mt=texMat.clone();Object.assign(mt,{transparent:false,opacity:1,depthWrite:true,polygonOffset:false})}
  const m=new THREE.Mesh(lowMesh.geometry.clone(),mt);m.name='retopo';return m}
function exportAs(fmt){if(woodMode)return exportWood(fmt);if(!F.length)return hint('Nothing to export yet');
  if(fmt==='obj')return exportOBJ();
  if(fmt==='stl')return dl_(new Blob([new STLExporter().parse(lowObj(),{binary:true})]),'retopo.stl');
  if(fmt==='ply')return new PLYExporter().parse(lowObj(),r=>dl_(new Blob([r]),'retopo.ply'),{binary:true});
  if(fmt==='glb')new GLTFExporter().parse(lowObj(),r=>dl_(new Blob([r]),'retopo.glb'),e=>hint('Export failed'),{binary:true})}


// ---------- wood touch ----------
let W=null,woodDirty=false;
function woodHit(x,y){rc.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-y/innerHeight*2+1),cam);
  const h=rc.intersectObject(wood,false)[0];if(!h)return null;const n=h.face.normal.clone().normalize();
  if(n.dot(rc.ray.direction)>0)n.negate();return {p:wood.worldToLocal(h.point.clone()),n}}
function woodRefresh(){if(woodDirty)return;woodDirty=true;requestAnimationFrame(()=>{wood.update();
  wood.geometry.boundingSphere=new THREE.Sphere(new THREE.Vector3(),2);woodDirty=false})}
wood.frustumCulled=false;
function woodDown(e){const h=woodHit(e.clientX,e.clientY);if(!h)return false;
  woodUndo.push(new Float32Array(wood.field));if(woodUndo.length>5)woodUndo.shift();
  controls.enabled=false;const camR=new THREE.Vector3(1,0,0).applyQuaternion(cam.quaternion);
  W={last:h.p,n:h.n};if(['gouge','chisel','sand'].includes(woodTool)){stamp(h.p,h.n,camR);woodRefresh()}return true}
function woodMove(e){if(!W)return;const h=woodHit(e.clientX,e.clientY);if(!h)return;
  const d=h.p.clone().sub(W.last);if(d.length()<woodSize*.4)return;
  const t=d.normalize(),n=h.n.clone().lerp(W.n,.5).normalize();stamp(h.p,n,t);W.last=h.p;W.n=h.n;woodRefresh()}
function setWood(on){woodMode=on;wood.visible=on;[lowMesh,lines,pts,pendL].forEach(o=>o.visible=!on);
  if(high)high.visible=!on&&!$('bHi').classList.contains('off');
  $('woodBar').style.display=on?'flex':'none';$('bWood').classList.toggle('off',false);
  if(on){$('bX').style.display='none';if(!setWood.made){newBlock();setWood.made=true}
    controls.target.set(0,0,0);hint('Drag on the wood to carve. The grain runs up and down: cutting across it can chip.')}
  else rebuild()}
$('bWood').onclick=()=>setWood(!woodMode);
document.querySelectorAll('.wt').forEach(b=>b.onclick=()=>{woodTool=b.dataset.t;
  document.querySelectorAll('.wt').forEach(x=>x.classList.toggle('off',x!==b))});
$('wSize').oninput=e=>woodSize=+e.target.value;
$('wNew').onclick=async()=>{if(await ask('Start a fresh block of wood?',{ok:'New block'}))newBlock()};
function woodGeo(){const n=wood.count*3,g=new THREE.BufferGeometry();
  const pa=wood.geometry.attributes.position.array.slice(0,n).map(v=>v*1.3);
  g.setAttribute('position',new THREE.Float32BufferAttribute(pa,3));g.computeVertexNormals();return g}

// ---------- touch gestures (registered before OrbitControls so we can claim a touch) ----------
let G=null,touches=0,lastTap={t:0,k:null};
el.addEventListener('pointerdown',e=>{touches++;
  if(touches>1){if(G){clearTimeout(G.lp);G=null}W=null;controls.enabled=true;return}
  if(woodMode){woodDown(e);return}
  const x=e.clientX,y=e.clientY,vi=pickV(x,y),ed=vi<0?pickE(x,y):null;
  G={x,y,t:performance.now(),vi,ed,moved:false,saved:false,hitStart:hitScreen(x,y,ed?V[ed.a].map((v,k)=>(v+V[ed.b][k])/2):undefined)};
  controls.enabled=!(vi>=0||ed);
  G.lp=setTimeout(()=>{if(!G||G.moved)return;
    if(G.vi>=0)delV(G.vi);else if(G.ed)loopCut(G.ed);else holdFace(G.x,G.y);G=null;controls.enabled=true},550)});
el.addEventListener('pointermove',e=>{if(woodMode)return woodMove(e);if(!G)return;const dx=e.clientX-G.x,dy=e.clientY-G.y;
  if(!G.moved&&Math.hypot(dx,dy)>7){G.moved=true;clearTimeout(G.lp)}
  if(!G.moved||controls.enabled)return;
  if(!G.saved){save();G.saved=true;if(mirOn){if(G.vi>=0)G.mv=mir(G.vi);else if(G.ed)G.me=[mir(G.ed.a),mir(G.ed.b)]}}
  const h=hitScreen(e.clientX,e.clientY,G.vi>=0?V[G.vi]:G.hitStart&&G.hitStart.point.toArray());
  if(G.vi>=0){if(h){V[G.vi]=h.point.toArray();if(mirOn&&G.mv===G.vi)V[G.vi][0]=0;else if(mirOn&&G.mv>=0)V[G.mv]=mp(V[G.vi])}}
  else if(G.ed&&h&&G.hitStart){const d=h.point.clone().sub(G.hitStart.point);G.hitStart=h;
    const cn=cam.position.clone().normalize().toArray();
    for(const i of [G.ed.a,G.ed.b])V[i]=snap(new THREE.Vector3(...V[i]).add(d).toArray(),vnorm(i)||cn);
    if(mirOn&&G.me){const ab=[G.ed.a,G.ed.b];ab.forEach((i,k)=>{const m=G.me[k];if(m===i)V[i][0]=0;else if(m>=0&&!ab.includes(m))V[m]=mp(V[i])});
      if(G.me[0]===G.ed.b)V[G.ed.b]=mp(V[G.ed.a])}}
  rebuild()});
const up=e=>{touches=Math.max(0,touches-1);if(woodMode){W=null;setTimeout(()=>controls.enabled=true,0);return}if(!G)return;clearTimeout(G.lp);const g=G;G=null;
  setTimeout(()=>controls.enabled=true,0);
  if(g.moved||performance.now()-g.t>400)return;
  // it's a tap
  const now=performance.now(),key=g.vi>=0?'v'+g.vi:g.ed?'e'+ek(g.ed.a,g.ed.b):'s';
  const dbl=now-lastTap.t<320&&lastTap.k===key;lastTap={t:now,k:key};
  if(g.vi>=0)return addPend(g.vi);
  if(g.ed){if(dbl)extrude(g.ed);return}
  if(g.hitStart){save();addPend(addVert(g.hitStart.point.toArray()))}
  else if(pend.length){pend=[];rebuild();hint('Cleared')}};
el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);

const controls=new OrbitControls(cam,el);controls.enableDamping=true;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};

// ---------- buttons ----------
$('bImp').onclick=()=>$('file').click();
$('file').onchange=e=>{if(e.target.files[0])loadFile(e.target.files[0]);e.target.value=''};
$('bHi').onclick=()=>{if(!high)return;high.visible=!high.visible;$('bHi').classList.toggle('off',!high.visible)};
$('bMir').onclick=()=>{mirOn=!mirOn;$('bMir').classList.toggle('off',!mirOn);mirPlane.visible=mirOn;
  hint(mirOn?'Mirror on: edits copy across the centre line':'Mirror off')};
$('bSnap').onclick=()=>{snapOn=!snapOn;$('bSnap').classList.toggle('off',!snapOn);grid.visible=free();
  hint(snapOn?'Snapping to sculpt':'Free modelling: points go on a plane facing you, drags move freely')};
$('bX').onclick=()=>{pend=[];rebuild();hint('Cancelled')};
$('op').oninput=e=>{woodMat.uniforms.refOp.value=+e.target.value*.5;lowMat.opacity=+e.target.value;refMat.uniforms.op.value=+e.target.value;if(texMat)texMat.opacity=+e.target.value};
$('bTex').classList.add('off');
$('bTex').onclick=()=>{texOn=!texOn;$('bTex').classList.toggle('off',!texOn);
  if(texOn){sampleAll();if(!texMat)hint('No material found on the sculpt');else hint('Low-poly uses the sculpt texture')}else hint('Plain blue view');meshGeo()};
$('bAuto').onclick=auto;$('bUndo').onclick=undo;$('bExp').onclick=()=>{const m=$('expMenu'),r=$('bExp').getBoundingClientRect();m.style.top=r.top+'px';m.style.display=m.style.display==='flex'?'none':'flex'};
document.querySelectorAll('#expMenu button').forEach(b=>b.onclick=()=>{$('expMenu').style.display='none';exportAs(b.dataset.f)});
const HELP='Mirror button: copy edits across the centre · Tap sculpt: drop point (4 make a quad, tap the first to close a triangle) · Drag point or edge: move it on the surface · Double-tap edge: extrude · Hold edge: edge loop · Hold point: delete · One finger on empty space: orbit · Two fingers: zoom and pan';
$('bHelp').onclick=()=>hint(HELP);
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='z')undo()});

function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();demo();hint(HELP);
renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,cam)});
</script>
</body>
