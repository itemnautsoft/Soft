<!DOCTYPE html>

<head>

<title>Retopo Studio</title>
<style>
/* Layout: full-screen 3D canvas, one slim tool column on the right, contextual bars only when needed */
:root{--bg:#e9ecf1;--scene:#e9ecf1;--panel:#ffffff;--fg:#1c2330;--muted:#5b6474;--accent:#2f7de1;--danger:#d63a3a;--shadow:rgba(20,32,56,.2);--scrim:rgba(10,14,22,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171c;--scene:#1a1e25;--panel:#272c35;--fg:#e7eaf0;--muted:#9aa3b3;--accent:#5ba1ff;--danger:#ff6b6b;--shadow:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--scene:#1a1e25;--panel:#272c35;--fg:#e7eaf0;--muted:#9aa3b3;--accent:#5ba1ff;--danger:#ff6b6b;--shadow:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;position:fixed;inset:0}
#bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;padding:2px 4px 6px 8px}
.b{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:var(--panel);color:var(--fg);box-shadow:0 2px 6px var(--shadow);font-size:20px;cursor:pointer}
.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b.off{opacity:.4}
#op{width:44px;height:120px;flex:none;writing-mode:vertical-lr;direction:rtl;accent-color:var(--accent)}

#woodBar input{accent-color:var(--accent)}
#ask{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));touch-action:auto;z-index:20}
#askF{background:var(--panel);color:var(--fg);border-radius:16px;padding:18px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px var(--shadow)}
#askT{margin:0;font-size:15px;line-height:1.4}
#askI{font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--muted);background:var(--bg);color:var(--fg)}
#askF .row{display:flex;gap:8px;justify-content:flex-end}
#askF button{font-size:15px;padding:8px 16px;border-radius:20px;border:none;background:var(--bg);color:var(--fg);cursor:pointer}
#askF #askYes{background:var(--accent);color:#fff;font-weight:600}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<body>
<div id="stats"></div>
<div id="bar">

const $=id=>document.getElementById(id);
const renderer=new THREE.WebGLRenderer({antialias:true});

document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
function sceneBg(){const c=getComputedStyle(document.documentElement).getPropertyValue('--scene').trim();scene.background=new THREE.Color(c||'#e9ecf1')}
sceneBg();try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sceneBg)}catch(e){}
new MutationObserver(sceneBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
const cam=new THREE.PerspectiveCamera(45,1,0.01,100);cam.position.set(0,0.6,4);
scene.add(new THREE.HemisphereLight(0xffffff,0x888899,2.2));
const dl=new THREE.DirectionalLight(0xffffff,1.5);dl.position.set(2,3,4);scene.add(dl);
const el=renderer.domElement;

// ---------- state ----------
let V=[],F=[],pend=[],hist=[],VU=[],texOn=false,texMat=null;
let high=null, size=2, snapOn=true;

const grid=new THREE.GridHelper(4,20,0x999999,0xdddddd);grid.position.y=-1.3;grid.visible=false;scene.add(grid);
const hint=(t,ms=3500)=>{const h=$('hint');h.textContent=t;h.style.opacity=1;clearTimeout(hint.t);hint.t=setTimeout(()=>h.style.opacity=0,ms)};
function ask(text,{value,ok='OK'}={}){return new Promise(res=>{const A=$('ask'),I=$('askI');$('askT').textContent=text;
  I.hidden=value===undefined;if(value!==undefined)I.value=value;$('askYes').textContent=ok;A.hidden=false;
  const done=v=>{A.hidden=true;$('askF').onsubmit=null;$('askNo').onclick=null;res(v)};
  $('askF').onsubmit=e=>{e.preventDefault();done(value===undefined?true:I.value)};
  $('askNo').onclick=()=>done(value===undefined?false:null);
  setTimeout(()=>(value===undefined?$('askYes'):I).focus(),0)})}
let meshVer=0;
const save=()=>{meshVer++;hist.push(JSON.stringify([V,F]));if(hist.length>80)hist.shift()};
const undo=()=>{meshVer++;if(woodMode){if(!woodUndo.length)return hint('No more undo: wood remembers');wood.field.set(woodUndo.pop());return woodRefresh()}
  if(!hist.length)return;[V,F]=JSON.parse(hist.pop());pend=[];rebuild()};

// ---------- high-res sculpt ----------
const hiMat=new THREE.MeshStandardMaterial({color:0xb9b2a8,roughness:.8,flatShading:false});

  scene.add(w);w.updateMatrixWorld(true);high=w;highGeo=null;size=2;
  V=[];F=[];VU=[];pend=[];hist=[];rebuild();
}
function getHighGeo(){if(highGeo)return highGeo;const gs=[];high.updateMatrixWorld(true);
  high.traverse(o=>{if(o.isMesh){let g=o.geometry.clone().applyMatrix4(o.matrixWorld);g=g.index?g.toNonIndexed():g;
    const ng=new THREE.BufferGeometry();ng.setAttribute('position',g.attributes.position);gs.push(ng)}});
  return highGeo=mergeVertices(mergeGeometries(gs))}
function demo(){
  const g=new THREE.IcosahedronGeometry(1,6),p=g.attributes.position,v=new THREE.Vector3();
  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);
    const n=1+.12*Math.sin(v.x*5)*Math.cos(v.y*4)+.06*Math.sin(v.z*9+v.x*3);
    v.multiplyScalar(n);v.y*=1.25;p.setXYZ(i,v.x,v.y,v.z)}

}
function loadFile(f){
  const name=f.name.toLowerCase(),r=new FileReader();
  if(!/\.(obj|glb|gltf|stl|ply|fbx|dae|blend)$/.test(name))return hint('That file type is not supported. Use BLEND, OBJ, GLB, STL, PLY, FBX or DAE.',5000);
  if(name.endsWith('.blend')){hint('Reading Blender file…',60000);
    f.arrayBuffer().then(blendBytes).then(u=>{const r=parseBlend(u);const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.BufferAttribute(r.pos,3));g.setIndex(new THREE.BufferAttribute(r.idx,1));
      setHigh(geoMesh(g));const n=r.count+' object'+(r.count>1?'s':'');
      if(r.warn.has('multires'))hint('Loaded '+n+'. This sculpt uses Multires, so only the base mesh came through. In Blender, apply the Multires modifier and save, then import again.',9000);
      else if(r.warn.has('mods'))hint('Loaded '+n+'. Modifiers are not applied: apply them in Blender first if the shape looks different.',7000);
      else hint('Loaded '+f.name+' ('+n+')')})
    .catch(e=>{console.error(e);hint(({zstd:'This .blend is compressed and the decompressor could not load. In Blender, turn off Compress when saving, or export a .glb.',
      notblend:'That file is not a Blender file.',nomesh:'No mesh found in that .blend file.'})[e&&e.message]||'Could not read that .blend file. In Blender, export a .glb instead.',8000)});
    return}

    if(!has)return hint('No mesh found in that file');setHigh(root);hint('Loaded '+f.name)};
  r.onload=e=>{const d=e.target.result;try{
    if(name.endsWith('.obj'))fromObj(new OBJLoader().parse(d));

    else if(name.endsWith('.ply')){setHigh(geoMesh(new PLYLoader().parse(d)))}
    else if(name.endsWith('.fbx'))fromObj(new FBXLoader().parse(d,''));
    else if(name.endsWith('.dae'))fromObj(new ColladaLoader().parse(d,'').scene);
    else new GLTFLoader().parse(d,'',gl=>fromObj(gl.scene),er=>hint('Could not read file'));
  }catch(err){console.error(err);hint('Could not read file')}};
  (name.endsWith('.obj')||name.endsWith('.dae'))?r.readAsText(f):r.readAsArrayBuffer(f);

// ---------- .blend reader (meshes only, Blender 2.6 to 5.x layouts) ----------
async function blendBytes(buf){

    return new Uint8Array(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer())}
