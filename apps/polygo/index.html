<style>
/* Layout: full-screen 3D canvas, one slim tool column on the right, contextual bars only when needed */
:root{--bg:#e9ecf1;--scene:#e9ecf1;--panel:#ffffff;--fg:#1c2330;--muted:#5b6474;--accent:#2f7de1;--danger:#d63a3a;--shadow:rgba(20,32,56,.2);--scrim:rgba(10,14,22,.45)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#14171c;--scene:#1a1e25;--panel:#272c35;--fg:#e7eaf0;--muted:#9aa3b3;--accent:#5ba1ff;--danger:#ff6b6b;--shadow:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--scene:#1a1e25;--panel:#272c35;--fg:#e7eaf0;--muted:#9aa3b3;--accent:#5ba1ff;--danger:#ff6b6b;--shadow:rgba(0,0,0,.55);--scrim:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
canvas{display:block;position:fixed;inset:0}
#bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end;max-height:calc(100% - 20px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow-y:auto;padding:2px 4px 6px 8px}
.b{width:44px;height:44px;flex:none;border-radius:50%;border:none;background:var(--panel);color:var(--fg);box-shadow:0 2px 6px var(--shadow);font-size:20px;cursor:pointer}
.b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b.off{opacity:.4}
.b.on{background:var(--accent);color:#fff}
#lassoSvg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;overflow:visible}
#lassoSvg .rope{fill:none;stroke:#c9a06a;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#lassoSvg #lsPath{fill:rgba(201,160,106,.08)}
#lassoSvg .ropeTwist{fill:none;stroke:#7d5d2e;stroke-width:4;stroke-dasharray:2 7;stroke-linecap:round;stroke-linejoin:round}
#lassoBar{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:calc(100% - 92px);z-index:8}
#lassoBar button{min-height:40px;padding:6px 14px;border:none;border-radius:20px;background:var(--panel);color:var(--fg);box-shadow:0 2px 6px var(--shadow);font-size:14px;cursor:pointer;touch-action:none}
#lassoBar button:disabled{opacity:.45}
#lsMode{display:flex;gap:2px;background:var(--panel);border-radius:20px;padding:3px;box-shadow:0 2px 6px var(--shadow)}
#lsMode button{box-shadow:none;min-height:34px;padding:4px 12px;background:transparent}#lsMode button.on{background:var(--accent);color:#fff;font-weight:600}
#lsCount{font-size:13px;color:var(--fg);background:var(--panel);border-radius:14px;padding:4px 10px;box-shadow:0 2px 6px var(--shadow);font-variant-numeric:tabular-nums}#lsCount:empty{display:none}
#op{width:44px;height:120px;flex:none;writing-mode:vertical-lr;direction:rtl;accent-color:var(--accent)}
#hint{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:0 max(16px,env(safe-area-inset-left,0px)) 0 max(16px,env(safe-area-inset-right,0px));text-align:center;color:var(--fg);font-size:14px;pointer-events:none;transition:opacity .6s;text-shadow:0 0 6px var(--bg),0 0 2px var(--bg)}
#stats{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(10px + env(safe-area-inset-top,0px));font-size:12px;color:var(--muted);pointer-events:none;font-variant-numeric:tabular-nums}
#ask{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));touch-action:auto;z-index:20}
#askF{background:var(--panel);color:var(--fg);border-radius:16px;padding:18px;width:min(340px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px var(--shadow)}
#askT{margin:0;font-size:15px;line-height:1.4}
#askI{font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid var(--muted);background:var(--bg);color:var(--fg)}
#askF .row{display:flex;gap:8px;justify-content:flex-end}
#askF button{font-size:15px;padding:8px 16px;border-radius:20px;border:none;background:var(--bg);color:var(--fg);cursor:pointer}
#askF #askYes{background:var(--accent);color:#fff;font-weight:600}
#autoP{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));touch-action:auto;z-index:20}
#autoF{background:var(--panel);color:var(--fg);border-radius:16px;padding:18px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 8px 30px var(--shadow)}
#autoF .ttl{margin:0;font-size:17px;font-weight:600}
#autoF label{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px}
#autoF .fc{display:flex;flex-direction:column;gap:8px}#autoF .fcTop{display:flex;justify-content:space-between;align-items:baseline;font-size:15px}
#aNv{font-weight:600;font-variant-numeric:tabular-nums}#aN{width:100%;accent-color:var(--accent);min-height:28px}
#aPre{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#aPre button{min-height:48px;border:1px solid transparent;border-radius:10px;background:var(--bg);color:var(--fg);font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px}
#aPre button small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}#aPre button.on{border-color:var(--accent);font-weight:600}
#autoF input[type=range]{flex:1;accent-color:var(--accent)}
#autoF input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
#autoF .note{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
#aKind{display:flex;gap:6px;background:var(--bg);border-radius:12px;padding:4px}
#aKind button{flex:1;min-height:44px;border:none;border-radius:9px;background:transparent;color:var(--fg);font-size:14px;cursor:pointer}
#aKind button.on{background:var(--panel);box-shadow:0 1px 4px var(--shadow);font-weight:600}
#aProg{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
#aProg .bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}#aBar{display:block;height:100%;width:2%;background:var(--accent);transition:width .2s}
#autoF .row{display:flex;gap:8px;justify-content:flex-end}
#autoF .row button{font-size:15px;min-height:44px;padding:8px 16px;border-radius:22px;border:none;background:var(--bg);color:var(--fg);cursor:pointer}
#autoF #aGo{background:var(--accent);color:#fff;font-weight:600}#autoF #aGo:disabled{opacity:.5}
#warn{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(30px + env(safe-area-inset-top,0px));border:none;border-radius:16px;min-height:32px;padding:6px 12px;background:var(--danger);color:#fff;font-size:13px;font-weight:600;box-shadow:0 2px 6px var(--shadow);cursor:pointer;max-width:calc(100% - 90px);text-align:left}
#ringUI .b{position:fixed;z-index:15;background:var(--accent);color:#fff;font-size:22px}#ringUI .b span{display:inline-block}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

</div>
<div id="expMenu" style="position:fixed;right:62px;display:none;flex-direction:column;gap:6px">

<button class="b" style="border-radius:22px;width:auto;padding:0 14px;font-size:14px" data-f="glb">GLB</button>
<button class="b" style="border-radius:22px;width:auto;padding:0 14px;font-size:14px" data-f="stl">STL</button>

</div>
<input type="file" id="file" hidden>
<button class="b" id="bX" title="Cancel unfinished face" style="position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:none;color:var(--danger);font-size:22px">✕</button>
<div id="ask" hidden><form id="askF"><p id="askT"></p><input id="askI" type="number" inputmode="numeric" min="10"><div class="row"><button type="button" id="askNo">Cancel</button><button type="submit" id="askYes">OK</button></div></form></div>
<div id="autoP" hidden><form id="autoF" novalidate>
<p class="ttl">Auto retopology</p>
<div id="aKind"><button type="button" data-k="quad" class="on">Quads that follow the shape</button><button type="button" data-k="tri">Quick triangles</button></div>
<div class="fc"><div class="fcTop"><label for="aN">Faces</label><output id="aNv" for="aN">about 1,000</output></div>
<input id="aN" type="range" min="0" max="100" step="1" value="50" aria-describedby="aNv">
<div id="aPre"><button type="button" data-n="300">Light<small>300</small></button><button type="button" data-n="1000">Medium<small>1,000</small></button><button type="button" data-n="3000">Detailed<small>3,000</small></button><button type="button" data-n="8000">Dense<small>8,000</small></button></div></div>
<label id="aSmL" for="aSm">Smoothness <input id="aSm" type="range" min="0" max="1" step="0.05" value="0.5"></label>
<label id="aMiL" for="aMi">Mirror across the centre line <input id="aMi" type="checkbox"></label>
<p class="note">Replaces your low-poly mesh. Undo brings it back. Big counts on dense sculpts can take a minute on a phone.</p>

<div class="row"><button type="button" id="aNo">Cancel</button><button type="submit" id="aGo">Make quads</button></div>
</form></div>
<button id="warn" hidden title="Show the next problem face"></button>

<div id="lassoBar" hidden><div id="lsMode"><button type="button" data-k="pts" class="on">Points</button><button type="button" data-k="faces">Faces</button></div>
<span id="lsCount"></span><button type="button" id="lsScale" disabled title="Drag left or right to scale">⤢ Scale</button><button type="button" id="lsDel" disabled>Delete</button><button type="button" id="lsDone">Done</button></div>

<script type="text/plain" id="qremeshSrc">
// Polygo quad remesher: the Instant Meshes method (Jakob, Tarini, Panozzo, Sorkine-Hornung 2015), written in JS.
// 1) build a graph hierarchy of the sculpt, 2) smooth a 4-way orientation field, 3) smooth a position field
// (a square lattice laid over the surface), 4) collapse and connect lattice points into a quad mesh, then
// 5) project it onto the sculpt and relax it. Runs in a Web Worker; nothing here touches the page.
'use strict';
const QREMESH = (() => {
const dot = (a, i, b, j) => a[i] * b[j] + a[i + 1] * b[j + 1] + a[i + 2] * b[j + 2];
function shuffle(n, seed) { const a = new Int32Array(n); for (let i = 0; i < n; i++) a[i] = i; let s = seed >>> 0 || 1;
  for (let i = n - 1; i > 0; i--) { s = (s * 1664525 + 1013904223) >>> 0; const j = s % (i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function csr(n, pairs) {           // adjacency lists from a Set of i*n+j keys (i<j)
  const deg = new Int32Array(n + 1);
  for (const k of pairs) { const i = Math.floor(k / n), j = k - i * n; deg[i + 1]++; deg[j + 1]++; }
  for (let i = 0; i < n; i++) deg[i + 1] += deg[i];
  const adj = new Int32Array(deg[n]), fill = deg.slice(0, n);
  for (const k of pairs) { const i = Math.floor(k / n), j = k - i * n; adj[fill[i]++] = j; adj[fill[j]++] = i; }
  return { off: deg, adj };
}
// ---- level 0: the sculpt merged onto a fine grid (keeps it fast on dense sculpts)
function baseLevel(P, I, cell, sym) {
  const nv = P.length / 3, key = new Map(), cid = new Int32Array(nv).fill(-1);
  const sums = [], cnt = [];
  const keep = new Uint8Array(I.length / 3);
  for (let t = 0; t < I.length / 3; t++) {
    if (sym) { const cx = (P[I[t * 3] * 3] + P[I[t * 3 + 1] * 3] + P[I[t * 3 + 2] * 3]) / 3; if (cx < 0) continue; }
    keep[t] = 1;
  }
  const X = i => sym ? Math.max(0, P[i * 3]) : P[i * 3];
  for (let t = 0; t < keep.length; t++) if (keep[t]) for (let k = 0; k < 3; k++) {
    const v = I[t * 3 + k]; if (cid[v] >= 0) continue;
    const kx = Math.floor(X(v) / cell) + 65536, ky = Math.floor(P[v * 3 + 1] / cell) + 65536, kz = Math.floor(P[v * 3 + 2] / cell) + 65536;
    const kk = (kx * 131072 + ky) * 131072 + kz;     // stays below 2^53, so distinct cells never collide
    let c = key.get(kk); if (c === undefined) { c = cnt.length; key.set(kk, c); cnt.push(0); sums.push(0, 0, 0); }
    cid[v] = c; cnt[c]++; sums[c * 3] += X(v); sums[c * 3 + 1] += P[v * 3 + 1]; sums[c * 3 + 2] += P[v * 3 + 2];
  }
  const n = cnt.length, pos = new Float64Array(n * 3), nrm = new Float64Array(n * 3), area = new Float64Array(n);
  for (let c = 0; c < n; c++) for (let k = 0; k < 3; k++) pos[c * 3 + k] = sums[c * 3 + k] / cnt[c];
  const pairs = new Set(), tris = [];
  for (let t = 0; t < keep.length; t++) {
    if (!keep[t]) continue;
    const a = I[t * 3], b = I[t * 3 + 1], c = I[t * 3 + 2];
    const ux = X(b) - X(a), uy = P[b * 3 + 1] - P[a * 3 + 1], uz = P[b * 3 + 2] - P[a * 3 + 2];
    const vx = X(c) - X(a), vy = P[c * 3 + 1] - P[a * 3 + 1], vz = P[c * 3 + 2] - P[a * 3 + 2];
    const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, ar = 0.5 * Math.hypot(nx, ny, nz);
    const A = cid[a], B = cid[b], C = cid[c];
    for (const q of [A, B, C]) { nrm[q * 3] += nx; nrm[q * 3 + 1] += ny; nrm[q * 3 + 2] += nz; area[q] += ar / 3; }
    if (A === B || B === C || A === C) continue;
    tris.push(A, B, C);
    for (const [i, j] of [[A, B], [B, C], [C, A]]) pairs.add(i < j ? i * n + j : j * n + i);
  }
  for (let c = 0; c < n; c++) { const l = Math.hypot(nrm[c * 3], nrm[c * 3 + 1], nrm[c * 3 + 2]) || 1; for (let k = 0; k < 3; k++) nrm[c * 3 + k] /= l; }
  const { off, adj } = csr(n, pairs);
  return { n, pos, nrm, area, off, adj, tris: Int32Array.from(tris) };
}
// ---- coarser levels: pair up neighbours with similar normals (follows the surface, never jumps across gaps)
function coarsen(L, seed) {
  const n = L.n, match = new Int32Array(n).fill(-1), order = shuffle(n, seed);
  for (const i of order) {
    if (match[i] >= 0) continue; let best = -1, bs = -2;
    for (let e = L.off[i]; e < L.off[i + 1]; e++) { const j = L.adj[e]; if (match[j] >= 0) continue; const s = dot(L.nrm, i * 3, L.nrm, j * 3); if (s > bs) { bs = s; best = j; } }
    if (best >= 0 && bs > -0.2) { match[i] = best; match[best] = i; } else match[i] = i;
  }
  const parent = new Int32Array(n).fill(-1); let m = 0;
  for (let i = 0; i < n; i++) if (parent[i] < 0) { parent[i] = m; parent[match[i]] = m; m++; }
  const pos = new Float64Array(m * 3), nrm = new Float64Array(m * 3), area = new Float64Array(m);
  for (let i = 0; i < n; i++) { const p = parent[i], w = L.area[i] + 1e-12; area[p] += w;
    for (let k = 0; k < 3; k++) { pos[p * 3 + k] += L.pos[i * 3 + k] * w; nrm[p * 3 + k] += L.nrm[i * 3 + k] * w; } }
  for (let p = 0; p < m; p++) { for (let k = 0; k < 3; k++) pos[p * 3 + k] /= area[p];
    const l = Math.hypot(nrm[p * 3], nrm[p * 3 + 1], nrm[p * 3 + 2]);
    if (l < 1e-9) { for (let i = 0; i < n; i++) if (parent[i] === p) { for (let k = 0; k < 3; k++) nrm[p * 3 + k] = L.nrm[i * 3 + k]; break; } }
    else for (let k = 0; k < 3; k++) nrm[p * 3 + k] /= l; }
  const pairs = new Set();
  for (let i = 0; i < n; i++) for (let e = L.off[i]; e < L.off[i + 1]; e++) { const a = parent[i], b = parent[L.adj[e]]; if (a !== b) pairs.add(a < b ? a * m + b : b * m + a); }
  const { off, adj } = csr(m, pairs);
  L.parent = parent;
  return { n: m, pos, nrm, area, off, adj };
}
// ---- field maths (as in the Instant Meshes source)
const A0 = new Float64Array(3), A1 = new Float64Array(3), B0 = new Float64Array(3), B1 = new Float64Array(3);
function cross(o, a, i, b, j) { o[0] = a[i + 1] * b[j + 2] - a[i + 2] * b[j + 1]; o[1] = a[i + 2] * b[j] - a[i] * b[j + 2]; o[2] = a[i] * b[j + 1] - a[i + 1] * b[j]; }
// best-matching pair among {q0, n0×q0} and {q1, n1×q1}; result into ra, rb
function compatOrient(q, i, n, j, ra, rb) {
  A0[0] = q[i]; A0[1] = q[i + 1]; A0[2] = q[i + 2]; cross(A1, n, i, q, i);
  B0[0] = q[j]; B0[1] = q[j + 1]; B0[2] = q[j + 2]; cross(B1, n, j, q, j);
  const As = [A0, A1], Bs = [B0, B1]; let bs = -1, ba = 0, bb = 0;
  for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) { const s = Math.abs(As[a][0] * Bs[b][0] + As[a][1] * Bs[b][1] + As[a][2] * Bs[b][2]); if (s > bs) { bs = s; ba = a; bb = b; } }
  const A = As[ba], B = Bs[bb], sg = (A[0] * B[0] + A[1] * B[1] + A[2] * B[2]) < 0 ? -1 : 1;
  ra[0] = A[0]; ra[1] = A[1]; ra[2] = A[2]; rb[0] = B[0] * sg; rb[1] = B[1] * sg; rb[2] = B[2] * sg;
}
function middle(p, i, n, j, out) {     // a point on both tangent planes, near the edge middle

    LS.pt += dt; const u = Math.min(1, LS.pt / 0.2), cx = LS.poly.reduce((a, p) => a + p[0], 0) / LS.poly.length, cy = LS.poly.reduce((a, p) => a + p[1], 0) / LS.poly.length, sc = 1 - 0.06 * u;
    const tf = `translate(${cx} ${cy}) scale(${sc}) translate(${-cx} ${-cy})`; lsPath.setAttribute('transform', tf); lsPath2.setAttribute('transform', tf);
    ropeTo(cx, cy);
    if (u >= 1) { LS.sel = LS.pending || new Set(); LS.pending = null; LS.ver = meshVer; LS.phase = 'held'; LS.fade = 0.45; lassoRefresh();
      if (LS.sel.size) { LS.hud.setMode('hold'); hint('Caught ' + $('lsCount').textContent + '. Drag them to move, use Scale, or Delete', 4500); }
      else { LS.hud.setMode('swing'); hint('Nothing inside that loop. Try again', 3000); } }
  } else if (LS.phase === 'held') {
    if (LS.fade > 0) { LS.fade = Math.max(0, LS.fade - dt); const o = LS.fade / 0.45; lsPath.style.opacity = o; lsPath2.style.opacity = o; }
    const ids = selVerts(F, LS.sel, LS.kind).filter(i => V[i]);
    if (ids.length) { const s = scr(centroidOf(ids)); ropeTo(s[0], s[1]); } else { lsTether.setAttribute('d', ''); if (LS.hud.mode !== 'swing') LS.hud.setMode('swing'); }
  }
}
// moving and scaling the catch (mirror keeps the other side matched; snapping presses it back onto the sculpt on release)
function onSel(x, y) {
  const ids = selVerts(F, LS.sel, LS.kind);
  for (const i of ids) { const s = scr(V[i]); if (Math.hypot(s[0] - x, s[1] - y) < 30) return true; }
  if (LS.kind === 'faces') for (const fi of LS.sel) { const f = F[fi]; if (f && pointInPoly(x, y, f.map(v => scr(V[v])))) return true; }
  return false;
}
function beginEdit(kind, x, y) {
  const ids = selVerts(F, LS.sel, LS.kind), twins = [], center = new Set();
  if (mirOn) { const set = new Set(ids); for (const i of ids) { const m = mir(i); if (m === i) center.add(i); else if (m >= 0 && !set.has(m)) twins.push([i, m]); } }
  save(); LS.ver = meshVer;
  const c = centroidOf(ids), plane = new THREE.Plane().setFromNormalAndCoplanarPoint(cam.getWorldDirection(new THREE.Vector3()), new THREE.Vector3(...c));
  LS.drag = { kind, ids, twins, center, base: ids.map(i => V[i].slice()), c, x0: x, y0: y, plane, start: rayPlane(x, y, plane) };
  controls.enabled = false;
}
function rayPlane(x, y, plane) { rc.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -y / innerHeight * 2 + 1), cam); return rc.ray.intersectPlane(plane, new THREE.Vector3()); }
function startMove(x, y) { beginEdit('move', x, y); }
function dragSel(x, y) {
  const D = LS.drag; if (!D) return;
  if (D.kind === 'move') { const p = rayPlane(x, y, D.plane); if (!p || !D.start) return; const d = p.sub(D.start);
    D.ids.forEach((i, k) => { V[i] = [D.base[k][0] + d.x, D.base[k][1] + d.y, D.base[k][2] + d.z]; }); }
  else { const f = Math.exp((x - D.x0) / 120);
    D.ids.forEach((i, k) => { V[i] = D.base[k].map((v, q) => D.c[q] + (v - D.c[q]) * f); }); }
  for (const i of D.center) V[i][0] = 0;
  for (const [i, m] of D.twins) V[m] = mp(V[i]);
  rebuild();
}
function endDrag() {
  const D = LS.drag; LS.drag = null; setTimeout(() => controls.enabled = true, 0); if (!D) return;
  if (!free()) { for (const i of D.ids) { V[i] = snap(V[i], vnorm(i)); if (D.center.has(i)) V[i][0] = 0; } for (const [i, m] of D.twins) V[m] = mp(V[i]); }
  LS.ver = meshVer; rebuild();
}
$('lsScale').addEventListener('pointerdown', e => { if (!LS.sel.size) return; e.preventDefault(); $('lsScale').setPointerCapture(e.pointerId); beginEdit('scale', e.clientX, e.clientY); hint('Drag right to grow, left to shrink', 2500); });
$('lsScale').addEventListener('pointermove', e => { if (LS.drag && LS.drag.kind === 'scale') dragSel(e.clientX, e.clientY); });
const endScale = () => { if (LS.drag && LS.drag.kind === 'scale') endDrag(); };
$('lsScale').addEventListener('pointerup', endScale); $('lsScale').addEventListener('pointercancel', endScale);
$('lsDel').onclick = () => {
  if (!LS.sel.size) return; save();
  const r = deleteSel(V, F, LS.sel, LS.kind, mirOn ? mir : null);
  V = r.V; F = r.F; pend = []; LS.sel.clear(); LS.ver = meshVer; LS.phase = 'idle'; lsTether.setAttribute('d', ''); LS.hud.setMode('swing'); rebuild();
  hint('Deleted ' + (LS.kind === 'pts' ? r.points + (r.points === 1 ? ' point' : ' points') : r.faces + (r.faces === 1 ? ' face' : ' faces')), 3000);
};

function resize(){hudResize();renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();demo();TUTO.setOn(true);hint(HELP);
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{const dt=clock.getDelta();controls.update();TUTO.update(dt);renderer.render(scene,cam);
  if(LS.on){lassoFrame(dt);renderer.autoClear=false;renderer.clearDepth();renderer.render(hudScene,hudCam);renderer.autoClear=true}});
</script>
