<!DOCTYPE html>
<html lang="en" data-app>
<head data-app>
<meta charset="utf-8" data-app>
<meta name="viewport" content="width=device-width,initial-scale=1" data-app>
<title data-app>INshop — design your space in 3D and VR</title>
<link rel="icon" href="icon-192.png" data-app>
<link rel="manifest" href="manifest.webmanifest" data-app>
<link rel="apple-touch-icon" href="icon-180.png" data-app>
<meta name="theme-color" content="#ff3df0" data-app>

<style data-app>
/* VOICE: late-night workshop for an underground indie arcade — confident, playful, precise.
   IDEA: a level editor; the viewport is the stage, panels are the dev console beside it.
   PICTURE: the live 3D room itself, filling everything between the panels.
   COLOUR and TYPE: near-black violet ground, neon pink for action, teal for focus; Chakra Petch for labels, Inter for text.
   LAYOUT: header bar, catalog left, viewport centre, inspector right; bottom sheets under 900px. */
:root{color-scheme:dark;--bg:#0c0a12;--panel:#15121d;--panel2:#1d1928;--line:#2c2639;--ink:#efeaf7;--mute:#a39cb6;--pink:#ff3df0;--teal:#2ef2d0;--danger:#ff6b86}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{height:56px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:6}
.brand{display:flex;align-items:center;gap:8px;font:700 17px 'Chakra Petch',sans-serif;white-space:nowrap}
.brand svg{width:26px;height:26px}
.brand small{color:var(--mute);font-weight:500;font-size:13px}
#projName{background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 8px;width:190px}
#projName:hover,#projName:focus{border-color:var(--line);background:var(--panel2);outline:none}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--mute);font-weight:600;min-height:32px}
.seg button.on{background:var(--panel2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--teal)}
.sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel2);padding:7px 12px;border-radius:9px;cursor:pointer;min-height:38px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#4d4463}
.btn:disabled{opacity:.4;cursor:default}
.btn.hot{background:var(--pink);border-color:var(--pink);color:#21001c;font-weight:700}
.btn.danger{color:var(--danger)}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{display:grid;grid-template-columns:284px minmax(0,1fr) 300px;height:calc(100% - 56px);position:relative}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
#right{border-right:0;border-left:1px solid var(--line)}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:10px 4px;cursor:pointer;color:var(--mute);font-weight:600;border-bottom:2px solid transparent;min-height:46px}
.tabs button.on{color:var(--ink);border-color:var(--pink)}
.pane{padding:14px;display:none}.pane.on{display:block}
h3{font:600 13px 'Chakra Petch',sans-serif;color:var(--mute);margin:18px 0 8px}
h3:first-child{margin-top:0}
h2{font:700 19px/1.15 'Chakra Petch',sans-serif;margin:0 0 4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:5px 4px 8px;cursor:pointer;text-align:center;font-size:12px;line-height:1.2;position:relative}
.card:hover{border-color:#4d4463}
.card.on{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.card img{width:100%;aspect-ratio:1;object-fit:contain;display:block;margin-bottom:4px}
.card img:not([src]){visibility:hidden}
.card .x{position:absolute;top:2px;right:2px;width:26px;height:26px;border-radius:7px;border:0;background:#0009;color:var(--mute);cursor:pointer;font-size:15px;line-height:1}
.drop{display:block;border:1.5px dashed #4d4463;border-radius:12px;padding:20px 14px;text-align:center;cursor:pointer;color:var(--mute);background:var(--panel2)}
.drop b{color:var(--ink);display:block;font-size:15px;margin-bottom:4px}
.drop.over{border-color:var(--teal);color:var(--ink)}
.note{color:var(--mute);font-size:12.5px;margin:10px 0 0}
#vp{position:relative;overflow:hidden;background:#07060b}
#vp canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
.tools{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:4px;background:#15121dd9;border:1px solid var(--line);border-radius:12px;padding:5px;backdrop-filter:blur(6px)}
.tools button{width:44px;height:44px;border-radius:9px;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;color:var(--mute)}
.tools button:hover{color:var(--ink)}
.tools button.on{background:var(--panel2);color:var(--teal)}
.tools svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tools hr{border:0;border-top:1px solid var(--line);margin:2px 4px;width:auto}
#hint{position:absolute;left:72px;bottom:12px;right:12px;pointer-events:none}
#hint span{background:#0c0a12d9;padding:6px 10px;border-radius:8px;border:1px solid var(--line);display:inline-block;color:var(--mute);font-size:13px}
#measure{position:absolute;pointer-events:none;background:var(--teal);color:#00201a;font-weight:700;font-size:12px;padding:3px 7px;border-radius:6px;display:none;transform:translate(14px,-30px);white-space:nowrap}
#labels span{position:absolute;transform:translate(-50%,-50%);background:#0c0a12cc;border:1px solid var(--line);color:var(--ink);font-size:11.5px;padding:1px 6px;border-radius:5px;white-space:nowrap;pointer-events:none}
#walkpad{position:absolute;right:14px;bottom:14px;display:none;grid-template-columns:repeat(3,52px);gap:6px}
#walkpad button{width:52px;height:52px;border-radius:14px;border:1px solid var(--line);background:#15121dd9;font-size:20px;touch-action:none;cursor:pointer}
#walkpad .e{visibility:hidden}
#status{position:absolute;inset:0;display:grid;place-items:center;color:var(--mute);text-align:center;padding:24px;pointer-events:none}
.field{display:grid;grid-template-columns:92px minmax(0,1fr);align-items:center;gap:8px;margin-bottom:8px}
.field>label{color:var(--mute);font-size:13px}
.in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-height:38px}
textarea.in{resize:vertical;min-height:58px}
.unit{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px}
.unit input{border:0;background:transparent;padding:7px 8px;width:100%;min-height:36px;outline:none}
.unit span{color:var(--mute);font-size:12px;padding-right:8px}
.unit:focus-within{border-color:var(--teal)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:10px}
.trio label{font-size:11.5px;color:var(--mute);display:block;margin-bottom:2px}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0;cursor:pointer;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--teal)}
input[type=color].in{padding:3px;height:38px}
input[type=range]{width:100%;accent-color:var(--pink)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.objs{display:flex;flex-direction:column;gap:2px;max-height:320px;overflow:auto;margin-top:6px}
.objs button{display:flex;justify-content:space-between;gap:8px;text-align:left;background:transparent;border:0;border-radius:7px;padding:7px 8px;cursor:pointer;min-height:34px}
.objs button:hover{background:var(--panel2)}
.objs small{color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
.stats div{background:var(--panel2);border-radius:10px;padding:8px}
.stats b{display:block;font:700 18px 'Chakra Petch',sans-serif}
.stats span{color:var(--mute);font-size:12px}
kbd{font:12px Inter,sans-serif;background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px}
.keys{color:var(--mute);font-size:12.5px;line-height:2}
.pop{position:absolute;top:52px;right:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;display:none;flex-direction:column;min-width:250px;z-index:20;box-shadow:0 18px 50px #000a}
.pop.on{display:flex}
.pop button{text-align:left;background:transparent;border:0;border-radius:8px;padding:9px 10px;cursor:pointer;min-height:40px}
.pop button:hover{background:var(--panel2)}
.pop small{display:block;color:var(--mute);font-size:12px}
.pop hr{border:0;border-top:1px solid var(--line);margin:4px}
#modal{position:fixed;inset:0;background:#05040acc;display:none;place-items:center;z-index:40;padding:16px}
#modal.on{display:grid}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:480px;width:100%;max-height:90vh;overflow:auto}
#modal p,#modal li{color:#cfc8de}
#modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#120f18;padding:9px 14px;border-radius:10px;font-weight:600;display:none;z-index:50;max-width:90vw}
.mob{display:none}
#envSeg{position:absolute;right:12px;top:12px;background:#15121dd9;backdrop-filter:blur(6px)}
#catQ{margin-bottom:4px}
.card.hide,h3.hide,.grid.hide{display:none}
@media(max-width:560px){#envSeg button{padding:5px 8px;font-size:12.5px}}
@media(max-width:1100px){#projName{width:130px}.brand small{display:none}}
@media(max-width:900px){
 main{grid-template-columns:minmax(0,1fr)}
 aside{position:absolute;left:0;right:0;bottom:0;max-height:60%;z-index:8;transform:translateY(105%);transition:transform .2s;border:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;box-shadow:0 -14px 40px #000a}
 #right{border-left:0}
 aside.open{transform:none}
 .mob{display:inline-flex}
 #projName,.hide-s{display:none}
 #hint{left:12px;bottom:64px}
 #walkpad{bottom:64px}
 .in,.unit input{font-size:16px}
}
@media(max-width:560px){header{gap:6px;padding:0 8px}.brand span{display:none}.seg button{padding:5px 9px}.btn{padding:7px 9px}.lbl{display:none}}
@media(prefers-reduced-motion:reduce){aside{transition:none}}
</style>

setTimeout(()=>{if(!window.__ready){const s=document.getElementById('status');if(s)s.textContent='Still loading… the 3D engine comes from cdn.jsdelivr.net. If this persists, reload the page.'}},9000);

function restore(s){const a=S.assets;S=norm(JSON.parse(s));S.assets=a;fullRebuild();renderAll();persist();updUndo()}
function undo(){if(!hist.length)return;fut.push(last);last=hist.pop();restore(last)}
function redo(){if(!fut.length)return;hist.push(last);last=fut.pop();restore(last)}
function updUndo(){$('#undo').disabled=!hist.length;$('#redo').disabled=!fut.length}

  ${f.includes('color')?`<div class="field"><label for="f_color">${d.lcolor||(it.type==='bar'?'Wood tint':it.type==='sign'?'Board':'Body')}</label><input class="in" type="color" id="f_color" data-f="color" data-u="raw" value="${esc(it.color||'#888888')}"></div>`:''}
  ${f.includes('glow')?`<div class="field"><label for="f_glow">${d.lglow||'Glow'}</label><input class="in" type="color" id="f_glow" data-f="glow" data-u="raw" value="${esc(it.glow||'#ffffff')}"></div>`:''}
  ${f.includes('a')?lenF('a',d.la,it.a??d.a):''}${f.includes('b')?lenF('b',d.lb,it.b??d.b):''}
  ${f.includes('board')?`<label class="chk"><input type="checkbox" data-f="board" data-u="chk" ${it.board!==false?'checked':''}> ${d.lboard||'Backboard'}</label>`:''}${f.includes('lit')?`<label class="chk"><input type="checkbox" data-f="lit" data-u="chk" ${it.lit?'checked':''}> ${d.llit||'Lightbox glow'}</label>`:''}${f.includes('light')?`<label class="chk"><input type="checkbox" data-f="light" data-u="chk" ${it.light!==false?'checked':''}> Casts light</label>`:''}
  <label class="chk"><input type="checkbox" data-f="lock" data-u="chk" ${it.lock?'checked':''}> Lock in place</label>

  I.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{gizmo=b.dataset.g;attachGizmo();I.querySelectorAll('[data-g]').forEach(x=>x.classList.toggle('on',x===b))});

  I.querySelector('[data-act=dup]').onclick=dup;I.querySelector('[data-act=del]').onclick=del;const ws=I.querySelector('[data-act=wallsnap]');if(ws)ws.onclick=()=>{wallSnap(it,o);place(o,it);refreshInsp();commit()};const li=I.querySelector('[data-act=loadimg]');if(li)li.onclick=()=>{imgTarget=it.id;$('#imgIn').click()};return}
 if(sel.kind==='floor'){const fl=getFloor(sel.id);I.innerHTML=`<h2>Floor area</h2><p class="sub">${fmtLen(fl.w)} × ${fmtLen(fl.d)} · drag it in the view to move it</p><div class="field"><label for="f_fm">Finish</label><select class="in" id="f_fm" data-f="mat" data-u="raw">${surfOptions(fl.mat)}</select></div>${trioLen([['w','Width',fl.w],['d','Depth',fl.d]]).replace('trio','trio" style="grid-template-columns:1fr 1fr')}${trioLen([['x','X',fl.x],['z','Z',fl.z]]).replace('trio','trio" style="grid-template-columns:1fr 1fr')}<div class="field"><label for="f_ry">Rotation</label><div class="unit"><input id="f_ry" data-f="ry" data-u="deg" type="number" step="15" value="${Math.round((fl.ry||0)/DEG)}"><span>°</span></div></div><div class="actions"><button class="btn danger" data-act="del" style="grid-column:1/-1">Delete floor area</button></div>`;I.querySelector('[data-act=del]').onclick=del;return}
 if(sel.kind==='wall'){const w=getWall(sel.id);I.innerHTML=`<h2>Wall</h2><p class="sub">${fmtLen(wlen(w))} long</p>${lenF('len','Length',wlen(w))}${lenF('h','Height',w.h||S.room.h)}${lenF('t','Thickness',w.t||.15,.05)}

 const o=getOpen(sel.id),w=getWall(o.wall),T=OPEN[o.kind],cs=T[o.style]?o.style:Object.keys(T)[0];I.innerHTML=`<h2>${esc(T[cs][0])}</h2><p class="sub">Drag it in the view to slide it along its wall</p><div class="field"><label for="f_st">Style</label><select class="in" id="f_st" data-f="style" data-u="raw">${Object.entries(T).map(([k,v])=>`<option value="${k}" ${k===cs?'selected':''}>${v[0]}</option>`).join('')}</select></div>${lenF('w','Width',o.w)}${lenF('h','Height',o.h)}${o.kind==='window'?lenF('sill','Sill height',o.sill):''}${lenF('pos','From wall start',o.pos)}
  ${o.kind==='door'&&cs!=='doorway'?`<label class="chk"><input type="checkbox" data-f="open" data-u="chk" ${o.open?'checked':''}> ${cs==='rollup'?'Raised (walkable)':'Open (walkable)'}</label><div class="field"><label for="f_dc">Door colour</label><input class="in" type="color" id="f_dc" data-f="color" data-u="raw" value="${esc(o.color||'#3a2a22')}"></div>`:''}
  <div class="actions"><button class="btn" data-act="wall">Select wall</button><button class="btn danger" data-act="del">Delete</button></div>`;
 I.querySelector('[data-act=wall]').onclick=()=>select({kind:'wall',id:w.id});I.querySelector('[data-act=del]').onclick=del}
function fieldVal(k){if(sel?.kind!=='item')return null;const it=getItem(sel.id),o=objs.get(it?.id);if(!it)return null;const b=o?.userData.base;switch(k){case'x':case'z':return+toU(it[k]).toFixed(2);case'y':return+toU(it.y||0).toFixed(2);case'ry':return Math.round((it.ry||0)/DEG);case'sw':return b&&+toU(b.x*it.sx).toFixed(2);case'sh':return b&&+toU(b.y*it.sy).toFixed(2);case'sd':return b&&+toU(b.z*it.sz).toFixed(2)}return null}
function refreshInsp(){if(sel?.kind==='floor'){const fl=getFloor(sel.id);for(const k of['x','z']){const el=$('#f_'+k);if(el&&fl&&document.activeElement!==el)el.value=+toU(fl[k]).toFixed(2)}return}if(sel?.kind==='open'){const el=$('#f_pos'),o=getOpen(sel.id);if(el&&o&&document.activeElement!==el)el.value=+toU(o.pos).toFixed(2);return}$$('#insp [data-f]').forEach(el=>{if(el===document.activeElement)return;const v=fieldVal(el.dataset.f);if(v!=null)el.value=v})}
function onField(e,final){const el=e.target,k=el.dataset.f;if(!k||!sel)return;const u=el.dataset.u;let v=u==='chk'?el.checked:el.value;if(u==='len')v=fromU(parseFloat(v));else if(u==='deg')v=parseFloat(v)*DEG;if((u==='len'||u==='deg')&&!isFinite(v))return;
 if(sel.kind==='item'){const it=getItem(sel.id),o=objs.get(it.id);
  if(k==='x'||k==='z'){it[k]=v;place(o,it)}else if(k==='y'){it.y=Math.max(0,v);place(o,it)}else if(k==='ry'){it.ry=v;place(o,it)}
  else if(k==='sw'||k==='sh'||k==='sd'){const ax={sw:'x',sh:'y',sd:'z'}[k],sk={sw:'sx',sh:'sy',sd:'sz'}[k],bv=o.userData.base[ax]||1,ns=clamp(v/bv,.02,100);if(S.ui.uniform){const f=ns/(it[sk]||1);it.sx*=f;it.sy*=f;it.sz*=f}else it[sk]=ns;place(o,it);if(final)refreshInsp()}
  else if(k==='name'){it.name=String(v).slice(0,60)}else if(k==='lock'){it.lock=v;attachGizmo()}else if(k==='a'||k==='b'||k==='c'){if(v>.05){it[k]=v;buildItem(it)}}else if(k==='asset'){it.asset=v||undefined;buildItem(it)}else{it[k]=v;buildItem(it)}}
 else if(sel.kind==='floor'){const fl=getFloor(sel.id);if(k==='mat')fl.mat=v;else if(k==='ry')fl.ry=v;else if(k==='w'||k==='d'){if(v>.2)fl[k]=v}else fl[k]=v;buildPatches();if(final){buildFloor();renderInsp()}}
 else if(sel.kind==='wall'){const w=getWall(sel.id);if(k==='len'){const L=wlen(w);if(v>.1&&L>0){w.x2=w.x1+(w.x2-w.x1)/L*v;w.z2=w.z1+(w.z2-w.z1)/L*v}}else if(k==='mat')w.mat=v;else if(['h','t'].includes(k)){if(v>.02)w[k]=v}else w[k]=v;buildWalls();if(final){buildFloor();renderInsp()}}
 else{const o=getOpen(sel.id),L=wlen(getWall(o.wall));if(k==='style'){const d=openDefaults(o.kind,v);Object.assign(o,{style:d.style,w:Math.min(d.w,L-.1),h:d.h,sill:d.sill});o.pos=clamp(o.pos,o.w/2,L-o.w/2);buildWalls();commit();renderInsp();return}if(['w','h','sill','pos'].includes(k)){if(!(v>=0))return;o[k]=v;o.w=clamp(o.w,.3,L);o.pos=clamp(o.pos,o.w/2,L-o.w/2)}else o[k]=v;buildWalls()}
 if(final)commit()}
$('#insp').addEventListener('input',e=>onField(e,false));$('#insp').addEventListener('change',e=>onField(e,true));
function renderAll(){$('#projName').value=S.name;renderRoom();renderAssets();renderInsp();updSnap();hint()}
function rotateSel(a){if(sel?.kind!=='item')return;const it=getItem(sel.id);if(it.lock)return;it.ry=((it.ry||0)+a+Math.PI*3)%(Math.PI*2)-Math.PI;place(objs.get(it.id),it);refreshInsp();commit()}
function dup(){if(sel?.kind!=='item')return;const it=getItem(sel.id),n={...it,id:'i'+uid(),lock:false};const c=Math.cos(it.ry||0),s=Math.sin(it.ry||0),off=(objs.get(it.id)?.userData.base.x||.5)*it.sx+.1;n.x+=c*off;n.z-=s*off;S.items.push(n);buildItem(n);commit();select({kind:'item',id:n.id})}
function del(){if(!sel)return;if(sel.kind==='item'){const o=objs.get(sel.id);if(o){itemG.remove(o);o.traverse(m=>m.geometry?.dispose())}objs.delete(sel.id);S.items=S.items.filter(i=>i.id!==sel.id)}else if(sel.kind==='wall'){S.walls=S.walls.filter(w=>w.id!==sel.id);S.openings=S.openings.filter(o=>o.wall!==sel.id);sel=null;buildWalls();buildFloor()}else if(sel.kind==='floor'){S.floors=S.floors.filter(f=>f.id!==sel.id);sel=null;buildPatches();buildFloor()}else{S.openings=S.openings.filter(o=>o.id!==sel.id);sel=null;buildWalls()}tc.detach();sel=null;commit();renderInsp()}

/* ---------- files ---------- */
async function saveFile(name,data){if(downloads){try{await downloads.save({filename:name,data});toast('Saved '+name);return true}catch(e){if(e?.code==='declined')return false;if(e?.code==='rejected_extension'){toast('This file type can’t be saved here');return false}}}
 if(!inFrame){const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true}
 toast('Saving files isn’t available in this view. Try Copy layout data instead',4200);return false}
function saveLayout(){saveFile(slug(S.name)+'.json',JSON.stringify(S))}
function openLayoutText(t){try{const s=JSON.parse(t);if(!Array.isArray(s.walls)||!Array.isArray(s.items))throw 0;setState(s).then(()=>toast('Layout opened'))}catch(e){toast('That file isn’t a INshop layout')}}
$('#layoutIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(f)openLayoutText(await f.text())};
function exportTour(){const src=window.__SRC;if(!src){toast('Export isn’t available in this view');return}const d=new DOMParser().parseFromString(src,'text/html');d.querySelectorAll('script:not([data-app]),link:not([data-app]),style:not([data-app]),iframe,base,meta[http-equiv]').forEach(x=>x.remove());const seedEl=d.querySelector('#seed');if(!seedEl){toast('Export failed');return}
 seedEl.textContent=JSON.stringify({...S,stamp:Date.now(),openIn:'walk'}).replace(/</g,'\\u003c');saveFile(slug(S.name)+'-vr-tour.html','<!DOCTYPE html>\n'+d.documentElement.outerHTML)}
function exportGLB(){applyModeVis();const ex=new GLTFExporter();helpG.visible=false;tc.visible=false;ex.parse([floorG,wallG,itemG],r=>{applyModeVis();saveFile(slug(S.name)+'.glb',new Blob([r],{type:'model/gltf-binary'}))},err=>{applyModeVis();toast('3D export failed')},{binary:true})}
const menu=$('#menu');$('#fileBtn').onclick=e=>{e.stopPropagation();menu.classList.toggle('on')};document.addEventListener('click',e=>{if(!menu.contains(e.target))menu.classList.remove('on')});
menu.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{menu.classList.remove('on');({save:saveLayout,open:()=>$('#layoutIn').click(),tour:exportTour,glb:exportGLB,
 copy:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Layout copied to the clipboard')}catch(e){toast('Copy was blocked by the browser')}},
 template:()=>confirmIt('Load the arcade template?','This replaces your current layout. Your imported library stays. Save first if you want to keep it.','Load template',()=>{const a=S.assets;const t=template();t.assets=a;S=t;setState(t)}),
 empty:()=>confirmIt('Start an empty room?','This replaces your current layout with a bare 6 × 5 m room. Your imported library stays.','Start fresh',()=>setState(emptyRoom())),vrhelp:()=>vrHelp()})[b.dataset.m]()});

let imgTarget=null;$('#imgIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';const it=getItem(imgTarget);if(!f||!it)return;if(f.size>60e6){toast('That image is over 60 MB');return}const a={id:'a'+uid(),name:f.name.replace(/\.[^.]+$/,'').slice(0,40),kind:'image',ext:f.name.split('.').pop().toLowerCase(),data:await readDURL(f)};try{await loadImg(a)}catch(err){toast('Couldn’t read that image');return}S.assets[a.id]=a;it.asset=a.id;buildItem(it);renderAssets();commit();renderInsp();toast('Image loaded')};

 if(mode==='walk'){keys.add(e.code);if(e.key==='Escape')setMode('orbit');if(e.code.startsWith('Arrow'))e.preventDefault();return}
 const ctrl=e.ctrlKey||e.metaKey,k=e.key.toLowerCase();
 if(ctrl&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(ctrl&&k==='y'){e.preventDefault();redo()}else if(ctrl&&k==='d'){e.preventDefault();dup()}
 else if(e.key==='Delete'||e.key==='Backspace'){if(sel){e.preventDefault();del()}}else if(e.key==='Escape'){if(tool!=='select')setTool('select');else select(null)}

 S.walls.forEach((w,i)=>{const el=labels.children[i];v1.set((w.x1+w.x2)/2,0,(w.z1+w.z2)/2).project(ortho);el.textContent=fmtLen(wlen(w));el.style.left=((v1.x+1)/2*r.width)+'px';el.style.top=((1-v1.y)/2*r.height)+'px'})}
